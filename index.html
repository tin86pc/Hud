<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Camera Hành Trình</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-dark: #000;
            --panel-bg: rgba(15, 15, 20, 0.9);
            --panel-border: rgba(255, 255, 255, 0.12);
            --text-primary: #fff;
            --text-secondary: rgba(255, 255, 255, 0.75);
            --text-muted: rgba(255, 255, 255, 0.45);
            --accent-red: #ff3b30;
            --accent-green: #34c759;
            --accent-yellow: #ff9500;
            --accent-blue: #007aff;
            --accent-orange: #ff6b35;
            --scale: 0.9;

            /* Chiều cao thanh điều khiển - đủ để hiển thị đầy đủ */
            --control-h: 140px;
            --control-w-landscape: 230px;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            overflow: hidden;
        }

        .app {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* === Vùng Video === */
        .video-wrap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100vh - var(--control-h));
            background: #000;
            overflow: hidden;
        }

        #videoPreview {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        #renderCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        /* === Thông tin trên video === */
        .hud {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .rec-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            background: rgba(255, 59, 48, 0.15);
            border: 1px solid rgba(255, 59, 48, 0.3);
            border-radius: 20px;
            font-size: 13px;
            color: var(--accent-red);
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s;
            backdrop-filter: blur(10px);
        }
        .rec-badge.show { opacity: 1; }

        .rec-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-red);
            animation: recPulse 1s infinite;
        }
        @keyframes recPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }

        .gps-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-secondary);
            backdrop-filter: blur(10px);
        }

        .gps-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .gps-dot.green { background: var(--accent-green); }
        .gps-dot.yellow { background: var(--accent-yellow); }
        .gps-dot.red { background: var(--accent-red); }

        /* === Thanh Điều Khiển Dưới === */
        .control-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--control-h);
            background: var(--panel-bg);
            border-top: 1px solid var(--panel-border);
            padding: 10px 16px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 5;
        }

        /* Hàng thông tin - không bị gãy dòng, đều khoảng cách */
        .info-row {
            display: flex;
            flex-wrap: nowrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .info-item {
            display: flex;
            align-items: baseline;
            gap: 3px;
            white-space: nowrap;
        }

        .info-val {
            color: var(--text-secondary);
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }

        .ram-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .ram-bar-bg {
            width: 70px;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .ram-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 3px;
            transition: width 0.4s, background 0.4s;
        }
        .ram-bar-fill.green { background: var(--accent-green); }
        .ram-bar-fill.yellow { background: var(--accent-yellow); }
        .ram-bar-fill.red { background: var(--accent-red); animation: blink 0.8s infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.5} }

        .ram-wrap select {
            padding: 2px 6px;
            border-radius: 5px;
            border: 1px solid var(--panel-border);
            background: rgba(0,0,0,0.3);
            color: var(--text-secondary);
            font-size: 12px;
            outline: none;
        }

        /* Hàng nút bấm - hiển thị đầy đủ, dễ chạm */
        .btn-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 4px 0;
        }

        .btn {
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.08);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            border: 1px solid var(--panel-border);
            flex-shrink: 0;
        }
        .btn:active { transform: scale(0.92); background: rgba(255,255,255,0.15); }
        .btn:disabled { opacity: 0.3; pointer-events: none; }

        .btn-sm {
            width: 48px;
            height: 48px;
            font-size: 20px;
        }

        .btn-record {
            width: 72px;
            height: 72px;
            border-width: 4px;
            border-style: solid;
            border-color: rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.08);
            color: #fff;
            font-size: 28px;
        }
        .btn-record.idle { border-color: rgba(52, 199, 89, 0.5); background: rgba(52, 199, 89, 0.12); }
        .btn-record.recording { border-color: rgba(255, 59, 48, 0.6); background: rgba(255, 59, 48, 0.15); }
        .btn-record.recording::after {
            content: '';
            position: absolute;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--accent-red);
            animation: spin 1.5s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-mirror { color: var(--text-secondary); }
        .btn-save { color: var(--accent-orange); border-color: rgba(255, 107, 53, 0.3); }
        .btn-cam { color: var(--accent-blue); }

        /* === Thông báo === */
        .toast {
            position: fixed;
            bottom: calc(var(--control-h) + 16px);
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: var(--panel-bg);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            backdrop-filter: blur(15px);
            border: 1px solid var(--panel-border);
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            z-index: 100;
            max-width: 90vw;
            text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.warning { border-color: rgba(255, 149, 0, 0.4); }
        .toast.danger { border-color: rgba(255, 59, 48, 0.4); }
        .toast.success { border-color: rgba(52, 199, 89, 0.4); }

        /* === Màn hình NGANG === */
        @media (orientation: landscape) {
            .video-wrap {
                width: calc(100vw - var(--control-w-landscape));
                height: 100vh;
            }

            .control-bar {
                width: var(--control-w-landscape);
                height: 100vh;
                left: auto;
                right: 0;
                bottom: 0;
                flex-direction: column;
                justify-content: space-between;
                padding: 20px 14px;
            }

            .info-row {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
                width: 100%;
            }

            .ram-wrap { width: 100%; }
            .ram-bar-bg { flex: 1; width: auto; }

            .btn-row {
                flex-direction: column;
                gap: 24px;
                padding: 10px 0;
            }

            .toast {
                bottom: 20px;
                right: calc(var(--control-w-landscape) + 20px);
                left: auto;
                transform: translateY(10px);
            }
            .toast.show { transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="app">
    <!-- Vùng Video -->
    <div class="video-wrap">
        <video id="videoPreview" autoplay muted playsinline></video>
        <canvas id="renderCanvas"></canvas>

        <!-- Thông tin trên video -->
        <div class="hud">
            <div class="rec-badge" id="recBadge">
                <span class="rec-dot"></span> Đang quay
            </div>
            <div class="gps-badge">
                <span class="gps-dot red" id="gpsDot"></span>
                <span id="gpsLabel">Tìm tín hiệu</span>
            </div>
        </div>
    </div>

    <!-- Thanh Điều Khiển -->
    <div class="control-bar">
        <!-- Hàng thông tin - không bị gãy dòng -->
        <div class="info-row">
            <div class="info-item">
                <span>Đoạn:</span>
                <span class="info-val" id="segCount">0</span>
            </div>
            <div class="info-item">
                <span>Thời gian:</span>
                <span class="info-val" id="durTime">0.0s</span>
            </div>
            <div class="info-item">
                <span>Kích thước:</span>
                <span class="info-val" id="sizeVal">0B</span>
            </div>
            <div class="ram-wrap">
                <span>RAM:</span>
                <div class="ram-bar-bg"><div class="ram-bar-fill green" id="ramBar"></div></div>
                <span class="info-val" id="ramText">0/200MB</span>
                <select id="ramLimit">
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="200" selected>200</option>
                    <option value="300">300</option>
                    <option value="500">500</option>
                    <option value="1000">1GB</option>
                    <option value="0">∞</option>
                </select>
            </div>
        </div>

        <!-- Hàng nút bấm - hiển thị đầy đủ -->
        <div class="btn-row">
            <button class="btn btn-sm btn-mirror" id="btnMirror" title="Lật ngang hình">↔️</button>
            <button class="btn btn-record idle" id="btnRecord" title="Bắt đầu/Kết thúc quay">▶</button>
            <button class="btn btn-sm btn-save" id="btnSave" disabled title="Lưu video">💾</button>
            <button class="btn btn-sm btn-cam" id="btnCam" title="Chuyển camera">📷</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
let toastTimer = null;
function showToast(msg, dur = 2500, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), dur);
}

class GPSTracker {
    constructor() { this.watchId = null; this.speed = 0; this.active = false; this.lastPos = null; }
    start() {
        if (!navigator.geolocation) { showToast('❌ Trình duyệt không hỗ trợ GPS', 3000, 'danger'); return false; }
        this.active = true;
        this.watchId = navigator.geolocation.watchPosition(
            p => this.handle(p), e => this.err(e),
            { enableHighAccuracy: true, timeout: 8000, maximumAge: 1000 }
        );
        this.updUI('Tìm tín hiệu...', 'yellow');
        return true;
    }
    stop() {
        this.active = false;
        if (this.watchId) navigator.geolocation.clearWatch(this.watchId);
        this.speed = 0; this.updUI('Tắt', 'red');
    }
    handle(pos) {
        if (!this.active) return;
        const c = pos.coords;
        this.speed = c.speed !== null && c.speed >= 0 ? Math.round(c.speed * 3.6 * 10) / 10 : this.calcSpeed(c, pos.timestamp);
        this.updUI('GPS', 'green');
    }
    calcSpeed(c, ts) {
        if (!this.lastPos) { this.lastPos = { lat: c.latitude, lng: c.longitude, ts }; return 0; }
        const d = this.dist(this.lastPos.lat, this.lastPos.lng, c.latitude, c.longitude);
        const t = (ts - this.lastPos.ts) / 1000;
        this.lastPos = { lat: c.latitude, lng: c.longitude, ts };
        return t > 0 && d > 1 ? Math.round((d / t) * 3.6 * 10) / 10 : 0;
    }
    dist(lat1, lon1, lat2, lon2) {
        const R = 6371e3, r = Math.PI / 180;
        const dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
        const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLon / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }
    err(e) {
        const m = { 1: ['Cấp quyền vị trí', 'red'], 2: ['Không có tín hiệu', 'red'], 3: ['Mất tín hiệu', 'yellow'] }[e.code] || ['Lỗi GPS', 'red'];
        this.updUI(m[0], m[1]);
    }
    updUI(txt, color) {
        document.getElementById('gpsDot').className = 'gps-dot ' + color;
        document.getElementById('gpsLabel').textContent = txt;
    }
    getSpeed() { return this.speed; }
}

class Recorder {
    constructor(maxMB = 200) {
        this.max = maxMB === 0 ? Infinity : maxMB * 1024 * 1024;
        this.segTime = 1000;
        this.chunks = [];
        this.totalSize = 0;
        this.totalDur = 0;
        this.recorder = null;
        this.stream = null;
        this.canvasStream = null;
        this.recording = false;
        this.rendering = false;
        this.facing = 'user';
        this.mirror = false;
        this.firstChunk = null;
        this.hasHeader = false;
        this.canvas = document.getElementById('renderCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.video = document.getElementById('videoPreview');
        this.gps = new GPSTracker();
        this.w = 1280; this.h = 720;
        this.onChange = null;
    }
    setMaxMB(mb) { this.max = mb === 0 ? Infinity : mb * 1024 * 1024; this.cap(); this.notify(); }
    async initCam(facing = 'user') {
        const cons = { video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: true };
        this.stream = await navigator.mediaDevices.getUserMedia(cons);
        this.facing = facing;
        this.video.srcObject = this.stream;
        await this.video.play();
        const s = this.stream.getVideoTracks()[0].getSettings();
        this.w = s.width || 1280; this.h = s.height || 720;
        this.canvas.width = this.w; this.canvas.height = this.h;
    }
    async switchCam(facing) {
        if (facing === this.facing) { showToast('Đang dùng camera này', 1500); return; }
        const was = this.recording;
        if (was) this.stopRec();
        this.stream?.getTracks().forEach(t => t.stop());
        await this.initCam(facing);
        if (was) await this.startRec();
        showToast(`Đã chuyển camera ${facing === 'user' ? 'trước' : 'sau'}`, 1500);
    }
    async startRec() {
        if (this.recording) return;
        if (!this.stream) await this.initCam(this.facing);
        this.chunks = []; this.totalSize = 0; this.totalDur = 0;
        this.firstChunk = null; this.hasHeader = false;
        this.canvasStream = this.canvas.captureStream(30);
        const aTrack = this.stream.getAudioTracks()[0];
        if (aTrack) this.canvasStream.addTrack(aTrack);

        let mime = 'video/webm;codecs=vp9,opus';
        if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm;codecs=vp8,opus';
        if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';

        this.recorder = new MediaRecorder(this.canvasStream, { mimeType: mime });
        this.recorder.ondataavailable = e => this.onChunk(e);
        this.recorder.start(this.segTime);
        this.recording = true;
        this.gps.start();
        this.startDraw();
        this.timer = setInterval(() => { this.cap(); this.notify(); }, 2000);
        document.getElementById('recBadge').classList.add('show');
        showToast('🔴 Bắt đầu quay', 2000, 'success');
    }
    stopRec() {
        if (!this.recording) return;
        this.recorder.stop();
        this.recording = false;
        clearInterval(this.timer);
        this.gps.stop();
        this.stopDraw();
        document.getElementById('recBadge').classList.remove('show');
        showToast('⏹ Đã dừng quay', 2000);
    }
    onChunk(e) {
        if (!e.data.size) return;
        if (!this.hasHeader) { this.firstChunk = e.data; this.hasHeader = true; }
        this.chunks.push(e.data);
        this.totalSize += e.data.size;
        this.totalDur += this.segTime;
        this.cap(); this.notify();
    }
    cap() {
        while (this.chunks.length > 1 && this.totalSize > this.max) {
            const rm = this.chunks.shift();
            this.totalSize -= rm.size;
            this.totalDur -= this.segTime;
            if (rm === this.firstChunk && this.chunks.length) {
                this.chunks.unshift(rm);
                this.totalSize += rm.size;
                this.totalDur += this.segTime;
                break;
            }
        }
    }
    startDraw() {
        if (this.rendering) return;
        this.rendering = true;
        const draw = () => {
            if (!this.rendering) return;
            const cw = this.canvas.width, ch = this.canvas.height;
            this.ctx.clearRect(0, 0, cw, ch);

            const vw = this.video.videoWidth, vh = this.video.videoHeight;
            const r = vw / vh, cr = cw / ch;
            let dw, dh, x, y;
            if (r > cr) { dh = ch; dw = dh * r; x = (cw - dw) / 2; y = 0; }
            else { dw = cw; dh = dw / r; x = 0; y = (ch - dh) / 2; }

            if (this.mirror) {
                this.ctx.save();
                this.ctx.translate(cw / 2, 0);
                this.ctx.scale(-1, 1);
                this.ctx.drawImage(this.video, -dw / 2, y, dw, dh);
                this.ctx.restore();
            } else {
                this.ctx.drawImage(this.video, x, y, dw, dh);
            }

            // Vẽ thông tin góc trên trái: ngày, giờ, tốc độ
            const now = new Date();
            const date = now.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
            const time = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            const spd = this.gps.getSpeed();
            const spdTxt = spd.toFixed(1) + ' km/h';

            const fsDate = Math.max(cw * 0.022, 12);
            const fsTime = Math.max(cw * 0.035, 18);
            const fsSpd = Math.max(cw * 0.038, 20);
            const padX = Math.max(cw * 0.022, 10);
            const padY = Math.max(ch * 0.018, 7);
            const margin = Math.max(cw * 0.018, 10);
            const radius = Math.max(cw * 0.01, 6);
            const lineGap = fsTime * 0.3;

            this.ctx.font = `bold ${fsDate}px -apple-system, sans-serif`;
            const wDate = this.ctx.measureText(date).width;
            this.ctx.font = `bold ${fsTime}px -apple-system, sans-serif`;
            const wTime = this.ctx.measureText(time).width;
            this.ctx.font = `bold ${fsSpd}px -apple-system, sans-serif`;
            const wSpd = this.ctx.measureText(spdTxt).width;

            const boxW = Math.max(wDate, wTime, wSpd) + padX * 2;
            const boxH = padY * 2 + fsDate + fsTime + fsSpd + lineGap * 2;
            const bx = margin, by = margin;

            this.ctx.save();
            this.ctx.fillStyle = 'rgba(0,0,0,0.35)';
            this.ctx.beginPath();
            this.ctx.moveTo(bx + radius, by);
            this.ctx.lineTo(bx + boxW - radius, by);
            this.ctx.quadraticCurveTo(bx + boxW, by, bx + boxW, by + radius);
            this.ctx.lineTo(bx + boxW, by + boxH - radius);
            this.ctx.quadraticCurveTo(bx + boxW, by + boxH, bx + boxW - radius, by + boxH);
            this.ctx.lineTo(bx + radius, by + boxH);
            this.ctx.quadraticCurveTo(bx, by + boxH, bx, by + boxH - radius);
            this.ctx.lineTo(bx, by + radius);
            this.ctx.quadraticCurveTo(bx, by, bx + radius, by);
            this.ctx.closePath();
            this.ctx.fill();
            this.ctx.restore();

            const tx = bx + padX;
            let ty = by + padY + fsDate * 0.8;

            this.ctx.fillStyle = 'rgba(255,255,255,0.95)';
            this.ctx.font = `bold ${fsDate}px -apple-system, sans-serif`;
            this.ctx.fillText(date, tx, ty);
            ty += fsDate + lineGap;

            this.ctx.font = `bold ${fsTime}px -apple-system, sans-serif`;
            this.ctx.fillText(time, tx, ty);
            ty += fsTime + lineGap;

            this.ctx.fillStyle = spd >= 50 ? '#ff3b30' : spd >= 30 ? '#ff9500' : '#34c759';
            this.ctx.font = `bold ${fsSpd}px -apple-system, sans-serif`;
            this.ctx.fillText(spdTxt, tx, ty);

            requestAnimationFrame(draw);
        };
        draw();
    }
    stopDraw() { this.rendering = false; }
    toggleMirror() { this.mirror = !this.mirror; showToast(this.mirror ? '🔄 Bật gương' : '🔄 Tắt gương', 1500); }
    save() {
        if (!this.chunks.length) return showToast('Chưa có video', 2000, 'warning');
        const list = this.chunks[0] !== this.firstChunk ? [this.firstChunk, ...this.chunks] : this.chunks;
        const blob = new Blob(list, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const d = new Date();
        a.download = `cam-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}.mp4`;
        a.href = url;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
        showToast(`✅ Đã lưu: ${(blob.size / 1048576).toFixed(1)} MB`, 2500, 'success');
    }
    fmtSize(b) {
        if (b < 1024) return b + 'B';
        if (b < 1048576) return (b / 1024).toFixed(1) + 'KB';
        return (b / 1048576).toFixed(1) + 'MB';
    }
    notify() { if (this.onChange) this.onChange(); }
}

const rec = new Recorder(200);

function syncUI() {
    const isRec = rec.recording;
    const hasData = rec.chunks.length > 0;

    const btn = document.getElementById('btnRecord');
    btn.className = 'btn btn-record ' + (isRec ? 'recording' : 'idle');
    btn.innerHTML = isRec ? '' : '▶';

    document.getElementById('segCount').textContent = rec.chunks.length;
    document.getElementById('durTime').textContent = (rec.totalDur / 1000).toFixed(1) + 's';
    document.getElementById('sizeVal').textContent = rec.fmtSize(rec.totalSize);

    const maxMB = rec.max === Infinity ? '∞' : Math.round(rec.max / 1048576);
    const usedMB = Math.round(rec.totalSize / 1048576);
    const pct = rec.max === Infinity ? 0 : Math.min((rec.totalSize / rec.max) * 100, 100);
    const bar = document.getElementById('ramBar');
    bar.style.width = pct + '%';
    bar.className = 'ram-bar-fill ' + (pct >= 95 ? 'red' : pct >= 80 ? 'yellow' : 'green');
    document.getElementById('ramText').textContent = `${usedMB}/${maxMB}MB`;

    document.getElementById('btnSave').disabled = !hasData;
}

rec.onChange = syncUI;

document.getElementById('btnRecord').addEventListener('click', () => rec.recording ? rec.stopRec() : rec.startRec());
document.getElementById('btnSave').addEventListener('click', () => rec.save());
document.getElementById('btnMirror').addEventListener('click', () => rec.toggleMirror());
document.getElementById('btnCam').addEventListener('click', () => rec.switchCam(rec.facing === 'user' ? 'environment' : 'user'));
document.getElementById('ramLimit').addEventListener('change', e => rec.setMaxMB(parseInt(e.target.value)));

rec.initCam().then(syncUI);
window.addEventListener('beforeunload', () => rec.stopRec());
</script>

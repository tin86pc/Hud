<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Camera Hành Trình</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-dark: #000;
            --panel-bg: rgba(20, 20, 25, 0.85);
            --panel-border: rgba(255, 255, 255, 0.1);
            --text-primary: #fff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.45);
            --accent-red: #ff3b30;
            --accent-green: #34c759;
            --accent-yellow: #ff9500;
            --accent-blue: #007aff;
            --accent-orange: #ff6b35;
            --scale: 0.9;

            /* Kích thước thanh điều khiển */
            --control-bar-h: 130px;
            --control-bar-h-landscape: 100vh;
            --control-bar-w-landscape: 220px;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            overflow: hidden;
        }

        .app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* === Vùng Video === */
        .video-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100vh - var(--control-bar-h));
            background: #111;
            overflow: hidden;
            z-index: 1;
        }

        #videoPreview {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        #renderCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        /* === Chỉ báo trạng thái trên video === */
        .video-overlay-hud {
            position: absolute;
            top: calc(15px * var(--scale));
            left: calc(15px * var(--scale));
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: calc(6px * var(--scale));
        }

        .rec-indicator {
            display: inline-flex;
            align-items: center;
            gap: calc(8px * var(--scale));
            padding: calc(6px * var(--scale)) calc(12px * var(--scale));
            background: rgba(255, 59, 48, 0.15);
            border: 1px solid rgba(255, 59, 48, 0.3);
            border-radius: calc(20px * var(--scale));
            font-size: calc(14px * var(--scale));
            color: var(--accent-red);
            font-weight: 600;
            opacity: 0;
            transform: translateY(-5px);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .rec-indicator.show { opacity: 1; transform: translateY(0); }

        .rec-dot {
            width: calc(10px * var(--scale));
            height: calc(10px * var(--scale));
            border-radius: 50%;
            background: var(--accent-red);
            animation: recPulse 1s infinite;
        }
        @keyframes recPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }

        .gps-status {
            display: inline-flex;
            align-items: center;
            gap: calc(8px * var(--scale));
            padding: calc(5px * var(--scale)) calc(10px * var(--scale));
            background: rgba(0, 0, 0, 0.3);
            border-radius: calc(15px * var(--scale));
            font-size: calc(13px * var(--scale));
            color: var(--text-secondary);
            backdrop-filter: blur(10px);
        }

        .gps-dot {
            width: calc(8px * var(--scale));
            height: calc(8px * var(--scale));
            border-radius: 50%;
            flex-shrink: 0;
        }
        .gps-dot.green { background: var(--accent-green); }
        .gps-dot.yellow { background: var(--accent-yellow); }
        .gps-dot.red { background: var(--accent-red); }

        /* === Thanh Điều Khiển Dưới === */
        .control-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--control-bar-h);
            background: var(--panel-bg);
            border-top: 1px solid var(--panel-border);
            padding: calc(12px * var(--scale)) calc(20px * var(--scale));
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 5;
        }

        /* Thông tin trạng thái */
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: calc(13px * var(--scale));
            color: var(--text-muted);
        }

        .status-group {
            display: flex;
            gap: calc(16px * var(--scale));
        }

        .status-item {
            display: flex;
            align-items: baseline;
            gap: calc(4px * var(--scale));
        }

        .status-label { }
        .status-value {
            color: var(--text-secondary);
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }

        .ram-control {
            display: flex;
            align-items: center;
            gap: calc(8px * var(--scale));
        }

        .ram-control label {
            font-size: calc(12px * var(--scale));
            color: var(--text-muted);
        }

        .ram-control select {
            padding: calc(3px * var(--scale)) calc(8px * var(--scale));
            border-radius: calc(6px * var(--scale));
            border: 1px solid var(--panel-border);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-secondary);
            font-size: calc(12px * var(--scale));
            outline: none;
        }

        .ram-bar-container {
            flex: 1;
            height: calc(6px * var(--scale));
            background: rgba(255,255,255,0.1);
            border-radius: calc(3px * var(--scale));
            overflow: hidden;
            max-width: 100px;
        }

        .ram-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: calc(3px * var(--scale));
            transition: width 0.4s ease, background 0.4s ease;
        }
        .ram-bar-fill.green { background: var(--accent-green); }
        .ram-bar-fill.yellow { background: var(--accent-yellow); }
        .ram-bar-fill.red { background: var(--accent-red); animation: blink 0.8s infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.5} }

        /* Nút điều khiển */
        .buttons-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: calc(4px * var(--scale)) 0 calc(8px * var(--scale));
        }

        .ctrl-btn {
            width: calc(50px * var(--scale));
            height: calc(50px * var(--scale));
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            font-size: calc(20px * var(--scale));
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            border: 1px solid var(--panel-border);
            flex-shrink: 0;
        }
        .ctrl-btn:active { transform: scale(0.92); background: rgba(255,255,255,0.15); }
        .ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
        .ctrl-btn:hover:not(:disabled) { background: rgba(255,255,255,0.12); color: var(--text-primary); }

        .ctrl-btn.secondary {
            width: calc(44px * var(--scale));
            height: calc(44px * var(--scale));
            font-size: calc(18px * var(--scale));
        }
        .ctrl-btn.save-btn { color: var(--accent-orange); border-color: rgba(255, 107, 53, 0.3); }
        .ctrl-btn.cam-switch-btn { color: var(--accent-blue); }
        .ctrl-btn.mirror-btn { color: var(--text-secondary); }

        .record-btn {
            width: calc(70px * var(--scale));
            height: calc(70px * var(--scale));
            border-radius: 50%;
            border: calc(4px * var(--scale)) solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: calc(28px * var(--scale));
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            flex-shrink: 0;
        }
        .record-btn:active { transform: scale(0.93); }
        .record-btn.idle { border-color: rgba(52, 199, 89, 0.5); background: rgba(52, 199, 89, 0.12); }
        .record-btn.recording { border-color: rgba(255, 59, 48, 0.6); background: rgba(255, 59, 48, 0.15); }
        .record-btn.recording::after {
            content: '';
            position: absolute;
            width: calc(70px * var(--scale));
            height: calc(70px * var(--scale));
            border-radius: 50%;
            border: calc(2px * var(--scale)) solid transparent;
            border-top-color: var(--accent-red);
            animation: recordRing 1.5s linear infinite;
        }
        @keyframes recordRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* === Thông báo === */
        .toast {
            position: fixed;
            bottom: calc(var(--control-bar-h) + 20px);
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: var(--panel-bg);
            color: var(--text-primary);
            padding: calc(12px * var(--scale)) calc(20px * var(--scale));
            border-radius: calc(12px * var(--scale));
            font-size: calc(14px * var(--scale));
            backdrop-filter: blur(15px);
            border: 1px solid var(--panel-border);
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 100;
            max-width: 90vw;
            text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.warning { border-color: rgba(255, 149, 0, 0.4); }
        .toast.danger { border-color: rgba(255, 59, 48, 0.4); }
        .toast.success { border-color: rgba(52, 199, 89, 0.4); }

        /* === Màn hình NGANG === */
        @media (orientation: landscape) {
            .video-area {
                width: calc(100vw - var(--control-bar-w-landscape));
                height: 100vh;
            }

            .control-bar {
                width: var(--control-bar-w-landscape);
                height: 100vh;
                left: auto;
                right: 0;
                bottom: 0;
                flex-direction: column;
                justify-content: space-between;
                padding: calc(20px * var(--scale)) calc(16px * var(--scale));
            }

            .status-row {
                flex-direction: column;
                gap: calc(12px * var(--scale));
                align-items: flex-start;
                width: 100%;
            }

            .status-group {
                width: 100%;
                justify-content: space-between;
            }

            .ram-control { width: 100%; }
            .ram-bar-container { max-width: none; }

            .buttons-row {
                flex-direction: column;
                gap: calc(20px * var(--scale));
                padding: calc(10px * var(--scale)) 0;
            }

            .toast {
                bottom: 20px;
                right: calc(var(--control-bar-w-landscape) + 20px);
                left: auto;
                transform: translateY(10px);
            }
            .toast.show { transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Vùng Video -->
    <div class="video-area">
        <video id="videoPreview" autoplay muted playsinline></video>
        <canvas id="renderCanvas"></canvas>

        <!-- Thông tin trên video -->
        <div class="video-overlay-hud">
            <div class="rec-indicator" id="recIndicator">
                <span class="rec-dot"></span> Đang quay
            </div>
            <div class="gps-status">
                <span class="gps-dot red" id="gpsDot"></span>
                <span id="gpsLabel">Tìm tín hiệu</span>
            </div>
        </div>
    </div>

    <!-- Thanh Điều Khiển -->
    <div class="control-bar">
        <!-- Hàng trạng thái -->
        <div class="status-row">
            <div class="status-group">
                <div class="status-item">
                    <span class="status-label">Đoạn:</span>
                    <span class="status-value" id="segmentCount">0</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Thời gian:</span>
                    <span class="status-value" id="totalDuration">0s</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Kích thước:</span>
                    <span class="status-value" id="totalSize">0 MB</span>
                </div>
            </div>
            <div class="ram-control">
                <label>RAM:</label>
                <div class="ram-bar-container">
                    <div class="ram-bar-fill green" id="ramBar"></div>
                </div>
                <span class="status-value" id="ramUsage">0/200MB</span>
                <select id="ramLimitSelect">
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="200" selected>200</option>
                    <option value="300">300</option>
                    <option value="500">500</option>
                    <option value="1000">1GB</option>
                    <option value="0">∞</option>
                </select>
            </div>
        </div>

        <!-- Hàng nút bấm -->
        <div class="buttons-row">
            <button class="ctrl-btn secondary mirror-btn" id="btnMirror" title="Lật ngang hình">↔️</button>
            <button class="record-btn idle" id="btnRecordMain" title="Bắt đầu/Kết thúc quay">▶</button>
            <button class="ctrl-btn secondary save-btn" id="btnDownload" disabled title="Lưu video">💾</button>
            <button class="ctrl-btn secondary cam-switch-btn" id="camSwitchBtn" title="Chuyển camera">📷</button>
        </div>
    </div>
</div>

<div class="toast" id="toastMsg"></div>

<script>
let toastTimer = null;
function showToast(msg, duration = 2500, type = '') {
    const t = document.getElementById('toastMsg');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), duration);
}

class GPSTracker {
    constructor() {
        this.watchId = null;
        this.speed = 0;
        this.active = false;
        this.lastPos = null;
    }

    start() {
        if (!navigator.geolocation) {
            showToast('❌ Trình duyệt không hỗ trợ GPS', 3000, 'danger');
            return false;
        }
        this.active = true;
        this.watchId = navigator.geolocation.watchPosition(
            p => this.handlePos(p),
            e => this.handleErr(e),
            { enableHighAccuracy: true, timeout: 8000, maximumAge: 1000 }
        );
        this.updateUI('Tìm tín hiệu...', 'yellow');
        return true;
    }

    stop() {
        this.active = false;
        if (this.watchId !== null) navigator.geolocation.clearWatch(this.watchId);
        this.speed = 0;
        this.updateUI('Tắt', 'red');
    }

    handlePos(pos) {
        if (!this.active) return;
        const c = pos.coords;
        if (c.speed !== null && c.speed >= 0) {
            this.speed = Math.round(c.speed * 3.6 * 10) / 10;
        } else {
            this.speed = this.calcSpeedFromPos(c, pos.timestamp);
        }
        this.updateUI('GPS', 'green');
    }

    calcSpeedFromPos(coords, ts) {
        if (!this.lastPos) {
            this.lastPos = { lat: coords.latitude, lng: coords.longitude, ts };
            return 0;
        }
        const d = this.distHaversine(this.lastPos.lat, this.lastPos.lng, coords.latitude, coords.longitude);
        const t = (ts - this.lastPos.ts) / 1000;
        this.lastPos = { lat: coords.latitude, lng: coords.longitude, ts };
        return t > 0 && d > 1 ? Math.round((d / t) * 3.6 * 10) / 10 : 0;
    }

    distHaversine(lat1, lon1, lat2, lon2) {
        const R = 6371e3, toRad = d => d * Math.PI / 180;
        const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
        const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    handleErr(e) {
        const map = {
            [e.PERMISSION_DENIED]: ['Cấp quyền vị trí', 'red'],
            [e.POSITION_UNAVAILABLE]: ['Không có tín hiệu', 'red'],
            [e.TIMEOUT]: ['Mất tín hiệu', 'yellow']
        };
        const [text, color] = map[e.code] || ['Lỗi GPS', 'red'];
        this.updateUI(text, color);
    }

    updateUI(text, color) {
        const dot = document.getElementById('gpsDot');
        dot.className = 'gps-dot ' + color;
        document.getElementById('gpsLabel').textContent = text;
    }

    getSpeed() { return this.speed; }
}

class DashCamRecorder {
    constructor(maxRamMB = 200) {
        this.maxRam = maxRamMB === 0 ? Infinity : maxRamMB * 1024 * 1024;
        this.segmentTime = 1000;
        this.buffer = [];
        this.totalSize = 0;
        this.totalDuration = 0;
        this.recorder = null;
        this.stream = null;
        this.canvasStream = null;
        this.recording = false;
        this.rendering = false;
        this.facing = 'user';
        this.mirrored = false;
        this.firstChunk = null;
        this.hasHeader = false;
        this.canvas = document.getElementById('renderCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.video = document.getElementById('videoPreview');
        this.gps = new GPSTracker();
        this.videoW = 1280; this.videoH = 720;
        this.onStateChange = null;
        this.scale = 0.9;
    }

    setMaxRamMB(mb) {
        this.maxRam = mb === 0 ? Infinity : mb * 1024 * 1024;
        this.enforceLimits();
        this.notifyChange();
    }

    async initCamera(facing = 'user') {
        const cons = { video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: true };
        this.stream = await navigator.mediaDevices.getUserMedia(cons);
        this.facing = facing;
        this.video.srcObject = this.stream;
        await this.video.play();
        const s = this.stream.getVideoTracks()[0].getSettings();
        this.videoW = s.width || 1280; this.videoH = s.height || 720;
        this.canvas.width = this.videoW; this.canvas.height = this.videoH;
        return true;
    }

    async switchCamera(facing) {
        if (facing === this.facing) { showToast('Đang dùng camera này', 1500); return; }
        const wasRecording = this.recording;
        if (this.recording) this.stopRecording();
        this.stream?.getTracks().forEach(t => t.stop());
        await this.initCamera(facing);
        if (wasRecording) await this.startRecording();
        this.updateCamButton();
        showToast(`Đã chuyển sang camera ${facing === 'user' ? 'trước' : 'sau'}`, 1500);
    }

    updateCamButton() {
        // Cập nhật trạng thái nếu cần
    }

    async startRecording() {
        if (this.recording) return;
        if (!this.stream) await this.initCamera(this.facing);
        this.buffer = []; this.totalSize = 0; this.totalDuration = 0;
        this.firstChunk = null; this.hasHeader = false;
        this.canvasStream = this.canvas.captureStream(30);
        const aTracks = this.stream.getAudioTracks();
        if (aTracks[0]) this.canvasStream.addTrack(aTracks[0]);

        let mimeType = 'video/webm;codecs=vp9,opus';
        if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm;codecs=vp8,opus';
        if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';

        this.recorder = new MediaRecorder(this.canvasStream, { mimeType });
        this.recorder.ondataavailable = e => this.handleChunk(e);
        this.recorder.start(this.segmentTime);
        this.recording = true;
        this.gps.start();
        this.startRender();
        this.timer = setInterval(() => { this.enforceLimits(); this.notifyChange(); }, 2000);
        this.notifyChange();
        document.getElementById('recIndicator').classList.add('show');
        showToast('🔴 Bắt đầu quay', 2000, 'success');
    }

    stopRecording() {
        if (!this.recording) return;
        this.recorder.stop();
        this.recording = false;
        clearInterval(this.timer);
        this.gps.stop();
        this.stopRender();
        document.getElementById('recIndicator').classList.remove('show');
        this.notifyChange();
        showToast('⏹ Đã dừng quay', 2000);
    }

    handleChunk(e) {
        if (!e.data.size) return;
        if (!this.hasHeader) { this.firstChunk = e.data; this.hasHeader = true; }
        this.buffer.push(e.data);
        this.totalSize += e.data.size;
        this.totalDuration += this.segmentTime;
        this.enforceLimits();
        this.notifyChange();
    }

    enforceLimits() {
        while (this.buffer.length > 1 && this.totalSize > this.maxRam) {
            const removed = this.buffer.shift();
            this.totalSize -= removed.size;
            this.totalDuration -= this.segmentTime;
            if (removed === this.firstChunk && this.buffer.length) {
                this.buffer.unshift(removed);
                this.totalSize += removed.size;
                this.totalDuration += this.segmentTime;
                break;
            }
        }
    }

    startRender() {
        if (this.rendering) return;
        this.rendering = true;
        const draw = () => {
            if (!this.rendering) return;
            const cw = this.canvas.width;
            const ch = this.canvas.height;
            this.ctx.clearRect(0, 0, cw, ch);

            const vw = this.video.videoWidth, vh = this.video.videoHeight;
            const vRatio = vw / vh, cRatio = cw / ch;
            let dw, dh, ox, oy;
            if (vRatio > cRatio) { dh = ch; dw = dh * vRatio; ox = (cw - dw) / 2; oy = 0; }
            else { dw = cw; dh = dw / vRatio; ox = 0; oy = (ch - dh) / 2; }

            if (this.mirrored) {
                this.ctx.save();
                this.ctx.translate(cw / 2, 0);
                this.ctx.scale(-1, 1);
                this.ctx.drawImage(this.video, -dw / 2, oy, dw, dh);
                this.ctx.restore();
            } else {
                this.ctx.drawImage(this.video, ox, oy, dw, dh);
            }

            // === Vẽ thông tin: ngày, giờ, tốc độ ===
            const now = new Date();
            const dateStr = now.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            const speed = this.gps.getSpeed();
            const speedStr = speed.toFixed(1) + ' km/h';

            const fontSizeDate = Math.max(cw * 0.022 * this.scale, 12 * this.scale);
            const fontSizeTime = Math.max(cw * 0.035 * this.scale, 18 * this.scale);
            const fontSizeSpeed = Math.max(cw * 0.038 * this.scale, 20 * this.scale);
            const lineSpacing = fontSizeTime * 0.3;
            const paddingX = Math.max(cw * 0.022 * this.scale, 10 * this.scale);
            const paddingY = Math.max(ch * 0.018 * this.scale, 7 * this.scale);
            const margin = Math.max(cw * 0.018 * this.scale, 10 * this.scale);
            const radius = Math.max(cw * 0.01 * this.scale, 6 * this.scale);

            this.ctx.font = `bold ${fontSizeDate}px -apple-system, sans-serif`;
            const dateWidth = this.ctx.measureText(dateStr).width;
            this.ctx.font = `bold ${fontSizeTime}px -apple-system, sans-serif`;
            const timeWidth = this.ctx.measureText(timeStr).width;
            this.ctx.font = `bold ${fontSizeSpeed}px -apple-system, sans-serif`;
            const speedWidth = this.ctx.measureText(speedStr).width;

            const textWidth = Math.max(dateWidth, timeWidth, speedWidth);
            const boxW = textWidth + paddingX * 2;
            const boxH = paddingY * 2 + fontSizeDate + fontSizeTime + fontSizeSpeed + lineSpacing * 2;
            const boxX = margin;
            const boxY = margin;

            this.ctx.save();
            this.ctx.shadowColor = 'rgba(0,0,0,0.2)';
            this.ctx.shadowBlur = cw * 0.008 * this.scale;
            this.ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
            this.ctx.beginPath();
            this.ctx.moveTo(boxX + radius, boxY);
            this.ctx.lineTo(boxX + boxW - radius, boxY);
            this.ctx.quadraticCurveTo(boxX + boxW, boxY, boxX + boxW, boxY + radius);
            this.ctx.lineTo(boxX + boxW, boxY + boxH - radius);
            this.ctx.quadraticCurveTo(boxX + boxW, boxY + boxH, boxX + boxW - radius, boxY + boxH);
            this.ctx.lineTo(boxX + radius, boxY + boxH);
            this.ctx.quadraticCurveTo(boxX, boxY + boxH, boxX, boxY + boxH - radius);
            this.ctx.lineTo(boxX, boxY + radius);
            this.ctx.quadraticCurveTo(boxX, boxY, boxX + radius, boxY);
            this.ctx.closePath();
            this.ctx.fill();
            this.ctx.shadowBlur = 0;
            this.ctx.restore();

            const textX = boxX + paddingX;
            let currentY = boxY + paddingY + fontSizeDate * 0.8;

            this.ctx.fillStyle = 'rgba(255,255,255,0.95)';
            this.ctx.font = `bold ${fontSizeDate}px -apple-system, sans-serif`;
            this.ctx.textAlign = 'left';
            this.ctx.fillText(dateStr, textX, currentY);
            currentY += fontSizeDate + lineSpacing;

            this.ctx.font = `bold ${fontSizeTime}px -apple-system, sans-serif`;
            this.ctx.fillText(timeStr, textX, currentY);
            currentY += fontSizeTime + lineSpacing;

            const speedColor = speed >= 50 ? '#ff3b30' : speed >= 30 ? '#ff9500' : '#34c759';
            this.ctx.fillStyle = speedColor;
            this.ctx.font = `bold ${fontSizeSpeed}px -apple-system, sans-serif`;
            this.ctx.fillText(speedStr, textX, currentY);

            this.ctx.restore();

            requestAnimationFrame(draw);
        };
        draw();
    }

    stopRender() { this.rendering = false; }

    toggleMirror() {
        this.mirrored = !this.mirrored;
        showToast(this.mirrored ? '🔄 Bật gương hình' : '🔄 Tắt gương hình', 1500);
    }

    saveVideo() {
        if (!this.buffer.length) return showToast('Chưa có video để lưu', 2000, 'warning');
        const chunks = this.buffer[0] !== this.firstChunk ? [this.firstChunk, ...this.buffer] : this.buffer;
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const d = new Date();
        a.download = `cam-hanh-trinh-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}.mp4`;
        a.href = url;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
        showToast(`✅ Đã lưu: ${(blob.size / 1048576).toFixed(1)} MB`, 2500, 'success');
    }

    formatSize(b) {
        if (b < 1024) return b + ' B';
        if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
        return (b / 1048576).toFixed(1) + ' MB';
    }

    notifyChange() {
        if (this.onStateChange) this.onStateChange();
    }
}

const recorder = new DashCamRecorder(200);

function syncUI() {
    const isRec = recorder.recording;
    const hasData = recorder.buffer.length > 0;

    const btn = document.getElementById('btnRecordMain');
    btn.className = 'record-btn ' + (isRec ? 'recording' : 'idle');
    btn.innerHTML = isRec ? '' : '▶';

    document.getElementById('segmentCount').textContent = recorder.buffer.length;
    document.getElementById('totalDuration').textContent = (recorder.totalDuration / 1000).toFixed(1) + 's';
    document.getElementById('totalSize').textContent = recorder.formatSize(recorder.totalSize);

    const maxMB = recorder.maxRam === Infinity ? '∞' : Math.round(recorder.maxRam / 1048576);
    const usedMB = Math.round(recorder.totalSize / 1048576);
    const percent = recorder.maxRam === Infinity ? 0 : Math.min((recorder.totalSize / recorder.maxRam) * 100, 100);
    document.getElementById('ramBar').style.width = percent + '%';
    document.getElementById('ramBar').className = 'ram-bar-fill ' + (percent >= 95 ? 'red' : percent >= 80 ? 'yellow' : 'green');
    document.getElementById('ramUsage').textContent = `${usedMB}/${maxMB}MB`;

    document.getElementById('btnDownload').disabled = !hasData;
}

recorder.onStateChange = syncUI;

document.getElementById('btnRecordMain').addEventListener('click', () => {
    recorder.recording ? recorder.stopRecording() : recorder.startRecording();
});
document.getElementById('btnDownload').addEventListener('click', () => recorder.saveVideo());
document.getElementById('btnMirror').addEventListener('click', () => recorder.toggleMirror());
document.getElementById('camSwitchBtn').addEventListener('click', async () => {
    const newFacing = recorder.facing === 'user' ? 'environment' : 'user';
    await recorder.switchCamera(newFacing);
});
document.getElementById('ramLimitSelect').addEventListener('change', e => {
    recorder.setMaxRamMB(parseInt(e.target.value));
    syncUI();
});

recorder.initCamera('user').then(() => {
    syncUI();
});

window.addEventListener('beforeunload', () => recorder.stopRecording());
</script>

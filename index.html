<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Camera Hành Trình</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-dark: #000;
            --panel-bg: rgba(20, 20, 25, 0.92);
            --panel-border: rgba(255, 255, 255, 0.18);
            --text-primary: #fff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --accent-green: #34c759;
            --accent-blue: #007aff;
            --accent-orange: #ff9500;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        .app {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            cursor: pointer;
        }

        /* === Vùng Video === */
        .video-wrap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            z-index: 1;
        }

        #videoPreview {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        #renderCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            z-index: 2;
            pointer-events: none;
        }

        /* === Thông tin trên video === */
        .hud {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 3;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .gps-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 24px;
            font-size: 15px;
            color: var(--text-secondary);
            backdrop-filter: blur(10px);
            white-space: nowrap;
        }

        .gps-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .gps-dot.green { background: var(--accent-green); }
        .gps-dot.yellow { background: var(--accent-orange); }
        .gps-dot.red { background: #ff3b30; }

        .speed-badge {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent-green);
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 16px;
            border-radius: 16px;
            display: inline-block;
            backdrop-filter: blur(10px);
        }

        /* === MODAL Ở GIỮA - MẶC ĐỊNH ẨN === */
        .control-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 220px;
            height: 120px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            
            /* Ẩn ban đầu + hiệu ứng */
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease;
        }

        /* Khi hiện ra */
        .control-modal.visible {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 2px solid var(--panel-border);
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transition: all 0.15s ease;
            touch-action: manipulation;
            min-width: 72px;
            min-height: 72px;
            -webkit-user-select: none;
            user-select: none;
        }

        .btn:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-mirror { color: var(--text-secondary); }
        .btn-cam { color: var(--accent-blue); }

        /* === Thông báo === */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: var(--panel-bg);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 15px;
            backdrop-filter: blur(15px);
            border: 1px solid var(--panel-border);
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 100;
            max-width: 90vw;
            text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* === Màn hình NGANG === */
        @media (orientation: landscape) {
            .control-modal {
                width: 120px;
                height: 220px;
                flex-direction: column;
                padding: 20px 0;
            }
        }
    </style>
</head>
<body>

<div class="app" id="appScreen">
    <!-- Vùng Video -->
    <div class="video-wrap">
        <video id="videoPreview" autoplay muted playsinline></video>
        <canvas id="renderCanvas"></canvas>

        <!-- Thông tin trên video -->
        <div class="hud">
            <div class="gps-badge">
                <span class="gps-dot red" id="gpsDot"></span>
                <span id="gpsLabel">Tìm tín hiệu</span>
            </div>
            <div class="speed-badge" id="speedDisplay">0.0 km/h</div>
        </div>
    </div>

    <!-- MODAL NÚT Ở GIỮA MÀN HÌNH -->
    <div class="control-modal" id="controlModal">
        <button class="btn btn-mirror" id="btnMirror" title="Lật ngang hình">↔️</button>
        <button class="btn btn-cam" id="btnCam" title="Chuyển camera">📷</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// === Hiển thị thông báo ===
let toastTimer = null;
function showToast(msg, dur = 2000) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), dur);
}

// === Hiện/Ẩn Modal Ở GIỮA ===
const controlModal = document.getElementById('controlModal');
const appScreen = document.getElementById('appScreen');
let hideTimer = null;
const SHOW_DURATION = 4000; // Hiện 4 giây rồi ẩn

function showControls() {
    controlModal.classList.add('visible');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(hideControls, SHOW_DURATION);
}

function hideControls() {
    controlModal.classList.remove('visible');
    clearTimeout(hideTimer);
}

// Chạm màn hình → hiện modal, chạm lại reset đếm ngược
appScreen.addEventListener('click', showControls);
appScreen.addEventListener('touchstart', function(e) {
    if (e.target.closest('.btn')) return; // Bấm nút thì không reset
    showControls();
}, { passive: true });

// === Theo dõi GPS & Tốc độ ===
class GPSTracker {
    constructor() {
        this.watchId = null;
        this.speed = 0;
        this.active = false;
        this.lastPos = null;
    }

    start() {
        if (!navigator.geolocation) {
            showToast('❌ Trình duyệt không hỗ trợ GPS');
            return false;
        }
        this.active = true;
        this.watchId = navigator.geolocation.watchPosition(
            p => this.handle(p),
            e => this.err(e),
            { enableHighAccuracy: true, timeout: 8000, maximumAge: 1000 }
        );
        this.updUI('Tìm tín hiệu...', 'yellow');
        return true;
    }

    stop() {
        this.active = false;
        if (this.watchId) navigator.geolocation.clearWatch(this.watchId);
        this.speed = 0;
        this.updUI('Tắt', 'red');
    }

    handle(pos) {
        if (!this.active) return;
        const c = pos.coords;
        if (c.speed !== null && c.speed >= 0) {
            this.speed = Math.round(c.speed * 3.6 * 10) / 10;
        } else {
            this.speed = this.calcSpeed(c, pos.timestamp);
        }
        this.updUI('GPS', 'green');
        document.getElementById('speedDisplay').textContent = this.speed.toFixed(1) + ' km/h';
        const speedEl = document.getElementById('speedDisplay');
        speedEl.style.color = this.speed >= 50 ? '#ff3b30' : this.speed >= 30 ? '#ff9500' : '#34c759';
    }

    calcSpeed(coords, ts) {
        if (!this.lastPos) {
            this.lastPos = { lat: coords.latitude, lng: coords.longitude, ts };
            return 0;
        }
        const d = this.dist(this.lastPos.lat, this.lastPos.lng, coords.latitude, coords.longitude);
        const t = (ts - this.lastPos.ts) / 1000;
        this.lastPos = { lat: coords.latitude, lng: coords.longitude, ts };
        return t > 0 && d > 1 ? Math.round((d / t) * 3.6 * 10) / 10 : 0;
    }

    dist(lat1, lon1, lat2, lon2) {
        const R = 6371e3, r = Math.PI / 180;
        const dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
        const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLon / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    err(e) {
        const m = {
            1: ['Cấp quyền vị trí', 'red'],
            2: ['Không có tín hiệu', 'red'],
            3: ['Mất tín hiệu', 'yellow']
        }[e.code] || ['Lỗi GPS', 'red'];
        this.updUI(m[0], m[1]);
    }

    updUI(txt, color) {
        document.getElementById('gpsDot').className = 'gps-dot ' + color;
        document.getElementById('gpsLabel').textContent = txt;
    }

    getSpeed() { return this.speed; }
}

// === Camera & Canvas ===
class CameraView {
    constructor() {
        this.stream = null;
        this.canvas = document.getElementById('renderCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.video = document.getElementById('videoPreview');
        this.gps = new GPSTracker();
        this.facing = 'user';
        this.mirror = false;
        this.rendering = false;
        this.w = 1280; this.h = 720;
    }

    async initCam(facing = 'user') {
        const cons = {
            video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
        };
        try {
            this.stream = await navigator.mediaDevices.getUserMedia(cons);
            this.facing = facing;
            this.video.srcObject = this.stream;
            await this.video.play();
            const s = this.stream.getVideoTracks()[0].getSettings();
            this.w = s.width || 1280;
            this.h = s.height || 720;
            this.canvas.width = this.w;
            this.canvas.height = this.h;
            this.startDraw();
            this.gps.start();
            return true;
        } catch (err) {
            showToast('❌ Không truy cập được camera');
            console.error(err);
            return false;
        }
    }

    async switchCam() {
        const newFacing = this.facing === 'user' ? 'environment' : 'user';
        if (this.stream) {
            this.stream.getTracks().forEach(t => t.stop());
        }
        await this.initCam(newFacing);
        showToast(`Đã chuyển camera: ${newFacing === 'user' ? 'Trước' : 'Sau'}`);
    }

    toggleMirror() {
        this.mirror = !this.mirror;
        showToast(this.mirror ? '🔄 Bật gương hình' : '🔄 Tắt gương hình');
    }

    startDraw() {
        if (this.rendering) return;
        this.rendering = true;
        const draw = () => {
            if (!this.rendering) return;
            const cw = this.canvas.width, ch = this.canvas.height;
            this.ctx.clearRect(0, 0, cw, ch);

            const vw = this.video.videoWidth || cw;
            const vh = this.video.videoHeight || ch;
            const r = vw / vh, cr = cw / ch;
            let dw, dh, x, y;
            if (r > cr) { dh = ch; dw = dh * r; x = (cw - dw) / 2; y = 0; }
            else { dw = cw; dh = dw / r; x = 0; y = (ch - dh) / 2; }

            if (this.mirror) {
                this.ctx.save();
                this.ctx.translate(cw / 2, 0);
                this.ctx.scale(-1, 1);
                this.ctx.drawImage(this.video, -dw / 2, y, dw, dh);
                this.ctx.restore();
            } else {
                this.ctx.drawImage(this.video, x, y, dw, dh);
            }

            requestAnimationFrame(draw);
        };
        draw();
    }
}

// === Khởi tạo & Gắn sự kiện ===
const cam = new CameraView();

function attachClick(el, handler) {
    el.addEventListener('click', handler);
    el.addEventListener('touchstart', e => {
        e.stopPropagation();
        handler();
    }, { passive: true });
}

attachClick(document.getElementById('btnMirror'), () => cam.toggleMirror());
attachClick(document.getElementById('btnCam'), () => cam.switchCam());

cam.initCam('user');

window.addEventListener('beforeunload', () => cam.gps.stop());
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ring Buffer Video Recorder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 40px 50px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Video preview */
        #videoPreview {
            width: 100%;
            max-height: 300px;
            background: #000;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            object-fit: cover;
        }

        /* Status */
        .status {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            color: #fff;
            font-size: 15px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #555;
            transition: background 0.3s;
        }

        .status-dot.recording {
            background: #ff3b30;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }

        .status-time {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 14px;
            border-radius: 30px;
        }

        /* Info */
        .info {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 25px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
        }

        .info span {
            font-weight: 600;
            color: #fff;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 14px 34px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 auto;
            min-width: 140px;
            justify-content: center;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-start {
            background: #4caf50;
            color: #fff;
            box-shadow: 0 8px 20px rgba(76, 175, 80, 0.3);
        }

        .btn-start:hover {
            background: #43a047;
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(76, 175, 80, 0.4);
        }

        .btn-start:disabled {
            background: #2e7d32;
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-save {
            background: #ff6b35;
            color: #fff;
            box-shadow: 0 8px 20px rgba(255, 107, 53, 0.3);
        }

        .btn-save:hover {
            background: #e55a2b;
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(255, 107, 53, 0.4);
        }

        .btn-save:disabled {
            background: #a04020;
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-stop {
            background: #f44336;
            color: #fff;
            box-shadow: 0 8px 20px rgba(244, 67, 54, 0.3);
        }

        .btn-stop:hover {
            background: #d32f2f;
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(244, 67, 54, 0.4);
        }

        /* Download link */
        .download-link {
            margin-top: 20px;
            display: none;
        }

        .download-link a {
            color: #64b5f6;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border-bottom: 2px solid rgba(100, 181, 246, 0.3);
            padding-bottom: 4px;
            transition: border-color 0.3s;
        }

        .download-link a:hover {
            border-color: #64b5f6;
        }

        /* Responsive */
        @media (max-width: 500px) {
            .container {
                padding: 25px 20px;
            }

            .btn {
                min-width: 100%;
                padding: 12px 20px;
            }

            .info {
                flex-direction: column;
                gap: 6px;
                text-align: center;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎥 Ring Buffer Recorder</h1>
        <p class="subtitle">Luôn ghi lại 15 phút gần nhất — bấm Lưu bất cứ lúc nào</p>

        <!-- Video preview -->
        <video id="videoPreview" autoplay muted playsinline></video>

        <!-- Status -->
        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Chưa bắt đầu</span>
            <span class="status-time" id="statusTime">00:00</span>
        </div>

        <!-- Info -->
        <div class="info">
            <div>📦 Số đoạn trong buffer: <span id="segmentCount">0</span></div>
            <div>⏱️ Tổng thời lượng: <span id="totalDuration">0s</span></div>
            <div>📊 Dung lượng: <span id="totalSize">0 KB</span></div>
        </div>

        <!-- Buttons -->
        <div class="btn-group">
            <button class="btn btn-start" id="btnStart">▶ Bắt đầu</button>
            <button class="btn btn-stop" id="btnStop" disabled>⏹ Dừng</button>
            <button class="btn btn-save" id="btnSave" disabled>💾 Lưu 15 phút</button>
        </div>

        <div class="download-link" id="downloadLink">
            <a href="#" id="downloadAnchor" download="video.webm">📥 Tải video xuống</a>
        </div>
    </div>

    <script>
        // ============================================================
        //  RING BUFFER VIDEO RECORDER — CLASS
        // ============================================================
        class RingVideoRecorder {
            constructor(maxDurationMs = 15 * 60 * 1000) {
                this.maxDurationMs = maxDurationMs; // 15 phút
                this.segmentDurationMs = 1000; // mỗi đoạn 1 giây

                this.buffer = []; // chứa các Blob đoạn video
                this.totalSize = 0;
                this.totalDuration = 0;

                this.recorder = null;
                this.stream = null;
                this.isRecording = false;
                this.startTime = null;
                this.timerInterval = null;

                // Callback cập nhật UI
                this.onUpdate = null;
            }

            // Bắt đầu quay
            async start() {
                try {
                    this.stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            width: { ideal: 1280 },
                            height: { ideal: 720 },
                            facingMode: 'user'
                        },
                        audio: true,
                    });

                    // Hiển thị preview
                    const videoEl = document.getElementById('videoPreview');
                    videoEl.srcObject = this.stream;
                    await videoEl.play();

                    this.recorder = new MediaRecorder(this.stream, {
                        mimeType: 'video/webm;codecs=vp9,opus',
                    });

                    // Mỗi segmentDurationMs nhận 1 đoạn dữ liệu
                    this.recorder.start(this.segmentDurationMs);

                    this.recorder.ondataavailable = (event) => {
                        if (event.data.size === 0) return;

                        // Thêm vào buffer
                        this.buffer.push(event.data);
                        this.totalSize += event.data.size;
                        this.totalDuration += this.segmentDurationMs;

                        // Xóa đoạn cũ nếu vượt quá 15 phút
                        while (this.totalDuration > this.maxDurationMs) {
                            const oldest = this.buffer.shift();
                            if (oldest) {
                                this.totalSize -= oldest.size;
                                this.totalDuration -= this.segmentDurationMs;
                            }
                        }

                        // Cập nhật UI
                        if (this.onUpdate) this.onUpdate();
                    };

                    this.isRecording = true;
                    this.startTime = Date.now();

                    // Cập nhật đồng hồ
                    this.timerInterval = setInterval(() => {
                        if (this.onUpdate) this.onUpdate();
                    }, 500);

                    if (this.onUpdate) this.onUpdate();
                    return true;
                } catch (err) {
                    console.error('Lỗi khi bắt đầu quay:', err);
                    alert('Không thể truy cập camera/mic. Vui lòng kiểm tra quyền.');
                    return false;
                }
            }

            // Dừng quay (giữ nguyên buffer)
            stop() {
                if (this.recorder && this.isRecording) {
                    this.recorder.stop();
                    this.isRecording = false;
                    if (this.timerInterval) {
                        clearInterval(this.timerInterval);
                        this.timerInterval = null;
                    }
                    if (this.stream) {
                        this.stream.getTracks().forEach(track => track.stop());
                        this.stream = null;
                    }
                    if (this.onUpdate) this.onUpdate();
                }
            }

            // Lưu video (ghép buffer thành Blob)
            save() {
                if (this.buffer.length === 0) {
                    alert('Chưa có dữ liệu video!');
                    return null;
                }
                const blob = new Blob(this.buffer, { type: 'video/webm' });
                return blob;
            }

            // Reset toàn bộ
            reset() {
                this.stop();
                this.buffer = [];
                this.totalSize = 0;
                this.totalDuration = 0;
                if (this.onUpdate) this.onUpdate();
            }

            // Lấy số đoạn
            getSegmentCount() {
                return this.buffer.length;
            }

            // Lấy thời gian đã quay (tính từ lúc start)
            getElapsedSeconds() {
                if (!this.startTime) return 0;
                return Math.floor((Date.now() - this.startTime) / 1000);
            }

            // Format thời gian MM:SS
            formatTime(ms) {
                const totalSec = Math.floor(ms / 1000);
                const min = String(Math.floor(totalSec / 60)).padStart(2, '0');
                const sec = String(totalSec % 60).padStart(2, '0');
                return `${min}:${sec}`;
            }

            // Format dung lượng
            formatSize(bytes) {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / 1048576).toFixed(1) + ' MB';
            }
        }

        // ============================================================
        //  KHỞI TẠO VÀ ĐIỀU KHIỂN UI
        // ============================================================

        const recorder = new RingVideoRecorder(15 * 60 * 1000);

        // DOM elements
        const videoPreview = document.getElementById('videoPreview');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const statusTime = document.getElementById('statusTime');
        const segmentCount = document.getElementById('segmentCount');
        const totalDuration = document.getElementById('totalDuration');
        const totalSize = document.getElementById('totalSize');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const btnSave = document.getElementById('btnSave');
        const downloadLink = document.getElementById('downloadLink');
        const downloadAnchor = document.getElementById('downloadAnchor');

        // Hàm cập nhật UI
        function updateUI() {
            const count = recorder.getSegmentCount();
            segmentCount.textContent = count;
            totalDuration.textContent = (recorder.totalDuration / 1000).toFixed(1) + 's';
            totalSize.textContent = recorder.formatSize(recorder.totalSize);

            // Trạng thái
            if (recorder.isRecording) {
                statusDot.className = 'status-dot recording';
                statusText.textContent = '🔴 Đang quay';
                const elapsed = recorder.getElapsedSeconds();
                const min = String(Math.floor(elapsed / 60)).padStart(2, '0');
                const sec = String(elapsed % 60).padStart(2, '0');
                statusTime.textContent = `${min}:${sec}`;
            } else {
                statusDot.className = 'status-dot';
                statusText.textContent = '⏸ Đã dừng';
                if (count > 0) {
                    statusTime.textContent = recorder.formatTime(recorder.totalDuration);
                } else {
                    statusTime.textContent = '00:00';
                }
            }

            // Nút
            btnStart.disabled = recorder.isRecording;
            btnStop.disabled = !recorder.isRecording;
            btnSave.disabled = (count === 0);

            // Ẩn link tải khi chưa có gì
            if (count === 0) {
                downloadLink.style.display = 'none';
            }
        }

        // Gán callback cho recorder
        recorder.onUpdate = updateUI;

        // ---- Sự kiện nút ----

        // Bắt đầu
        btnStart.addEventListener('click', async () => {
            const ok = await recorder.start();
            if (ok) {
                downloadLink.style.display = 'none';
                updateUI();
            }
        });

        // Dừng
        btnStop.addEventListener('click', () => {
            recorder.stop();
            updateUI();
        });

        // Lưu
        btnSave.addEventListener('click', () => {
            const blob = recorder.save();
            if (!blob) return;

            // Tạo link tải
            const url = URL.createObjectURL(blob);
            downloadAnchor.href = url;
            const now = new Date();
            const dateStr =
                `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}h${String(now.getMinutes()).padStart(2,'0')}`;
            downloadAnchor.download = `video_15phut_${dateStr}.webm`;

            // Hiện link và tự động click
            downloadLink.style.display = 'block';
            setTimeout(() => {
                downloadAnchor.click();
            }, 300);

            // Thông báo
            const sizeMB = (blob.size / 1048576).toFixed(1);
            statusText.textContent = `✅ Đã lưu ${sizeMB} MB`;
        });

        // Reset UI lúc đầu
        updateUI();

        // Thông báo khi thoát tab (dừng quay)
        window.addEventListener('beforeunload', () => {
            recorder.stop();
        });

        console.log('🎥 Ring Buffer Recorder đã sẵn sàng!');
        console.log(`📐 Tối đa: ${recorder.maxDurationMs / 60000} phút, mỗi đoạn ${recorder.segmentDurationMs}ms`);
    </script>

</body>
</html>

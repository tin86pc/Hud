<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Recorder - Time & Speed Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 20px 24px 28px;
            max-width: 850px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header h1 {
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header .badge {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* ===== VIDEO WRAPPER ===== */
        .video-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.08);
        }

        /* Video ẩn, chỉ dùng để lấy dữ liệu */
        #videoPreview {
            width: 100%;
            height: auto;
            display: none;
        }

        /* Canvas hiển thị full */
        #renderCanvas {
            width: 100%;
            height: auto;
            display: block;
            background: #000;
            aspect-ratio: 16 / 9;
            object-fit: contain;
        }

        /* ===== GPS OVERLAY TRÊN VIDEO ===== */
        .gps-overlay {
            position: absolute;
            bottom: 14px;
            right: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 14px 6px 10px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            pointer-events: none;
            z-index: 5;
        }

        .gps-overlay .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        .gps-overlay .dot.green {
            background: #4caf50;
        }
        .gps-overlay .dot.yellow {
            background: #ff9800;
        }
        .gps-overlay .dot.red {
            background: #f44336;
        }

        .gps-overlay .speed-big {
            font-weight: 700;
            font-size: 16px;
            color: #fff;
            margin-left: 2px;
        }

        .gps-overlay .speed-big .unit {
            font-size: 11px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.5);
            margin-left: 2px;
        }

        /* ===== CONTROLS ===== */
        .controls-row {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .controls-row .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex: 1 1 auto;
            min-width: 80px;
            justify-content: center;
        }

        .controls-row .btn:active {
            transform: scale(0.95);
        }

        .controls-row .btn-start {
            background: #4caf50;
            color: #fff;
        }

        .controls-row .btn-start:hover:not(:disabled) {
            background: #43a047;
            transform: translateY(-1px);
        }

        .controls-row .btn-start:disabled {
            background: #2e7d32;
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .controls-row .btn-stop {
            background: #f44336;
            color: #fff;
        }

        .controls-row .btn-stop:hover:not(:disabled) {
            background: #d32f2f;
            transform: translateY(-1px);
        }

        .controls-row .btn-stop:disabled {
            background: #7f1f1a;
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .controls-row .btn-save {
            background: #ff6b35;
            color: #fff;
        }

        .controls-row .btn-save:hover:not(:disabled) {
            background: #e55a2b;
            transform: translateY(-1px);
        }

        .controls-row .btn-save:disabled {
            background: #a04020;
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .controls-row .btn-flip {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .controls-row .btn-flip:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .controls-row .btn-flip:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .controls-row .btn-cam {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 13px;
            padding: 12px 16px;
        }

        .controls-row .btn-cam:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
        }

        .controls-row .btn-cam.active {
            background: rgba(100, 181, 246, 0.2);
            border-color: rgba(100, 181, 246, 0.3);
        }

        .controls-row .btn-cam:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== STATUS BAR ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .status-bar .left {
            display: flex;
            align-items: center;
            gap: 14px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
        }

        .status-bar .left .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #555;
            transition: background 0.3s;
        }

        .status-bar .left .dot.recording {
            background: #ff3b30;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }

        .status-bar .left .time {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            color: #fff;
            font-size: 16px;
            min-width: 50px;
        }

        .status-bar .right {
            display: flex;
            align-items: center;
            gap: 16px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            flex-wrap: wrap;
        }

        .status-bar .right span {
            color: rgba(255, 255, 255, 0.7);
        }

        .status-bar .right .value {
            color: #fff;
            font-weight: 600;
        }

        /* ===== RAM BAR ===== */
        .ram-bar-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .ram-bar-wrap .label {
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }

        .ram-bar-wrap .bar-track {
            flex: 1;
            height: 5px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            overflow: hidden;
            min-width: 60px;
        }

        .ram-bar-wrap .bar-track .fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.4s ease, background 0.4s ease;
            width: 0%;
        }

        .ram-bar-wrap .bar-track .fill.green {
            background: linear-gradient(90deg, #4caf50, #8bc34a);
        }

        .ram-bar-wrap .bar-track .fill.yellow {
            background: linear-gradient(90deg, #ffeb3b, #ff9800);
        }

        .ram-bar-wrap .bar-track .fill.red {
            background: linear-gradient(90deg, #ff5722, #f44336);
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .ram-bar-wrap .info-text {
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            white-space: nowrap;
        }

        /* ===== DOWNLOAD ===== */
        .download-link {
            margin-top: 12px;
            display: none;
            text-align: center;
        }

        .download-link a {
            color: #64b5f6;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border-bottom: 2px solid rgba(100, 181, 246, 0.2);
            padding-bottom: 4px;
            transition: border-color 0.3s;
        }

        .download-link a:hover {
            border-color: #64b5f6;
        }

        /* ===== RAM SETTINGS ===== */
        .ram-settings {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .ram-settings label {
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ram-settings select {
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            transition: border-color 0.3s;
        }

        .ram-settings select:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        .ram-settings select:focus {
            border-color: rgba(100, 181, 246, 0.3);
        }

        .ram-settings select option {
            background: #302b63;
            color: #fff;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            z-index: 999;
            max-width: 90%;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.warning {
            background: rgba(255, 87, 34, 0.85);
        }

        .toast.danger {
            background: rgba(244, 67, 54, 0.9);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .container {
                padding: 12px 14px 18px;
            }

            .header h1 {
                font-size: 18px;
            }

            .controls-row .btn {
                padding: 10px 12px;
                font-size: 12px;
                min-width: 60px;
            }

            .controls-row .btn-cam {
                padding: 10px 10px;
                font-size: 11px;
            }

            .gps-overlay {
                bottom: 8px;
                right: 10px;
                padding: 4px 10px 4px 8px;
                font-size: 10px;
            }

            .gps-overlay .speed-big {
                font-size: 13px;
            }

            .status-bar {
                padding: 6px 10px;
                font-size: 12px;
            }

            .status-bar .left .time {
                font-size: 14px;
            }

            .ram-bar-wrap .info-text {
                font-size: 10px;
            }

            .ram-settings {
                flex-wrap: wrap;
            }
        }

        @media (max-width: 400px) {
            .controls-row {
                gap: 6px;
            }

            .controls-row .btn {
                padding: 8px 8px;
                font-size: 11px;
                min-width: 50px;
            }

            .controls-row .btn-cam {
                padding: 8px 6px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="header">
            <h1>🎥 Video Recorder</h1>
            <span class="badge">Overlay Time + Speed</span>
        </div>

        <!-- ===== VIDEO ===== -->
        <div class="video-wrapper">
            <video id="videoPreview" autoplay muted playsinline></video>
            <canvas id="renderCanvas"></canvas>

            <!-- GPS Overlay -->
            <div class="gps-overlay" id="gpsOverlay">
                <span class="dot red" id="gpsDot"></span>
                <span id="gpsStatus">GPS</span>
                <span style="color:rgba(255,255,255,0.2);">|</span>
                <span class="speed-big">
                    <span id="speedDisplay">0</span><span class="unit">km/h</span>
                </span>
            </div>
        </div>

        <!-- ===== CONTROLS ===== -->
        <div class="controls-row">
            <button class="btn btn-start" id="btnStart">▶ Bắt đầu</button>
            <button class="btn btn-stop" id="btnStop" disabled>⏹ Dừng</button>
            <button class="btn btn-save" id="btnSave" disabled>💾 Lưu</button>
            <button class="btn btn-flip" id="btnFlipMirror">🔄 Lật</button>
            <button class="btn btn-cam active" id="camFront" data-facing="user">🤳 Trước</button>
            <button class="btn btn-cam" id="camBack" data-facing="environment">📷 Sau</button>
        </div>

        <!-- ===== STATUS ===== -->
        <div class="status-bar">
            <div class="left">
                <span class="dot" id="statusDot"></span>
                <span id="statusText">Chưa bắt đầu</span>
                <span class="time" id="statusTime">00:00</span>
            </div>
            <div class="right">
                <span>📦 <span class="value" id="segmentCount">0</span></span>
                <span>⏱️ <span class="value" id="totalDuration">0s</span></span>
                <span>📊 <span class="value" id="totalSize">0 KB</span></span>
                <span>📷 <span class="value" id="cameraStatus">Trước</span></span>
            </div>
        </div>

        <!-- ===== RAM ===== -->
        <div class="ram-bar-wrap">
            <span class="label">💾 RAM</span>
            <div class="bar-track">
                <div class="fill green" id="ramBar" style="width:0%"></div>
            </div>
            <span class="info-text">
                <span id="usedRamText">0</span> / <span id="maxRamText">200</span> MB
                <span id="ramStatus" style="margin-left:6px;color:#4caf50;">✅</span>
            </span>
        </div>

        <div class="ram-settings">
            <label>
                Giới hạn:
                <select id="ramSelect">
                    <option value="50">50 MB</option>
                    <option value="100">100 MB</option>
                    <option value="200" selected>200 MB</option>
                    <option value="300">300 MB</option>
                    <option value="500">500 MB</option>
                    <option value="1000">1 GB</option>
                    <option value="0">Không giới hạn</option>
                </select>
            </label>
        </div>

        <div class="download-link" id="downloadLink">
            <a href="#" id="downloadAnchor" download="video.webm">📥 Tải video xuống</a>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        // TOAST
        // ============================================================
        let toastTimeout = null;

        function showToast(message, duration = 2500, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        // ============================================================
        // GPS TRACKER
        // ============================================================
        class GPSTracker {
            constructor() {
                this.watchId = null;
                this.currentSpeed = 0;
                this.isActive = false;
                this.hasFix = false;
                this.lastPosition = null;
                this.lastTime = null;

                this.statusDot = document.getElementById('gpsDot');
                this.statusText = document.getElementById('gpsStatus');
                this.speedDisplay = document.getElementById('speedDisplay');

                this.onUpdate = null;
            }

            start() {
                if (!navigator.geolocation) {
                    this.statusText.textContent = '❌ Không hỗ trợ';
                    this.statusDot.className = 'dot red';
                    showToast('❌ Trình duyệt không hỗ trợ GPS', 3000, 'danger');
                    return false;
                }

                this.isActive = true;

                this.watchId = navigator.geolocation.watchPosition(
                    (position) => this.onPositionUpdate(position),
                    (error) => this.onError(error), {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 1000,
                    }
                );

                this.statusText.textContent = 'Đang tìm...';
                this.statusDot.className = 'dot yellow';
                return true;
            }

            stop() {
                this.isActive = false;
                if (this.watchId !== null) {
                    navigator.geolocation.clearWatch(this.watchId);
                    this.watchId = null;
                }
                this.statusText.textContent = 'Đã dừng';
                this.statusDot.className = 'dot red';
                this.currentSpeed = 0;
                this.speedDisplay.textContent = '0';
            }

            onPositionUpdate(position) {
                if (!this.isActive) return;

                const coords = position.coords;
                const speed = coords.speed;

                if (speed !== null && speed !== undefined && speed >= 0) {
                    this.currentSpeed = speed * 3.6;
                } else {
                    const lat = coords.latitude;
                    const lng = coords.longitude;
                    const timestamp = position.timestamp;

                    if (this.lastPosition) {
                        const distance = this.calculateDistance(
                            this.lastPosition.lat, this.lastPosition.lng,
                            lat, lng
                        );
                        const timeDiff = (timestamp - this.lastTime) / 1000;

                        if (timeDiff > 0 && distance > 1) {
                            const speedMs = distance / timeDiff;
                            this.currentSpeed = speedMs * 3.6;
                        }
                    }

                    this.lastPosition = { lat, lng };
                    this.lastTime = timestamp;
                }

                this.currentSpeed = Math.round(this.currentSpeed * 10) / 10;

                this.hasFix = true;
                this.statusDot.className = 'dot green';
                this.statusText.textContent = 'GPS OK';
                this.speedDisplay.textContent = this.currentSpeed.toFixed(1);

                if (this.onUpdate) this.onUpdate(this.currentSpeed);
            }

            onError(error) {
                console.warn('GPS Error:', error);
                this.hasFix = false;
                this.statusDot.className = 'dot red';

                switch (error.code) {
                    case error.PERMISSION_DENIED:
                        this.statusText.textContent = 'Quyền bị từ chối';
                        showToast('⚠️ Vui lòng cấp quyền truy cập vị trí', 3000, 'warning');
                        break;
                    case error.POSITION_UNAVAILABLE:
                        this.statusText.textContent = 'Không tín hiệu';
                        break;
                    case error.TIMEOUT:
                        this.statusText.textContent = 'Timeout...';
                        break;
                    default:
                        this.statusText.textContent = 'Lỗi GPS';
                }
            }

            calculateDistance(lat1, lon1, lat2, lon2) {
                const R = 6371000;
                const dLat = this.toRad(lat2 - lat1);
                const dLon = this.toRad(lon2 - lon1);
                const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(this.toRad(lat1)) * Math.cos(this.toRad(lat2)) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                return R * c;
            }

            toRad(deg) {
                return deg * Math.PI / 180;
            }

            getSpeed() {
                return this.currentSpeed;
            }

            hasFix() {
                return this.hasFix;
            }
        }

        // ============================================================
        // VIDEO RECORDER WITH OVERLAY
        // ============================================================
        class VideoRecorderWithOverlay {
            constructor(maxDurationMs = 15 * 60 * 1000, maxRamMB = 200) {
                this.maxDurationMs = maxDurationMs;
                this.maxRamBytes = maxRamMB * 1024 * 1024;
                this.segmentDurationMs = 1000;

                this.buffer = [];
                this.totalSize = 0;
                this.totalDuration = 0;

                this.recorder = null;
                this.stream = null;
                this.canvasStream = null;
                this.isRecording = false;
                this.startTime = null;
                this.timerInterval = null;
                this.renderLoopId = null;

                this.currentFacingMode = 'user';
                this.isMirrored = true;

                this.onUpdate = null;
                this.isRamFull = false;

                this.firstChunk = null;
                this.hasHeader = false;

                this.canvas = document.getElementById('renderCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.video = document.getElementById('videoPreview');

                this.gps = new GPSTracker();
                this.gps.onUpdate = () => {};

                this.videoWidth = 1280;
                this.videoHeight = 720;
            }

            setMaxRam(mb) {
                this.maxRamBytes = mb * 1024 * 1024;
                this.checkRamLimit();
                if (this.onUpdate) this.onUpdate();
            }

            checkRamLimit() {
                if (this.maxRamBytes === 0) {
                    this.isRamFull = false;
                    return;
                }
                const usagePercent = (this.totalSize / this.maxRamBytes) * 100;
                this.isRamFull = usagePercent >= 95;
            }

            autoAdjustRam() {
                if (this.maxRamBytes === 0 || this.buffer.length === 0) return;

                const usagePercent = (this.totalSize / this.maxRamBytes) * 100;

                if (usagePercent > 90) {
                    const removeCount = Math.max(1, Math.floor(this.buffer.length * 0.05));
                    for (let i = 0; i < removeCount && this.buffer.length > 1; i++) {
                        const oldest = this.buffer.shift();
                        if (oldest) {
                            this.totalSize -= oldest.size;
                            this.totalDuration -= this.segmentDurationMs;
                        }
                    }
                }

                if (usagePercent > 95) {
                    const removeCount = Math.max(2, Math.floor(this.buffer.length * 0.15));
                    for (let i = 0; i < removeCount && this.buffer.length > 1; i++) {
                        const oldest = this.buffer.shift();
                        if (oldest) {
                            this.totalSize -= oldest.size;
                            this.totalDuration -= this.segmentDurationMs;
                        }
                    }
                }

                this.ensureHeader();
                this.checkRamLimit();
                if (this.onUpdate) this.onUpdate();
            }

            ensureHeader() {
                if (!this.firstChunk || this.buffer.length === 0) return;
                if (this.buffer[0] !== this.firstChunk) {
                    const index = this.buffer.indexOf(this.firstChunk);
                    if (index > 0) {
                        this.buffer.splice(index, 1);
                        this.totalSize -= this.firstChunk.size;
                        this.totalDuration -= this.segmentDurationMs;
                    }
                    this.buffer.unshift(this.firstChunk);
                    this.totalSize += this.firstChunk.size;
                    this.totalDuration += this.segmentDurationMs;
                }
            }

            async getCamera(facingMode = 'user') {
                const constraints = {
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                    },
                    audio: true,
                };
                return await navigator.mediaDevices.getUserMedia(constraints);
            }

            // ===== RENDER LOOP =====
            startRenderLoop() {
                const render = () => {
                    if (!this.isRecording) return;

                    const w = this.canvas.width;
                    const h = this.canvas.height;

                    // Vẽ video full canvas
                    this.ctx.drawImage(this.video, 0, 0, w, h);

                    // === OVERLAY ===
                    const now = new Date();
                    const timeStr = now.toLocaleTimeString('vi-VN', {
                        hour12: false,
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });
                    const dateStr = now.toLocaleDateString('vi-VN', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric'
                    });

                    const speed = this.gps.getSpeed();
                    const speedText = speed > 0 ? `${speed.toFixed(1)} km/h` : '0 km/h';

                    const padding = 12;
                    const fontSize = Math.max(16, Math.min(26, w / 38));
                    const smallFont = fontSize * 0.7;
                    const lineHeight = fontSize + 6;

                    this.ctx.textAlign = 'left';
                    this.ctx.textBaseline = 'top';

                    this.ctx.font = `bold ${fontSize}px 'Courier New', monospace`;
                    const timeMetrics = this.ctx.measureText(`${dateStr} - ${timeStr}`);
                    this.ctx.font = `bold ${smallFont}px 'Courier New', monospace`;
                    const speedMetrics = this.ctx.measureText(`🚀 ${speedText}`);

                    const textWidth = Math.max(timeMetrics.width, speedMetrics.width) + padding * 2 + 16;
                    const totalHeight = lineHeight * 2 + padding * 2;

                    const x = 10;
                    const y = 10;

                    const radius = 10;
                    this.ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
                    this.ctx.shadowBlur = 18;
                    this.ctx.shadowOffsetX = 0;
                    this.ctx.shadowOffsetY = 0;

                    this.ctx.beginPath();
                    this.ctx.moveTo(x + radius, y);
                    this.ctx.lineTo(x + textWidth - radius, y);
                    this.ctx.quadraticCurveTo(x + textWidth, y, x + textWidth, y + radius);
                    this.ctx.lineTo(x + textWidth, y + totalHeight - radius);
                    this.ctx.quadraticCurveTo(x + textWidth, y + totalHeight, x + textWidth - radius, y + totalHeight);
                    this.ctx.lineTo(x + radius, y + totalHeight);
                    this.ctx.quadraticCurveTo(x, y + totalHeight, x, y + totalHeight - radius);
                    this.ctx.lineTo(x, y + radius);
                    this.ctx.quadraticCurveTo(x, y, x + radius, y);
                    this.ctx.closePath();

                    this.ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
                    this.ctx.fill();
                    this.ctx.shadowBlur = 0;

                    this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
                    this.ctx.lineWidth = 1;
                    this.ctx.stroke();

                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.font = `bold ${fontSize}px 'Courier New', monospace`;
                    this.ctx.fillText(`${dateStr} - ${timeStr}`, x + padding, y + 3);

                    const speedColor = speed > 50 ? '#f44336' : speed > 30 ? '#ff9800' : '#4caf50';
                    this.ctx.fillStyle = speedColor;
                    this.ctx.font = `bold ${smallFont}px 'Courier New', monospace`;
                    this.ctx.fillText(`🚀 ${speedText}`, x + padding, y + lineHeight + 3);

                    this.renderLoopId = requestAnimationFrame(render);
                };

                render();
            }

            stopRenderLoop() {
                if (this.renderLoopId) {
                    cancelAnimationFrame(this.renderLoopId);
                    this.renderLoopId = null;
                }
            }

            // ===== START =====
            async start(facingMode = null) {
                try {
                    if (this.stream) {
                        this.stream.getTracks().forEach(track => track.stop());
                        this.stream = null;
                    }

                    const mode = facingMode || this.currentFacingMode;
                    this.stream = await this.getCamera(mode);
                    this.currentFacingMode = mode;

                    this.video.srcObject = this.stream;
                    await this.video.play();

                    // Lấy kích thước thực tế từ video
                    const videoTrack = this.stream.getVideoTracks()[0];
                    const settings = videoTrack.getSettings();
                    this.videoWidth = settings.width || 1280;
                    this.videoHeight = settings.height || 720;

                    // === QUAN TRỌNG: Set canvas đúng kích thước ===
                    this.canvas.width = this.videoWidth;
                    this.canvas.height = this.videoHeight;
                    this.canvas.style.width = '100%';
                    this.canvas.style.height = 'auto';
                    this.canvas.style.aspectRatio = `${this.videoWidth} / ${this.videoHeight}`;

                    this.applyMirror();

                    this.buffer = [];
                    this.totalSize = 0;
                    this.totalDuration = 0;
                    this.firstChunk = null;
                    this.hasHeader = false;
                    this.isRamFull = false;

                    // Tạo stream từ canvas
                    this.canvasStream = this.canvas.captureStream(30);

                    // Thêm audio
                    const audioTracks = this.stream.getAudioTracks();
                    if (audioTracks.length > 0) {
                        this.canvasStream.addTrack(audioTracks[0]);
                    }

                    this.recorder = new MediaRecorder(this.canvasStream, {
                        mimeType: 'video/webm;codecs=vp8,opus',
                    });

                    this.recorder.start(this.segmentDurationMs);

                    this.recorder.ondataavailable = (event) => {
                        if (event.data.size === 0) return;

                        if (!this.hasHeader) {
                            this.firstChunk = event.data;
                            this.hasHeader = true;
                        }

                        this.buffer.push(event.data);
                        this.totalSize += event.data.size;
                        this.totalDuration += this.segmentDurationMs;

                        while (this.totalDuration > this.maxDurationMs && this.buffer.length > 0) {
                            const oldest = this.buffer.shift();
                            if (oldest) {
                                this.totalSize -= oldest.size;
                                this.totalDuration -= this.segmentDurationMs;
                            }
                        }

                        if (this.buffer.length % 10 === 0) {
                            this.autoAdjustRam();
                        }

                        let loopCount = 0;
                        while (this.maxRamBytes > 0 &&
                            this.totalSize > this.maxRamBytes &&
                            this.buffer.length > 1) {
                            const oldest = this.buffer.shift();
                            if (oldest) {
                                this.totalSize -= oldest.size;
                                this.totalDuration -= this.segmentDurationMs;
                            }
                            loopCount++;
                            if (loopCount > 100) break;
                        }

                        this.ensureHeader();
                        this.checkRamLimit();

                        if (this.onUpdate) this.onUpdate();
                    };

                    this.isRecording = true;
                    this.startTime = Date.now();

                    this.gps.start();
                    this.startRenderLoop();

                    this.timerInterval = setInterval(() => {
                        if (this.isRecording) {
                            this.autoAdjustRam();
                        }
                        if (this.onUpdate) this.onUpdate();
                    }, 2000);

                    if (this.onUpdate) this.onUpdate();
                    return true;
                } catch (err) {
                    console.error('Lỗi:', err);
                    showToast('❌ Không thể truy cập camera!', 3000, 'danger');
                    return false;
                }
            }

            stop() {
                if (this.recorder && this.isRecording) {
                    this.recorder.stop();
                    this.isRecording = false;
                }

                this.gps.stop();
                this.stopRenderLoop();

                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }

                if (this.onUpdate) this.onUpdate();
            }

            save() {
                if (this.buffer.length === 0) {
                    showToast('⚠️ Chưa có dữ liệu video!', 2000);
                    return null;
                }

                try {
                    let chunks = [...this.buffer];
                    if (this.firstChunk && !chunks.includes(this.firstChunk)) {
                        chunks.unshift(this.firstChunk);
                    }

                    const blob = new Blob(chunks, {
                        type: 'video/webm'
                    });

                    if (blob.size === 0) {
                        showToast('❌ File rỗng!', 2000, 'danger');
                        return null;
                    }

                    return blob;
                } catch (err) {
                    console.error('Lỗi khi tạo blob:', err);
                    showToast('❌ Lỗi tạo file video!', 3000, 'danger');
                    return null;
                }
            }

            async switchCamera(facingMode) {
                if (facingMode === this.currentFacingMode) {
                    showToast('ℹ️ Đã ở camera này rồi!', 1500);
                    return false;
                }

                const wasRecording = this.isRecording;
                if (wasRecording) {
                    this.stop();
                }

                try {
                    const success = await this.start(facingMode);
                    if (success) {
                        this.currentFacingMode = facingMode;
                        const label = facingMode === 'user' ? 'Trước' : 'Sau';
                        showToast(`✅ Đã chuyển sang camera ${label}`, 1500);
                        if (this.onUpdate) this.onUpdate();
                        return true;
                    }
                    return false;
                } catch (err) {
                    showToast('❌ Không thể chuyển camera!', 2000, 'danger');
                    return false;
                }
            }

            applyMirror() {
                if (this.isMirrored && this.currentFacingMode === 'user') {
                    this.video.style.transform = 'scaleX(-1)';
                } else {
                    this.video.style.transform = 'scaleX(1)';
                }
            }

            toggleMirror() {
                this.isMirrored = !this.isMirrored;
                this.applyMirror();
                showToast(this.isMirrored ? '🔄 Đã bật gương' : '🔄 Đã tắt gương', 1500);
                if (this.onUpdate) this.onUpdate();
            }

            getSegmentCount() {
                return this.buffer.length;
            }

            getElapsedSeconds() {
                if (!this.startTime) return 0;
                return Math.floor((Date.now() - this.startTime) / 1000);
            }

            getRamUsagePercent() {
                if (this.maxRamBytes === 0) return 0;
                return Math.min((this.totalSize / this.maxRamBytes) * 100, 100);
            }

            formatTime(ms) {
                const totalSec = Math.floor(ms / 1000);
                const min = String(Math.floor(totalSec / 60)).padStart(2, '0');
                const sec = String(totalSec % 60).padStart(2, '0');
                return `${min}:${sec}`;
            }

            formatSize(bytes) {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / 1048576).toFixed(1) + ' MB';
            }

            getMaxRamMB() {
                return this.maxRamBytes / (1024 * 1024);
            }

            getGPS() {
                return this.gps;
            }
        }

        // ============================================================
        // UI CONTROLLER
        // ============================================================

        const recorder = new VideoRecorderWithOverlay(15 * 60 * 1000, 200);
        const gps = recorder.getGPS();

        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const statusTime = document.getElementById('statusTime');
        const segmentCount = document.getElementById('segmentCount');
        const totalDuration = document.getElementById('totalDuration');
        const totalSize = document.getElementById('totalSize');
        const cameraStatus = document.getElementById('cameraStatus');
        const ramStatus = document.getElementById('ramStatus');
        const usedRamText = document.getElementById('usedRamText');
        const maxRamText = document.getElementById('maxRamText');
        const ramBar = document.getElementById('ramBar');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const btnSave = document.getElementById('btnSave');
        const btnFlipMirror = document.getElementById('btnFlipMirror');
        const camFront = document.getElementById('camFront');
        const camBack = document.getElementById('camBack');
        const downloadLink = document.getElementById('downloadLink');
        const downloadAnchor = document.getElementById('downloadAnchor');
        const ramSelect = document.getElementById('ramSelect');

        function updateUI() {
            const count = recorder.getSegmentCount();
            const sizeMB = recorder.totalSize / (1024 * 1024);
            const maxMB = recorder.getMaxRamMB();

            segmentCount.textContent = count;
            totalDuration.textContent = (recorder.totalDuration / 1000).toFixed(1) + 's';
            totalSize.textContent = recorder.formatSize(recorder.totalSize);

            usedRamText.textContent = sizeMB.toFixed(1);
            maxRamText.textContent = maxMB === 0 ? '∞' : maxMB;

            const usagePercent = recorder.getRamUsagePercent();
            ramBar.style.width = Math.min(usagePercent, 100) + '%';

            ramBar.className = 'fill';
            if (usagePercent >= 95) {
                ramBar.classList.add('red');
                ramStatus.textContent = '🔥';
            } else if (usagePercent >= 80) {
                ramBar.classList.add('yellow');
                ramStatus.textContent = '⚡';
            } else {
                ramBar.classList.add('green');
                ramStatus.textContent = '✅';
            }

            const camLabel = recorder.currentFacingMode === 'user' ? 'Trước' : 'Sau';
            cameraStatus.textContent = camLabel;

            camFront.classList.toggle('active', recorder.currentFacingMode === 'user');
            camBack.classList.toggle('active', recorder.currentFacingMode === 'environment');

            if (recorder.isRecording) {
                statusDot.className = 'dot recording';
                statusText.textContent = '🔴 Đang quay';
                const elapsed = recorder.getElapsedSeconds();
                const min = String(Math.floor(elapsed / 60)).padStart(2, '0');
                const sec = String(elapsed % 60).padStart(2, '0');
                statusTime.textContent = `${min}:${sec}`;
            } else {
                statusDot.className = 'dot';
                statusText.textContent = '⏸ Đã dừng';
                if (count > 0) {
                    statusTime.textContent = recorder.formatTime(recorder.totalDuration);
                } else {
                    statusTime.textContent = '00:00';
                }
            }

            btnStart.disabled = recorder.isRecording;
            btnStop.disabled = !recorder.isRecording;
            btnSave.disabled = (count === 0);

            camFront.disabled = recorder.isRecording;
            camBack.disabled = recorder.isRecording;
            btnFlipMirror.disabled = recorder.isRecording;

            if (count === 0) {
                downloadLink.style.display = 'none';
            }
        }

        recorder.onUpdate = updateUI;

        gps.onUpdate = (speed) => {};

        // ===== SỰ KIỆN =====

        ramSelect.addEventListener('change', function() {
            const value = parseInt(this.value);
            if (value === 0) {
                showToast('♾️ Đã tắt giới hạn RAM', 1500);
            } else {
                showToast(`💾 Đã đặt giới hạn RAM: ${value} MB`, 1500);
            }
            recorder.setMaxRam(value);
            updateUI();
        });

        btnStart.addEventListener('click', async () => {
            const ok = await recorder.start(recorder.currentFacingMode);
            if (ok) {
                downloadLink.style.display = 'none';
                showToast('🎥 Đã bắt đầu quay + GPS!', 1500);
                updateUI();
            }
        });

        btnStop.addEventListener('click', () => {
            recorder.stop();
            showToast('⏹ Đã dừng quay', 1500);
            updateUI();
        });

        btnSave.addEventListener('click', () => {
            const blob = recorder.save();

            if (!blob || blob.size === 0) {
                showToast('❌ Không thể tạo file video!', 3000, 'danger');
                return;
            }

            const url = URL.createObjectURL(blob);
            downloadAnchor.href = url;

            const now = new Date();
            const dateStr =
                `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}h${String(now.getMinutes()).padStart(2,'0')}`;
            const camLabel = recorder.currentFacingMode === 'user' ? 'truoc' : 'sau';
            downloadAnchor.download = `video_overlay_${camLabel}_${dateStr}.webm`;

            downloadLink.style.display = 'block';
            setTimeout(() => {
                downloadAnchor.click();
                setTimeout(() => {
                    URL.revokeObjectURL(url);
                }, 5000);
            }, 300);

            const sizeMB = (blob.size / 1048576).toFixed(1);
            showToast(`✅ Đã lưu ${sizeMB} MB`, 2500);
            statusText.textContent = `✅ Đã lưu ${sizeMB} MB`;
        });

        camFront.addEventListener('click', async () => {
            await recorder.switchCamera('user');
            updateUI();
        });

        camBack.addEventListener('click', async () => {
            await recorder.switchCamera('environment');
            updateUI();
        });

        btnFlipMirror.addEventListener('click', () => {
            recorder.toggleMirror();
            updateUI();
        });

        updateUI();

        window.addEventListener('beforeunload', () => {
            recorder.stop();
        });

        console.log('🎥 Video Recorder với Overlay Time + Speed!');
        console.log('✅ Canvas được set đúng kích thước video');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Camera Hành Trình</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-dark: #000;
            --panel-bg: rgba(20, 20, 25, 0.92);
            --panel-border: rgba(255, 255, 255, 0.18);
            --text-primary: #fff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --accent-green: #34c759;
            --accent-blue: #007aff;
            --accent-orange: #ff9500;
            --accent-red: #ff3b30;

            --btn-size: 14vmin;
            --btn-border: 0.5vmin;
            --modal-w: 65vmin;
            --modal-h: 30vmin;
            --modal-radius: 4vmin;
            --gap: 3vmin;
            --pad: 4vmin;
            --font-base: 3.5vmin;
            --font-time: 5vmin;
            --font-speed: 6vmin;
            --font-small: 3vmin;
            --bar-h: 1.8vmin;
            --dot-size: 2.2vmin;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: #000;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        .app {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .canvas-container {
            position: relative;
            width: calc(100vw * 0.9);
            max-height: calc(100vh * 0.9);
            background: #000;
            border-radius: 3vmin;
            overflow: hidden;
            box-shadow: 0 0 6vmin rgba(0,0,0,0.6);
            cursor: pointer;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #videoPreview {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            width: 1px;
            height: 1px;
        }

        .control-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: var(--modal-w);
            min-height: var(--modal-h);
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: var(--modal-radius);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: var(--gap);
            padding: var(--pad);
            z-index: 10;
            backdrop-filter: blur(20px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease;
        }

        .control-modal.visible {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .btn-row {
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            width: 100%;
        }

        .btn {
            width: var(--btn-size);
            height: var(--btn-size);
            border-radius: 50%;
            border: var(--btn-border) solid var(--panel-border);
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6vmin;
            transition: all 0.15s ease;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        .btn:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.2); }
        .btn:disabled { opacity: 0.35; pointer-events: none; }

        .btn-mirror { color: var(--text-secondary); }
        .btn-cam { color: var(--accent-blue); }
        .btn-rotate { color: #9c27b0; }
        .btn-save { color: var(--accent-orange); border-color: rgba(255, 149, 0, 0.3); }

        .ram-row {
            display: flex;
            align-items: center;
            gap: 2.5vmin;
            width: 100%;
            font-size: var(--font-small);
            color: rgba(255,255,255,0.45);
        }

        .ram-bar-bg {
            flex: 1;
            height: var(--bar-h);
            background: rgba(255,255,255,0.1);
            border-radius: 1vmin;
            overflow: hidden;
        }

        .ram-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 1vmin;
            transition: width 0.3s, background 0.3s;
        }
        .ram-bar-fill.green { background: var(--accent-green); }
        .ram-bar-fill.yellow { background: var(--accent-orange); }
        .ram-bar-fill.red { background: var(--accent-red); animation: blink 0.8s infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.5} }

        .ram-row select {
            padding: 1vmin 2vmin;
            border-radius: 1.5vmin;
            border: 1px solid var(--panel-border);
            background: rgba(0,0,0,0.3);
            color: var(--text-secondary);
            font-size: var(--font-small);
            outline: none;
        }

        .ram-text { font-variant-numeric: tabular-nums; white-space: nowrap; }

        .toast {
            position: fixed;
            bottom: 10vmin;
            left: 50%;
            transform: translateX(-50%) translateY(2vmin);
            background: var(--panel-bg);
            color: var(--text-primary);
            padding: 3vmin 6vmin;
            border-radius: 3vmin;
            font-size: var(--font-base);
            backdrop-filter: blur(15px);
            border: 1px solid var(--panel-border);
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 100;
            max-width: 90vw;
            text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { border-color: rgba(52, 199, 89, 0.4); }
        .toast.warning { border-color: rgba(255, 149, 0, 0.4); }
        .toast.danger { border-color: rgba(255, 59, 48, 0.4); }

        @media (orientation: landscape) {
            :root { --modal-w: 30vmin; --modal-h: 70vmin; }
            .btn-row { flex-direction: column; gap: var(--gap); }
            .ram-row { flex-direction: column; align-items: flex-start; }
            .ram-bar-bg { width: 100%; }
        }
    </style>
</head>
<body>

<div class="app">
    <div class="canvas-container" id="canvasContainer">
        <video id="videoPreview" autoplay muted playsinline></video>
        <canvas id="renderCanvas"></canvas>
    </div>

    <div class="control-modal" id="controlModal">
        <div class="btn-row">
            <button class="btn btn-mirror" id="btnMirror" title="Lật ngang hình">↔️</button>
            <button class="btn btn-rotate" id="btnRotate" title="Xoay 90°">🔄</button>
            <button class="btn btn-save" id="btnSave" disabled title="Lưu video">💾</button>
            <button class="btn btn-cam" id="btnCam" title="Chuyển camera">📷</button>
        </div>
        <div class="ram-row">
            <span>RAM:</span>
            <div class="ram-bar-bg"><div class="ram-bar-fill green" id="ramBar"></div></div>
            <span class="ram-text" id="ramText">0/200MB</span>
            <select id="ramLimit">
                <option value="50">50</option>
                <option value="100">100</option>
                <option value="200" selected>200</option>
                <option value="300">300</option>
                <option value="500">500</option>
                <option value="1000">1GB</option>
                <option value="0">∞</option>
            </select>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
let toastTimer = null;
function showToast(msg, dur = 2500, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), dur);
}

const controlModal = document.getElementById('controlModal');
const canvasContainer = document.getElementById('canvasContainer');
let hideTimer = null;
const SHOW_DURATION = 5000;

function showControls() {
    controlModal.classList.add('visible');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(hideControls, SHOW_DURATION);
}
function hideControls() {
    controlModal.classList.remove('visible');
    clearTimeout(hideTimer);
}

canvasContainer.addEventListener('click', e => {
    if (e.target.closest('.btn') || e.target.closest('select')) return;
    showControls();
});
canvasContainer.addEventListener('touchstart', e => {
    if (e.target.closest('.btn') || e.target.closest('select')) return;
    showControls();
}, { passive: true });

class GPSTracker {
    constructor() {
        this.watchId = null;
        this.speed = 0;
        this.active = false;
        this.lastPos = null;
        this.gpsStatus = 'searching';
        this.statusText = 'Tìm tín hiệu...';
        this.statusColor = 'yellow';
    }
    start() {
        if (!navigator.geolocation) {
            showToast('❌ Trình duyệt không hỗ trợ GPS', 3000, 'danger');
            this.gpsStatus = 'denied';
            return false;
        }
        this.active = true;
        this.watchId = navigator.geolocation.watchPosition(
            p => this.handle(p),
            e => this.err(e),
            { enableHighAccuracy: true, timeout: 8000, maximumAge: 1000 }
        );
        return true;
    }
    stop() {
        this.active = false;
        if (this.watchId) navigator.geolocation.clearWatch(this.watchId);
        this.speed = 0;
    }
    handle(pos) {
        if (!this.active) return;
        const c = pos.coords;
        if (c.speed !== null && c.speed >= 0) {
            this.speed = Math.round(c.speed * 3.6 * 10) / 10;
        } else {
            this.speed = this.calcSpeed(c, pos.timestamp);
        }
        this.gpsStatus = 'ok';
        this.statusText = 'GPS';
        this.statusColor = 'green';
    }
    calcSpeed(coords, ts) {
        if (!this.lastPos) {
            this.lastPos = { lat: coords.latitude, lng: coords.longitude, ts };
            return 0;
        }
        const d = this.dist(this.lastPos.lat, this.lastPos.lng, coords.latitude, coords.longitude);
        const t = (ts - this.lastPos.ts) / 1000;
        this.lastPos = { lat: coords.latitude, lng: coords.longitude, ts };
        return t > 0 && d > 1 ? Math.round((d / t) * 3.6 * 10) / 10 : 0;
    }
    dist(lat1, lon1, lat2, lon2) {
        const R = 6371e3, r = Math.PI / 180;
        const dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
        const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLon / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }
    err(e) {
        const m = {
            1: ['Cấp quyền vị trí', 'red'],
            2: ['Không có tín hiệu', 'red'],
            3: ['Mất tín hiệu', 'yellow']
        }[e.code] || ['Lỗi GPS', 'red'];
        this.statusText = m[0];
        this.statusColor = m[1];
        this.gpsStatus = e.code === 1 ? 'denied' : 'lost';
    }
    getSpeed() { return this.speed; }
    getStatus() { return this.gpsStatus; }
    getStatusText() { return this.statusText; }
    getStatusColor() { return this.statusColor; }
}

class VideoRecorder {
    constructor(maxMB = 200) {
        this.max = maxMB === 0 ? Infinity : maxMB * 1024 * 1024;
        this.chunks = [];
        this.totalSize = 0;
        this.firstChunk = null;
        this.hasHeader = false;
        this.canvas = document.getElementById('renderCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.video = document.getElementById('videoPreview');
        this.gps = new GPSTracker();
        this.facing = 'user';
        this.mirror = false;
        this.rotate = 0; // 0, 90, 180, 270
        this.rendering = false;

        this.stream = null;
        this.canvasStream = null;
        this.recorder = null;
        this.recording = false;
        this.segTime = 1000;
    }

    setMaxMB(mb) {
        this.max = mb === 0 ? Infinity : mb * 1024 * 1024;
        this.capChunks();
        this.updateRAMUI();
    }

    async initCam(facing = 'user') {
        const cons = {
            video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: true
        };
        try {
            this.stream = await navigator.mediaDevices.getUserMedia(cons);
            this.facing = facing;
            this.video.srcObject = this.stream;
            await this.video.play();

            this.canvas.width = 1280;
            this.canvas.height = 720;

            this.startDraw();
            this.gps.start();
            this.startRecording();
            return true;
        } catch (err) {
            showToast('❌ Không truy cập được camera', 3000, 'danger');
            console.error(err);
            return false;
        }
    }

    async switchCam() {
        const newFacing = this.facing === 'user' ? 'environment' : 'user';
        this.stopRecording();
        this.stream?.getTracks().forEach(t => t.stop());
        this.chunks = []; this.totalSize = 0; this.firstChunk = null; this.hasHeader = false;
        await this.initCam(newFacing);
        showToast(`Đã chuyển camera: ${newFacing === 'user' ? 'Trước' : 'Sau'}`, 2000);
    }

    toggleMirror() {
        this.mirror = !this.mirror;
        showToast(this.mirror ? '🔄 Bật gương hình' : '🔄 Tắt gương hình', 2000);
    }

    toggleRotate() {
        this.rotate = (this.rotate + 90) % 360;
        const labels = { 0: '0°', 90: '90°', 180: '180°', 270: '270°' };
        showToast(`🔄 Xoay: ${labels[this.rotate]}`, 2000);
    }

    startRecording() {
        if (this.recording) return;
        this.chunks = []; this.totalSize = 0; this.firstChunk = null; this.hasHeader = false;
        this.canvasStream = this.canvas.captureStream(30);
        const aTrack = this.stream?.getAudioTracks()[0];
        if (aTrack) this.canvasStream.addTrack(aTrack);

        let mime = 'video/webm;codecs=vp9,opus';
        if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm;codecs=vp8,opus';
        if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';

        this.recorder = new MediaRecorder(this.canvasStream, { mimeType: mime });
        this.recorder.ondataavailable = e => this.onChunk(e);
        this.recorder.start(this.segTime);
        this.recording = true;
    }

    stopRecording() {
        if (!this.recording) return;
        this.recorder.stop();
        this.recording = false;
    }

    onChunk(e) {
        if (!e.data.size) return;
        if (!this.hasHeader) { this.firstChunk = e.data; this.hasHeader = true; }
        this.chunks.push(e.data);
        this.totalSize += e.data.size;
        this.capChunks();
        this.updateRAMUI();
    }

    capChunks() {
        while (this.chunks.length > 1 && this.totalSize > this.max) {
            const rm = this.chunks.shift();
            this.totalSize -= rm.size;
            if (rm === this.firstChunk && this.chunks.length) {
                this.chunks.unshift(rm);
                this.totalSize += rm.size;
                break;
            }
        }
    }

    saveVideo() {
        if (!this.chunks.length) {
            showToast('Chưa có video để lưu', 2500, 'warning');
            return;
        }
        const list = this.chunks[0] !== this.firstChunk ? [this.firstChunk, ...this.chunks] : this.chunks;
        const blob = new Blob(list, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const d = new Date();
        a.download = `cam-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}.webm`;
        a.href = url;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
        showToast(`✅ Đã lưu: ${(blob.size / 1048576).toFixed(1)} MB`, 3000, 'success');
    }

    updateRAMUI() {
        const maxMB = this.max === Infinity ? '∞' : Math.round(this.max / 1048576);
        const usedMB = Math.round(this.totalSize / 1048576);
        const pct = this.max === Infinity ? 0 : Math.min((this.totalSize / this.max) * 100, 100);
        const bar = document.getElementById('ramBar');
        bar.style.width = pct + '%';
        bar.className = 'ram-bar-fill ' + (pct >= 95 ? 'red' : pct >= 80 ? 'yellow' : 'green');
        document.getElementById('ramText').textContent = `${usedMB}/${maxMB}MB`;
        document.getElementById('btnSave').disabled = this.chunks.length === 0;
    }

    roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    drawHUD(baseW, baseH) {
        const ctx = this.ctx;
        const now = new Date();
        const date = now.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
        const time = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
        const speed = this.gps.getSpeed();
        const speedStr = speed.toFixed(1) + ' km/h';
        const gpsColor = this.gps.getStatusColor();

        // Tính kích thước theo khung gốc (chưa xoay)
        const vmin = Math.min(baseW, baseH) / 100;
        const baseSize = 3.5 * vmin;
        const timeSize = 5 * vmin;
        const speedSize = 6 * vmin;
        const padX = 4 * vmin;
        const padY = 3 * vmin;
        const margin = 4 * vmin;
        const radius = 4 * vmin;
        const lineGap = 2 * vmin;
        const dotR = 1.1 * vmin;

        ctx.font = `bold ${baseSize}px -apple-system, 'Segoe UI', Roboto, sans-serif`;
        const dateW = ctx.measureText(date).width;
        ctx.font = `bold ${timeSize}px -apple-system, 'Segoe UI', Roboto, sans-serif`;
        const timeW = ctx.measureText(time).width;
        ctx.font = `bold ${speedSize}px -apple-system, 'Segoe UI', Roboto, sans-serif`;
        const speedW = ctx.measureText(speedStr).width;

        const boxW = Math.max(dateW, timeW, speedW) + padX * 2;
        const boxH = padY * 2 + baseSize + timeSize + speedSize + lineGap * 2;
        const bx = margin;
        const by = margin;

        ctx.save();
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        this.roundRect(ctx, bx, by, boxW, boxH, radius);
        ctx.fill();
        ctx.restore();

        let tx = bx + padX, ty = by + padY + baseSize * 0.8;

        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.font = `bold ${baseSize}px -apple-system, 'Segoe UI', Roboto, sans-serif`;
        ctx.fillText(date, tx, ty);
        ty += baseSize + lineGap;

        ctx.font = `bold ${timeSize}px -apple-system, 'Segoe UI', Roboto, sans-serif`;
        ctx.fillText(time, tx, ty);
        ty += timeSize + lineGap;

        const speedColor = speed >= 50 ? '#ff3b30' : speed >= 30 ? '#ff9500' : '#34c759';
        ctx.fillStyle = speedColor;
        ctx.font = `bold ${speedSize}px -apple-system, 'Segoe UI', Roboto, sans-serif`;
        ctx.fillText(speedStr, tx, ty);

        const dotX = bx + padX - dotR;
        const dotY = by + padY + baseSize * 0.5;
        ctx.beginPath();
        ctx.arc(dotX, dotY, dotR, 0, Math.PI * 2);
        ctx.fillStyle = gpsColor === 'green' ? '#34c759' : gpsColor === 'yellow' ? '#ff9500' : '#ff3b30';
        ctx.fill();
    }

    startDraw() {
        if (this.rendering) return;
        this.rendering = true;
        const draw = () => {
            if (!this.rendering) return;

            const vw = this.video.videoWidth;
            const vh = this.video.videoHeight;
            if (!vw || !vh) {
                requestAnimationFrame(draw);
                return;
            }

            // === Xác định kích thước canvas sau khi xoay ===
            let outW, outH;
            if (this.rotate === 90 || this.rotate === 270) {
                outW = vh;
                outH = vw;
            } else {
                outW = vw;
                outH = vh;
            }

            // Cập nhật canvas nếu kích thước thay đổi
            if (this.canvas.width !== outW || this.canvas.height !== outH) {
                this.canvas.width = outW;
                this.canvas.height = outH;
            }

            const cw = outW, ch = outH;
            this.ctx.clearRect(0, 0, cw, ch);

            // === Tính tỉ lệ vẽ video vừa khít khung gốc ===
            const scale = Math.min(cw / vw, ch / vh);
            const dw = vw * scale;
            const dh = vh * scale;

            // === Quan trọng: XOAY TOÀN BỘ (video + HUD) ===
            this.ctx.save();

            // Di chuyển gốc tọa độ về tâm canvas
            const cx = cw / 2;
            const cy = ch / 2;
            this.ctx.translate(cx, cy);

            // Xoay theo góc đã chọn
            this.ctx.rotate((this.rotate * Math.PI) / 180);

            // Lật ngang nếu cần
            if (this.mirror) {
                this.ctx.scale(-1, 1);
            }

            // Vẽ video căn giữa — tọa độ tương đối với tâm
            this.ctx.drawImage(this.video, -dw / 2, -dh / 2, dw, dh);

            // === Vẽ HUD TRONG KHU VỰC ĐÃ XOAY ===
            // Tính tọa độ HUD trong hệ tọa độ chưa xoay
            const margin = 4 * Math.min(dw, dh) / 100;
            this.drawHUD(dw, dh);

            // Kết thúc khối xoay
            this.ctx.restore();

            requestAnimationFrame(draw);
        };
        draw();
    }
}

const cam = new VideoRecorder(200);

function attachClick(el, handler) {
    el.addEventListener('click', handler);
    el.addEventListener('touchstart', e => {
        e.stopPropagation();
        handler();
    }, { passive: true });
}

attachClick(document.getElementById('btnMirror'), () => cam.toggleMirror());
attachClick(document.getElementById('btnRotate'), () => cam.toggleRotate());
attachClick(document.getElementById('btnCam'), () => cam.switchCam());
attachClick(document.getElementById('btnSave'), () => cam.saveVideo());

document.getElementById('ramLimit').addEventListener('change', e => cam.setMaxMB(parseInt(e.target.value)));

cam.initCam('user');

window.addEventListener('beforeunload', () => {
    cam.stopRecording();
    cam.gps.stop();
});
</script>

</body>
</html>

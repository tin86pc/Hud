<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Camera Hành Trình</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-dark: #000;
            --panel-bg: rgba(10, 10, 15, 0.75);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-primary: #fff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-muted: rgba(255, 255, 255, 0.35);
            --accent-red: #ff3b30;
            --accent-green: #34c759;
            --accent-yellow: #ff9500;
            --accent-blue: #007aff;
            --accent-orange: #ff6b35;
            --radius-lg: 20px;
            --radius-md: 14px;
            --shadow-panel: 0 4px 24px rgba(0, 0, 0, 0.6);
        }

        body {
            font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            background: var(--bg-dark);
            overflow: hidden;
        }

        /* ===== Video & Canvas - Luôn ở dưới ===== */
        .video-wrapper {
            position: absolute;
            inset: 0;
            background: var(--bg-dark);
            z-index: 1;
        }

        #videoPreview {
            width: 100%;
            height: 100%;
            display: none;
            object-fit: cover;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            background: var(--bg-dark);
            object-fit: cover;
        }

        /* ===== Giao diện điều khiển - LUÔN TRÊN CÙNG ===== */
        .overlay {
            position: absolute;
            inset: 0;
            z-index: 99;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: max(12px, env(safe-area-inset-top)) 12px max(20px, env(safe-area-inset-bottom)) 12px;
        }

        .overlay > * { pointer-events: auto; }

        /* ==== THANH TRÊN - Đơn giản hơn ==== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .top-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .app-brand {
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .rec-indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            background: rgba(255, 59, 48, 0.15);
            border: 1px solid rgba(255, 59, 48, 0.3);
            border-radius: 30px;
            font-size: 11px;
            color: var(--accent-red);
            font-weight: 700;
            letter-spacing: 0.5px;
            opacity: 0;
            transform: translateY(-4px);
            transition: all 0.3s ease;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }
        .rec-indicator.show {
            opacity: 1;
            transform: translateY(0);
        }
        .rec-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent-red);
            animation: recPulse 1s infinite;
        }
        @keyframes recPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        .top-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .gps-panel {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-md);
            font-size: 11px;
            color: var(--text-secondary);
        }
        .gps-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .gps-dot.green { background: var(--accent-green); animation: gpsPulse 1.5s infinite; }
        .gps-dot.yellow { background: var(--accent-yellow); animation: gpsPulse 1.5s infinite; }
        .gps-dot.red { background: var(--accent-red); }
        @keyframes gpsPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .center-spacer { flex: 1; }

        /* ==== THANH THÔNG TIN DƯỚI ==== */
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            margin-bottom: 8px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-md);
            font-size: 12px;
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
        }
        .info-item span {
            color: var(--text-secondary);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        /* ==== THANH RAM ==== */
        .ram-bar-wrapper {
            padding: 0 16px 8px;
        }
        .ram-panel {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-md);
            flex-wrap: wrap;
        }
        .ram-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .ram-track {
            flex: 1;
            height: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            overflow: hidden;
            min-width: 60px;
        }
        .ram-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.4s ease, background 0.4s ease;
            width: 0%;
        }
        .ram-fill.green { background: linear-gradient(90deg, var(--accent-green), #8edb56); }
        .ram-fill.yellow { background: linear-gradient(90deg, var(--accent-yellow), #ffcc00); }
        .ram-fill.red { background: linear-gradient(90deg, var(--accent-red), #ff6b6b); animation: blink 0.8s infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.5} }
        .ram-values {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
        }
        .ram-values span {
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }
        .ram-selector {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .ram-selector label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        .ram-selector select {
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
            background: rgba(0,0,0,0.3);
            color: var(--text-secondary);
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }
        .ram-selector select:focus { border-color: var(--accent-blue); }

        /* ==== NÚT ĐIỀU KHIỂN - KÉO LÊN CAO HƠN ==== */
        .controls-bar {
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 8px 8px 12px; /* Giảm khoảng dưới kéo nút lên */
            min-height: 100px;
        }

        .ctrl-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ctrl-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            color: var(--text-secondary);
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            border: 1px solid var(--panel-border);
            position: relative;
            z-index: 100;
            flex-shrink: 0;
        }
        .ctrl-btn:active { transform: scale(0.92); }
        .ctrl-btn:disabled { opacity: 0.25; cursor: not-allowed; transform: none; }
        .ctrl-btn:hover:not(:disabled) {
            background: rgba(255,255,255,0.12);
            color: var(--text-primary);
        }

        .ctrl-btn.secondary {
            width: 52px;
            height: 52px;
            font-size: 22px;
        }

        .ctrl-btn.save-btn {
            background: rgba(255, 107, 53, 0.15);
            color: var(--accent-orange);
            border-color: rgba(255, 107, 53, 0.25);
        }
        .ctrl-btn.save-btn:hover:not(:disabled) {
            background: rgba(255, 107, 53, 0.25);
        }

        .cam-switch-btn.front { color: var(--accent-blue); }
        .cam-switch-btn.back { color: var(--accent-green); }

        .record-btn-wrap {
            position: relative;
            z-index: 100;
        }
        .btn-record {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            position: relative;
            z-index: 100;
            flex-shrink: 0;
        }
        .btn-record:active { transform: scale(0.93); }
        .btn-record.idle {
            border-color: rgba(52, 199, 89, 0.4);
            background: rgba(52, 199, 89, 0.1);
        }
        .btn-record.idle:hover {
            background: rgba(52, 199, 89, 0.2);
            border-color: rgba(52, 199, 89, 0.6);
        }
        .btn-record.recording {
            border-color: rgba(255, 59, 48, 0.5);
            background: rgba(255, 59, 48, 0.15);
        }
        .btn-record.recording::after {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 2px solid transparent;
            animation: recordRing 1.5s infinite;
        }
        @keyframes recordRing {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.35); opacity: 0; }
        }

        /* ==== THÔNG BÁO TOAST ==== */
        .toast {
            position: fixed;
            bottom: 130px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--panel-bg);
            color: var(--text-primary);
            padding: 14px 28px;
            border-radius: var(--radius-lg);
            font-size: 15px;
            font-weight: 500;
            backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow-panel);
            opacity: 0;
            transition: all 0.35s ease;
            pointer-events: none;
            z-index: 200;
            max-width: 85%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.warning { border-color: rgba(255, 149, 0, 0.3); }
        .toast.danger { border-color: rgba(255, 59, 48, 0.3); }
        .toast.success { border-color: rgba(52, 199, 89, 0.3); }

        /* ==== Responsive ==== */
        @media (max-width: 400px) {
            .btn-record { width: 72px; height: 72px; font-size: 28px; }
            .ctrl-btn { width: 54px; height: 54px; font-size: 20px; }
            .ctrl-btn.secondary { width: 48px; height: 48px; font-size: 20px; }
        }

        /* ==== Giao diện NGANG ==== */
        @media (orientation: landscape) {
            .overlay {
                padding: 12px max(12px, env(safe-area-inset-left));
                flex-direction: row;
                justify-content: space-between;
            }

            .top-bar {
                flex-direction: column;
                justify-content: flex-start;
                align-items: flex-start;
                height: 100%;
                width: 220px;
                flex-shrink: 0;
            }

            .top-right {
                align-items: flex-start;
                width: 100%;
            }

            .bottom-stack {
                display: flex;
                flex-direction: column;
                justify-content: flex-start; /* Kéo lên trên */
                align-items: center;
                height: 100%;
                width: 180px;
                flex-shrink: 0;
                margin-left: 15px;
                padding-top: 10px; /* Kéo nội dung lên trên */
            }

            .info-bar {
                flex-direction: column;
                gap: 8px;
                align-items: center;
                text-align: center;
                width: 100%;
                margin-bottom: 10px;
            }

            .ram-bar-wrapper {
                padding: 0 0 10px;
                width: 100%;
            }

            .ram-panel {
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }

            .ram-track {
                width: 100%;
            }

            .controls-bar {
                flex-direction: column;
                justify-content: flex-start; /* Kéo nút lên trên */
                gap: 16px;
                padding: 0;
                min-height: auto;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Video & Canvas - Luôn ở dưới -->
    <div class="video-wrapper">
        <video id="videoPreview" autoplay muted playsinline></video>
        <canvas id="renderCanvas"></canvas>
    </div>

    <!-- Giao diện điều khiển - LUÔN TRÊN CÙNG -->
    <div class="overlay">
        <div class="top-bar">
            <div class="top-left">
                <span class="app-brand">📹 Cam Hành Trình</span>
                <span class="rec-indicator" id="recIndicator">
                    <span class="rec-dot"></span>
                    Đang quay
                </span>
            </div>

            <div class="top-right">
                <div class="gps-panel">
                    <span class="gps-dot red" id="gpsDot"></span>
                    <span id="gpsLabel">Tìm tín hiệu</span>
                </div>
                <!-- ✅ BỎ khối tốc độ + thời gian ở đây -> chỉ vẽ vào video -->
            </div>
        </div>

        <div class="center-spacer"></div>

        <div class="bottom-stack">
            <div class="info-bar">
                <div class="info-item">📦 Đoạn: <span id="segmentCount">0</span></div>
                <div class="info-item">⏱️ <span id="totalDuration">0s</span></div>
                <div class="info-item">💾 <span id="totalSize">0 KB</span></div>
            </div>

            <div class="ram-bar-wrapper">
                <div class="ram-panel">
                    <span class="ram-label">RAM</span>
                    <div class="ram-track">
                        <div class="ram-fill green" id="ramBar" style="width:0%"></div>
                    </div>
                    <div class="ram-values">
                        <span id="usedRam">0</span>/<span id="maxRam">200</span>MB
                    </div>
                    <div class="ram-selector">
                        <label>Giới hạn</label>
                        <select id="ramLimitSelect">
                            <option value="50">50</option>
                            <option value="100">100</option>
                            <option value="200" selected>200</option>
                            <option value="300">300</option>
                            <option value="500">500</option>
                            <option value="1000">1GB</option>
                            <option value="0">∞</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- ✅ NÚT ĐƯỢC KÉO LÊN CAO HƠN -->
            <div class="controls-bar">
                <div class="ctrl-group">
                    <button class="ctrl-btn secondary" id="btnMirror" title="Lật ngang hình">↔️</button>
                </div>

                <div class="record-btn-wrap">
                    <button class="btn-record idle" id="btnRecordMain">
                        <span id="recordIcon">▶</span>
                    </button>
                </div>

                <div class="ctrl-group">
                    <button class="ctrl-btn secondary save-btn" id="btnDownload" disabled title="Lưu video">💾</button>
                </div>

                <div class="ctrl-group">
                    <button class="ctrl-btn secondary cam-switch-btn front" id="camSwitchBtn" title="Chuyển camera">📷</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toastMsg"></div>

<script>
// ============================================================
// TOAST
// ============================================================
let toastTimer = null;
function showToast(msg, duration = 2500, type = '') {
    const t = document.getElementById('toastMsg');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), duration);
}

// ============================================================
// GPS & SPEED
// ============================================================
class GPSTracker {
    constructor() {
        this.watchId = null;
        this.speed = 0;
        this.active = false;
        this.hasFix = false;
        this.onUpdate = null;
        this.lastPos = null;
        this.lastTime = null;
    }

    start() {
        if (!navigator.geolocation) {
            showToast('❌ Trình duyệt không hỗ trợ GPS', 3000, 'danger');
            return false;
        }
        this.active = true;
        this.watchId = navigator.geolocation.watchPosition(
            p => this.handlePos(p),
            e => this.handleErr(e),
            { enableHighAccuracy: true, timeout: 8000, maximumAge: 1000 }
        );
        this.updateUI('Tìm tín hiệu...', 'yellow');
        return true;
    }

    stop() {
        this.active = false;
        if (this.watchId !== null) navigator.geolocation.clearWatch(this.watchId);
        this.speed = 0;
        this.updateUI('Tắt', 'red');
    }

    handlePos(pos) {
        if (!this.active) return;
        const c = pos.coords;
        if (c.speed !== null && c.speed >= 0) {
            this.speed = Math.round(c.speed * 3.6 * 10) / 10;
        } else {
            this.speed = this.calcSpeedFromPos(c, pos.timestamp);
        }
        this.hasFix = true;
        this.updateUI('GPS', 'green');
        if (this.onUpdate) this.onUpdate(this.speed);
    }

    calcSpeedFromPos(coords, ts) {
        if (!this.lastPos) {
            this.lastPos = { lat: coords.latitude, lng: coords.longitude, ts };
            return 0;
        }
        const d = this.distHaversine(this.lastPos.lat, this.lastPos.lng, coords.latitude, coords.longitude);
        const t = (ts - this.lastPos.ts) / 1000;
        this.lastPos = { lat: coords.latitude, lng: coords.longitude, ts };
        return t > 0 && d > 1 ? Math.round((d / t) * 3.6 * 10) / 10 : 0;
    }

    distHaversine(lat1, lon1, lat2, lon2) {
        const R = 6371e3, toRad = d => d * Math.PI / 180;
        const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
        const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    handleErr(e) {
        this.hasFix = false;
        const map = {
            [e.PERMISSION_DENIED]: ['Cấp quyền vị trí', 'red'],
            [e.POSITION_UNAVAILABLE]: ['Không có tín hiệu', 'red'],
            [e.TIMEOUT]: ['Mất tín hiệu', 'yellow']
        };
        const [text, color] = map[e.code] || ['Lỗi GPS', 'red'];
        this.updateUI(text, color);
    }

    updateUI(text, color) {
        const dot = document.getElementById('gpsDot');
        dot.className = 'gps-dot ' + color;
        document.getElementById('gpsLabel').textContent = text;
    }

    getSpeed() { return this.speed; }
}

// ============================================================
// VIDEO RECORDER - VẼ THÔNG TIN VÀO VIDEO CHỈ 1 CHỖ
// ============================================================
class DashCamRecorder {
    constructor(maxRamMB = 200) {
        this.maxRam = maxRamMB === 0 ? Infinity : maxRamMB * 1024 * 1024;
        this.segmentTime = 1000;
        this.buffer = [];
        this.totalSize = 0;
        this.totalDuration = 0;
        this.recorder = null;
        this.stream = null;
        this.canvasStream = null;
        this.recording = false;
        this.startAt = null;
        this.timer = null;
        this.rendering = false;
        this.facing = 'user';
        this.mirrored = false;
        this.firstChunk = null;
        this.hasHeader = false;
        this.canvas = document.getElementById('renderCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.video = document.getElementById('videoPreview');
        this.gps = new GPSTracker();
        this.gps.onUpdate = () => {}; // Không cập nhật UI nữa, chỉ vẽ vào canvas
        this.videoW = 1280; this.videoH = 720;
        this.onStateChange = null;
    }

    setMaxRamMB(mb) {
        this.maxRam = mb === 0 ? Infinity : mb * 1024 * 1024;
        this.enforceLimits();
        this.notifyChange();
    }

    async initCamera(facing = 'user') {
        const cons = { video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: true };
        this.stream = await navigator.mediaDevices.getUserMedia(cons);
        this.facing = facing;
        this.video.srcObject = this.stream;
        await this.video.play();
        const s = this.stream.getVideoTracks()[0].getSettings();
        this.videoW = s.width || 1280; this.videoH = s.height || 720;
        this.canvas.width = this.videoW; this.canvas.height = this.videoH;
        return true;
    }

    async switchCamera(facing) {
        if (facing === this.facing) {
            showToast('Đang dùng camera này', 1500);
            return;
        }
        const wasRecording = this.recording;
        if (this.recording) this.stopRecording();
        this.stream?.getTracks().forEach(t => t.stop());
        await this.initCamera(facing);
        if (wasRecording) await this.startRecording();
        this.updateCamButton();
        showToast(`Đã chuyển sang camera ${facing === 'user' ? 'trước' : 'sau'}`, 1500);
    }

    updateCamButton() {
        const btn = document.getElementById('camSwitchBtn');
        if (this.facing === 'user') {
            btn.textContent = '📷';
            btn.classList.remove('back');
            btn.classList.add('front');
        } else {
            btn.textContent = '🔄';
            btn.classList.remove('front');
            btn.classList.add('back');
        }
    }

    async startRecording() {
        if (this.recording) return;
        if (!this.stream) await this.initCamera(this.facing);
        this.buffer = []; this.totalSize = 0; this.totalDuration = 0;
        this.firstChunk = null; this.hasHeader = false;
        this.canvasStream = this.canvas.captureStream(30);
        const aTracks = this.stream.getAudioTracks();
        if (aTracks[0]) this.canvasStream.addTrack(aTracks[0]);
        this.recorder = new MediaRecorder(this.canvasStream, { mimeType: 'video/webm;codecs=vp8,opus' });
        this.recorder.ondataavailable = e => this.handleChunk(e);
        this.recorder.start(this.segmentTime);
        this.recording = true;
        this.startAt = Date.now();
        this.gps.start();
        this.startRender();
        this.timer = setInterval(() => { this.enforceLimits(); this.notifyChange(); }, 2000);
        this.notifyChange();
        showToast('🔴 Bắt đầu quay', 2000, 'success');
    }

    stopRecording() {
        if (!this.recording) return;
        this.recorder.stop();
        this.recording = false;
        clearInterval(this.timer);
        this.gps.stop();
        this.stopRender();
        this.notifyChange();
        showToast('⏹ Đã dừng quay', 2000);
    }

    handleChunk(e) {
        if (!e.data.size) return;
        if (!this.hasHeader) { this.firstChunk = e.data; this.hasHeader = true; }
        this.buffer.push(e.data);
        this.totalSize += e.data.size;
        this.totalDuration += this.segmentTime;
        this.enforceLimits();
        this.notifyChange();
    }

    enforceLimits() {
        while (this.buffer.length > 1 && this.totalSize > this.maxRam) {
            const removed = this.buffer.shift();
            this.totalSize -= removed.size;
            this.totalDuration -= this.segmentTime;
            if (removed === this.firstChunk && this.buffer.length) {
                this.buffer.unshift(removed);
                this.totalSize += removed.size;
                this.totalDuration += this.segmentTime;
                break;
            }
        }
    }

    startRender() {
        if (this.rendering) return;
        this.rendering = true;
        const draw = () => {
            if (!this.rendering) return;
            const cw = this.canvas.width;
            const ch = this.canvas.height;
            this.ctx.clearRect(0, 0, cw, ch);

            // Vẽ video
            const vw = this.video.videoWidth, vh = this.video.videoHeight;
            const vRatio = vw / vh, cRatio = cw / ch;
            let dw, dh, ox, oy;
            if (vRatio > cRatio) { dh = ch; dw = dh * vRatio; ox = (cw - dw) / 2; oy = 0; }
            else { dw = cw; dh = dw / vRatio; ox = 0; oy = (ch - dh) / 2; }

            if (this.mirrored) {
                this.ctx.save();
                this.ctx.translate(cw / 2, 0);
                this.ctx.scale(-1, 1);
                this.ctx.drawImage(this.video, -dw / 2, oy, dw, dh);
                this.ctx.restore();
            } else {
                this.ctx.drawImage(this.video, ox, oy, dw, dh);
            }

            // =================================================
            // ✅ VẼ THỜI GIAN + TỐC ĐỘ CHỈ Ở ĐÂY - TRONG VIDEO
            // =================================================
            const now = new Date();
            const dateStr = now.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            const speed = this.gps.getSpeed();
            const speedStr = speed.toFixed(1);

            // Luôn vẽ ở góc trên bên trái
            const margin = Math.max(20, cw * 0.03);
            const boxW = Math.min(260, cw * 0.28);
            const boxH = Math.min(110, ch * 0.15);
            const boxX = margin;
            const boxY = margin;
            const radius = 14;

            // Nền bán trong suốt
            this.ctx.save();
            this.ctx.shadowColor = 'rgba(0,0,0,0.4)';
            this.ctx.shadowBlur = 12;
            this.ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            this.ctx.beginPath();
            this.ctx.moveTo(boxX + radius, boxY);
            this.ctx.lineTo(boxX + boxW - radius, boxY);
            this.ctx.quadraticCurveTo(boxX + boxW, boxY, boxX + boxW, boxY + radius);
            this.ctx.lineTo(boxX + boxW, boxY + boxH - radius);
            this.ctx.quadraticCurveTo(boxX + boxW, boxY + boxH, boxX + boxW - radius, boxY + boxH);
            this.ctx.lineTo(boxX + radius, boxY + boxH);
            this.ctx.quadraticCurveTo(boxX, boxY + boxH, boxX, boxY + boxH - radius);
            this.ctx.lineTo(boxX, boxY + radius);
            this.ctx.quadraticCurveTo(boxX, boxY, boxX + radius, boxY);
            this.ctx.closePath();
            this.ctx.fill();
            this.ctx.shadowBlur = 0;
            this.ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            this.ctx.lineWidth = 1;
            this.ctx.stroke();

            // Ngày giờ
            this.ctx.fillStyle = 'rgba(255,255,255,0.95)';
            this.ctx.font = `bold ${Math.max(16, cw / 55)}px -apple-system, sans-serif`;
            this.ctx.textAlign = 'left';
            this.ctx.fillText(dateStr, boxX + margin, boxY + margin + 8);

            this.ctx.font = `bold ${Math.max(22, cw / 42)}px -apple-system, sans-serif`;
            this.ctx.fillText(timeStr, boxX + margin, boxY + margin + 38);

            // Tốc độ - đổi màu theo mức
            const speedColor = speed >= 50 ? '#ff3b30' : speed >= 30 ? '#ff9500' : '#34c759';
            this.ctx.fillStyle = speedColor;
            this.ctx.font = `bold ${Math.max(28, cw / 32)}px -apple-system, sans-serif`;
            this.ctx.fillText(`🚀 ${speedStr} km/h`, boxX + margin, boxY + margin + 75);

            this.ctx.restore();

            requestAnimationFrame(draw);
        };
        draw();
    }

    stopRender() { this.rendering = false; }

    toggleMirror() {
        this.mirrored = !this.mirrored;
        showToast(this.mirrored ? '🔄 Bật gương hình' : '🔄 Tắt gương hình', 1500);
    }

    saveVideo() {
        if (!this.buffer.length) return showToast('Chưa có video để lưu', 2000, 'warning');
        const chunks = this.buffer[0] !== this.firstChunk ? [this.firstChunk, ...this.buffer] : this.buffer;
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const d = new Date();
        a.download = `cam-hanh-trinh-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}.webm`;
        a.href = url; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
        showToast(`✅ Đã lưu: ${(blob.size / 1048576).toFixed(1)} MB`, 2500, 'success');
    }

    formatSize(b) {
        if (b < 1024) return b + ' B';
        if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
        return (b / 1048576).toFixed(1) + ' MB';
    }

    notifyChange() {
        if (this.onStateChange) this.onStateChange();
    }
}

// ============================================================
// KHỞI TẠO & KẾT NỐI UI
// ============================================================
const recorder = new DashCamRecorder(200);

function syncUI() {
    const isRec = recorder.recording;
    const hasData = recorder.buffer.length > 0;

    const btn = document.getElementById('btnRecordMain');
    const icon = document.getElementById('recordIcon');
    btn.className = 'btn-record ' + (isRec ? 'recording' : 'idle');
    icon.textContent = isRec ? '⏹' : '▶';
    document.getElementById('recIndicator').classList.toggle('show', isRec);

    document.getElementById('segmentCount').textContent = recorder.buffer.length;
    document.getElementById('totalDuration').textContent = (recorder.totalDuration / 1000).toFixed(1) + 's';
    document.getElementById('totalSize').textContent = recorder.formatSize(recorder.totalSize);

    const maxMB = recorder.maxRam === Infinity ? 0 : Math.round(recorder.maxRam / 1048576);
    const usedMB = Math.round(recorder.totalSize / 1048576);
    const percent = recorder.maxRam === Infinity ? 0 : Math.min((recorder.totalSize / recorder.maxRam) * 100, 100);
    document.getElementById('ramBar').style.width = percent + '%';
    document.getElementById('ramBar').className = 'ram-fill ' + (percent >= 95 ? 'red' : percent >= 80 ? 'yellow' : 'green');
    document.getElementById('usedRam').textContent = usedMB;
    document.getElementById('maxRam').textContent = maxMB || '∞';

    document.getElementById('btnDownload').disabled = !hasData;
}

recorder.onStateChange = syncUI;

// Nút bấm
document.getElementById('btnRecordMain').addEventListener('click', () => {
    recorder.recording ? recorder.stopRecording() : recorder.startRecording();
});
document.getElementById('btnDownload').addEventListener('click', () => recorder.saveVideo());
document.getElementById('btnMirror').addEventListener('click', () => recorder.toggleMirror());
document.getElementById('camSwitchBtn').addEventListener('click', async () => {
    const newFacing = recorder.facing === 'user' ? 'environment' : 'user';
    await recorder.switchCamera(newFacing);
});
document.getElementById('ramLimitSelect').addEventListener('change', e => {
    recorder.setMaxRamMB(parseInt(e.target.value));
    syncUI();
});

// Khởi tạo
recorder.initCamera('user').then(() => {
    recorder.updateCamButton();
    syncUI();
});

window.addEventListener('beforeunload', () => recorder.stopRecording());
</script>

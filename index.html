<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Camera Hành Trình</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-dark: #000;
            --panel-bg: rgba(15, 15, 20, 0.9);
            --panel-border: rgba(255, 255, 255, 0.12);
            --text-primary: #fff;
            --text-secondary: rgba(255, 255, 255, 0.75);
            --text-muted: rgba(255, 255, 255, 0.45);
            --accent-red: #ff3b30;
            --accent-green: #34c759;
            --accent-yellow: #ff9500;
            --accent-blue: #007aff;
            --accent-orange: #ff6b35;

            --control-h: 100px;
            --control-w-landscape: 140px;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            overflow: hidden;
        }

        .app {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* === Vùng Video === */
        .video-wrap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100vh - var(--control-h));
            background: #000;
            overflow: hidden;
        }

        #videoPreview {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        #renderCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        /* === Thông tin trên video === */
        .hud {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
            pointer-events: none;
        }

        .gps-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-secondary);
            backdrop-filter: blur(10px);
        }

        .gps-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .gps-dot.green { background: var(--accent-green); }
        .gps-dot.yellow { background: var(--accent-yellow); }
        .gps-dot.red { background: var(--accent-red); }

        /* === Thanh Điều Khiển === */
        .control-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--control-h);
            background: var(--panel-bg);
            border-top: 1px solid var(--panel-border);
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 5;
        }

        .btn-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.08);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.2s;
            border: 1px solid var(--panel-border);
        }
        .btn:active { transform: scale(0.92); background: rgba(255,255,255,0.15); }

        .btn-mirror { color: var(--text-secondary); }
        .btn-cam { color: var(--accent-blue); }

        /* === Thông báo === */
        .toast {
            position: fixed;
            bottom: calc(var(--control-h) + 16px);
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: var(--panel-bg);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            backdrop-filter: blur(15px);
            border: 1px solid var(--panel-border);
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            z-index: 100;
            max-width: 90vw;
            text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* === Màn hình NGANG === */
        @media (orientation: landscape) {
            .video-wrap {
                width: calc(100vw - var(--control-w-landscape));
                height: 100vh;
            }

            .control-bar {
                width: var(--control-w-landscape);
                height: 100vh;
                left: auto;
                right: 0;
                bottom: 0;
                flex-direction: column;
                justify-content: center;
                gap: 32px;
                padding: 20px 16px;
            }

            .btn-row {
                flex-direction: column;
                gap: 24px;
            }

            .toast {
                bottom: 20px;
                right: calc(var(--control-w-landscape) + 20px);
                left: auto;
                transform: translateY(10px);
            }
            .toast.show { transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="app">
    <!-- Vùng Video -->
    <div class="video-wrap">
        <video id="videoPreview" autoplay muted playsinline></video>
        <canvas id="renderCanvas"></canvas>

        <!-- Thông tin GPS trên video -->
        <div class="hud">
            <div class="gps-badge">
                <span class="gps-dot red" id="gpsDot"></span>
                <span id="gpsLabel">Tìm tín hiệu</span>
            </div>
        </div>
    </div>

    <!-- Thanh Điều Khiển -->
    <div class="control-bar">
        <div class="btn-row">
            <button class="btn btn-mirror" id="btnMirror" title="Lật ngang hình">↔️</button>
            <button class="btn btn-cam" id="btnCam" title="Chuyển camera">📷</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
let toastTimer = null;
function showToast(msg, dur = 2000) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), dur);
}

class GPSTracker {
    constructor() {
        this.watchId = null;
        this.speed = 0;
        this.active = false;
        this.lastPos = null;
    }

    start() {
        if (!navigator.geolocation) {
            showToast('❌ Trình duyệt không hỗ trợ GPS');
            return false;
        }
        this.active = true;
        this.watchId = navigator.geolocation.watchPosition(
            p => this.handle(p),
            e => this.err(e),
            { enableHighAccuracy: true, timeout: 8000, maximumAge: 1000 }
        );
        this.updUI('Tìm tín hiệu...', 'yellow');
        return true;
    }

    stop() {
        this.active = false;
        if (this.watchId) navigator.geolocation.clearWatch(this.watchId);
        this.speed = 0;
        this.updUI('Tắt', 'red');
    }

    handle(pos) {
        if (!this.active) return;
        const c = pos.coords;
        if (c.speed !== null && c.speed >= 0) {
            this.speed = Math.round(c.speed * 3.6 * 10) / 10;
        } else {
            this.speed = this.calcSpeed(c, pos.timestamp);
        }
        this.updUI('GPS', 'green');
    }

    calcSpeed(coords, ts) {
        if (!this.lastPos) {
            this.lastPos = { lat: coords.latitude, lng: coords.longitude, ts };
            return 0;
        }
        const d = this.dist(this.lastPos.lat, this.lastPos.lng, coords.latitude, coords.longitude);
        const t = (ts - this.lastPos.ts) / 1000;
        this.lastPos = { lat: coords.latitude, lng: coords.longitude, ts };
        return t > 0 && d > 1 ? Math.round((d / t) * 3.6 * 10) / 10 : 0;
    }

    dist(lat1, lon1, lat2, lon2) {
        const R = 6371e3, r = Math.PI / 180;
        const dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
        const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLon / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    err(e) {
        const m = {
            1: ['Cấp quyền vị trí', 'red'],
            2: ['Không có tín hiệu', 'red'],
            3: ['Mất tín hiệu', 'yellow']
        }[e.code] || ['Lỗi GPS', 'red'];
        this.updUI(m[0], m[1]);
    }

    updUI(txt, color) {
        document.getElementById('gpsDot').className = 'gps-dot ' + color;
        document.getElementById('gpsLabel').textContent = txt;
    }

    getSpeed() { return this.speed; }
}

class CameraView {
    constructor() {
        this.stream = null;
        this.canvas = document.getElementById('renderCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.video = document.getElementById('videoPreview');
        this.gps = new GPSTracker();
        this.facing = 'user';
        this.mirror = false;
        this.rendering = false;
        this.w = 1280; this.h = 720;
    }

    async initCam(facing = 'user') {
        const cons = {
            video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
        };
        this.stream = await navigator.mediaDevices.getUserMedia(cons);
        this.facing = facing;
        this.video.srcObject = this.stream;
        await this.video.play();
        const s = this.stream.getVideoTracks()[0].getSettings();
        this.w = s.width || 1280; this.h = s.height || 720;
        this.canvas.width = this.w; this.canvas.height = this.h;
        this.startDraw();
        this.gps.start();
    }

    async switchCam() {
        const newFacing = this.facing === 'user' ? 'environment' : 'user';
        this.stream?.getTracks().forEach(t => t.stop());
        await this.initCam(newFacing);
        showToast(`Đã chuyển camera ${newFacing === 'user' ? 'trước' : 'sau'}`);
    }

    toggleMirror() {
        this.mirror = !this.mirror;
        showToast(this.mirror ? '🔄 Bật gương hình' : '🔄 Tắt gương hình');
    }

    startDraw() {
        if (this.rendering) return;
        this.rendering = true;
        const draw = () => {
            if (!this.rendering) return;
            const cw = this.canvas.width, ch = this.canvas.height;
            this.ctx.clearRect(0, 0, cw, ch);

            const vw = this.video.videoWidth, vh = this.video.videoHeight;
            const r = vw / vh, cr = cw / ch;
            let dw, dh, x, y;
            if (r > cr) { dh = ch; dw = dh * r; x = (cw - dw) / 2; y = 0; }
            else { dw = cw; dh = dw / r; x = 0; y = (ch - dh) / 2; }

            if (this.mirror) {
                this.ctx.save();
                this.ctx.translate(cw / 2, 0);
                this.ctx.scale(-1, 1);
                this.ctx.drawImage(this.video, -dw / 2, y, dw, dh);
                this.ctx.restore();
            } else {
                this.ctx.drawImage(this.video, x, y, dw, dh);
            }

            // Vẽ thông tin: ngày, giờ, tốc độ
            const now = new Date();
            const date = now.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
            const time = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            const spd = this.gps.getSpeed();
            const spdTxt = spd.toFixed(1) + ' km/h';

            const fsDate = Math.max(cw * 0.022, 12);
            const fsTime = Math.max(cw * 0.035, 18);
            const fsSpd = Math.max(cw * 0.038, 20);
            const padX = Math.max(cw * 0.022, 10);
            const padY = Math.max(ch * 0.018, 7);
            const margin = Math.max(cw * 0.018, 10);
            const radius = Math.max(cw * 0.01, 6);
            const lineGap = fsTime * 0.3;

            this.ctx.font = `bold ${fsDate}px -apple-system, sans-serif`;
            const wDate = this.ctx.measureText(date).width;
            this.ctx.font = `bold ${fsTime}px -apple-system, sans-serif`;
            const wTime = this.ctx.measureText(time).width;
            this.ctx.font = `bold ${fsSpd}px -apple-system, sans-serif`;
            const wSpd = this.ctx.measureText(spdTxt).width;

            const boxW = Math.max(wDate, wTime, wSpd) + padX * 2;
            const boxH = padY * 2 + fsDate + fsTime + fsSpd + lineGap * 2;
            const bx = margin, by = margin;

            this.ctx.save();
            this.ctx.fillStyle = 'rgba(0,0,0,0.35)';
            this.ctx.beginPath();
            this.ctx.moveTo(bx + radius, by);
            this.ctx.lineTo(bx + boxW - radius, by);
            this.ctx.quadraticCurveTo(bx + boxW, by, bx + boxW, by + radius);
            this.ctx.lineTo(bx + boxW, by + boxH - radius);
            this.ctx.quadraticCurveTo(bx + boxW, by + boxH, bx + boxW - radius, by + boxH);
            this.ctx.lineTo(bx + radius, by + boxH);
            this.ctx.quadraticCurveTo(bx, by + boxH, bx, by + boxH - radius);
            this.ctx.lineTo(bx, by + radius);
            this.ctx.quadraticCurveTo(bx, by, bx + radius, by);
            this.ctx.closePath();
            this.ctx.fill();
            this.ctx.restore();

            const tx = bx + padX;
            let ty = by + padY + fsDate * 0.8;

            this.ctx.fillStyle = 'rgba(255,255,255,0.95)';
            this.ctx.font = `bold ${fsDate}px -apple-system, sans-serif`;
            this.ctx.fillText(date, tx, ty);
            ty += fsDate + lineGap;

            this.ctx.font = `bold ${fsTime}px -apple-system, sans-serif`;
            this.ctx.fillText(time, tx, ty);
            ty += fsTime + lineGap;

            this.ctx.fillStyle = spd >= 50 ? '#ff3b30' : spd >= 30 ? '#ff9500' : '#34c759';
            this.ctx.font = `bold ${fsSpd}px -apple-system, sans-serif`;
            this.ctx.fillText(spdTxt, tx, ty);

            requestAnimationFrame(draw);
        };
        draw();
    }
}

const cam = new CameraView();

document.getElementById('btnMirror').addEventListener('click', () => cam.toggleMirror());
document.getElementById('btnCam').addEventListener('click', () => cam.switchCam());

cam.initCam('user');

window.addEventListener('beforeunload', () => cam.gps.stop());
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Camera Hành Trình</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 860px;
            background: #000;
            overflow: hidden;
        }

        /* ===== VIDEO ===== */
        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1;
        }

        #videoPreview {
            width: 100%;
            height: 100%;
            display: none;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
            object-fit: cover;
        }

        /* ===== OVERLAY ===== */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 14px 16px 18px;
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .top-bar .left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-bar .app-title {
            color: rgba(255, 255, 255, 0.2);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
        }

        .top-bar .rec-badge {
            display: none;
            align-items: center;
            gap: 6px;
            padding: 3px 12px 3px 8px;
            background: rgba(255, 59, 48, 0.2);
            border: 1px solid rgba(255, 59, 48, 0.3);
            border-radius: 30px;
            font-size: 9px;
            color: #ff3b30;
            font-weight: 600;
            text-transform: uppercase;
        }

        .top-bar .rec-badge.show {
            display: flex;
        }

        .top-bar .rec-badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ff3b30;
            animation: pulse-dot 1s infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }

        .top-bar .gps-status {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px 3px 8px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            pointer-events: auto;
        }

        .top-bar .gps-status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        .top-bar .gps-status .dot.green {
            background: #4caf50;
            animation: pulse-gps 1.5s infinite;
        }
        .top-bar .gps-status .dot.yellow {
            background: #ff9800;
            animation: pulse-gps 1.5s infinite;
        }
        .top-bar .gps-status .dot.red {
            background: #f44336;
        }

        @keyframes pulse-gps {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .top-bar .gps-status .gps-label {
            font-size: 8px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 500;
        }

        /* ===== CENTER ===== */
        .center-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* ===== TIME DISPLAY ===== */
        .time-display {
            font-family: 'Courier New', monospace;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.06);
            font-size: 64px;
            letter-spacing: 4px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
            transition: color 0.3s;
        }

        .time-display.active {
            color: rgba(255, 255, 255, 0.15);
        }

        /* ===== BOTTOM CONTROLS ===== */
        .bottom-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        /* ===== ACTION ROW ===== */
        .action-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            pointer-events: auto;
        }

        /* Nút RECORD chính */
        .btn-record {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            backdrop-filter: blur(8px);
            position: relative;
        }

        .btn-record::after {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .btn-record:active {
            transform: scale(0.92);
        }

        .btn-record.idle {
            border-color: rgba(76, 175, 80, 0.3);
        }

        .btn-record.idle:hover {
            background: rgba(76, 175, 80, 0.1);
            border-color: rgba(76, 175, 80, 0.5);
        }

        .btn-record.idle::after {
            border-color: rgba(76, 175, 80, 0.1);
        }

        .btn-record.recording {
            border-color: rgba(255, 59, 48, 0.4);
            background: rgba(255, 59, 48, 0.1);
        }

        .btn-record.recording::after {
            border-color: rgba(255, 59, 48, 0.2);
            animation: ring-pulse 1.5s infinite;
        }

        .btn-record.recording:hover {
            background: rgba(255, 59, 48, 0.2);
        }

        @keyframes ring-pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(1.4);
                opacity: 0;
            }
        }

        .btn-record .icon {
            transition: all 0.3s;
        }

        /* Nút chức năng */
        .func-btn {
            padding: 10px 14px;
            border: none;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 5px;
            backdrop-filter: blur(8px);
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.03);
            min-width: 52px;
            justify-content: center;
        }

        .func-btn:active {
            transform: scale(0.95);
        }

        .func-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.07);
            color: rgba(255, 255, 255, 0.7);
        }

        .func-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        .func-btn.save {
            background: rgba(255, 107, 53, 0.1);
            color: #ff6b35;
            border-color: rgba(255, 107, 53, 0.08);
        }

        .func-btn.save:hover:not(:disabled) {
            background: rgba(255, 107, 53, 0.2);
        }

        .func-btn.save:disabled {
            opacity: 0.2;
        }

        .func-btn.cam {
            font-size: 10px;
            padding: 10px 12px;
            min-width: 44px;
        }

        .func-btn.cam.active {
            background: rgba(100, 181, 246, 0.12);
            color: #64b5f6;
            border-color: rgba(100, 181, 246, 0.1);
        }

        .func-btn.flip {
            font-size: 11px;
            min-width: 44px;
        }

        /* ===== INFO ROW ===== */
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 12px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            pointer-events: none;
        }

        .info-row .item {
            display: flex;
            align-items: center;
            gap: 4px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 9px;
            font-weight: 500;
        }

        .info-row .item .val {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
            font-size: 10px;
        }

        .info-row .item .val.highlight {
            color: #ff6b35;
        }

        /* ===== RAM ROW ===== */
        .ram-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 2px;
            pointer-events: none;
        }

        .ram-row .label {
            color: rgba(255, 255, 255, 0.08);
            font-size: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .ram-row .track {
            flex: 1;
            height: 3px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            overflow: hidden;
        }

        .ram-row .track .fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.4s ease, background 0.4s ease;
            width: 0%;
        }

        .ram-row .track .fill.green {
            background: linear-gradient(90deg, #4caf50, #8bc34a);
        }

        .ram-row .track .fill.yellow {
            background: linear-gradient(90deg, #ffeb3b, #ff9800);
        }

        .ram-row .track .fill.red {
            background: linear-gradient(90deg, #ff5722, #f44336);
            animation: blink-ram 0.8s infinite;
        }

        @keyframes blink-ram {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .ram-row .info {
            color: rgba(255, 255, 255, 0.08);
            font-size: 8px;
            white-space: nowrap;
        }

        .ram-row .info .num {
            color: rgba(255, 255, 255, 0.2);
        }

        /* ===== RAM SETTINGS ===== */
        .ram-settings {
            display: flex;
            align-items: center;
            gap: 4px;
            pointer-events: auto;
        }

        .ram-settings select {
            padding: 1px 8px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.15);
            font-size: 8px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            transition: border-color 0.3s;
        }

        .ram-settings select:hover {
            border-color: rgba(255, 255, 255, 0.06);
        }

        .ram-settings select:focus {
            border-color: rgba(100, 181, 246, 0.15);
        }

        .ram-settings select option {
            background: #1a1a2e;
            color: #fff;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 500;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            z-index: 999;
            max-width: 90%;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.warning {
            background: rgba(255, 87, 34, 0.85);
        }

        .toast.danger {
            background: rgba(244, 67, 54, 0.9);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .overlay {
                padding: 10px 12px 14px;
            }

            .btn-record {
                width: 60px;
                height: 60px;
                font-size: 22px;
            }

            .func-btn {
                padding: 8px 10px;
                font-size: 10px;
                min-width: 40px;
            }

            .func-btn.cam {
                padding: 8px 8px;
                font-size: 9px;
                min-width: 36px;
            }

            .func-btn.flip {
                min-width: 36px;
                font-size: 10px;
            }

            .time-display {
                font-size: 48px;
            }

            .info-row {
                padding: 3px 8px;
            }

            .info-row .item {
                font-size: 8px;
            }

            .info-row .item .val {
                font-size: 9px;
            }
        }

        @media (max-width: 380px) {
            .btn-record {
                width: 50px;
                height: 50px;
                font-size: 18px;
            }

            .func-btn {
                padding: 6px 6px;
                font-size: 9px;
                min-width: 32px;
            }

            .func-btn.cam {
                padding: 6px 4px;
                font-size: 8px;
                min-width: 28px;
            }

            .action-row {
                gap: 6px;
            }

            .time-display {
                font-size: 36px;
            }

            .info-row .item {
                font-size: 7px;
            }

            .info-row .item .val {
                font-size: 8px;
            }
        }

        @media (max-height: 700px) {
            .overlay {
                padding: 8px 10px 10px;
            }

            .btn-record {
                width: 48px;
                height: 48px;
                font-size: 16px;
            }

            .func-btn {
                padding: 5px 8px;
                font-size: 9px;
            }

            .func-btn.cam {
                padding: 5px 6px;
                font-size: 8px;
            }

            .time-display {
                font-size: 32px;
            }

            .info-row {
                padding: 2px 6px;
            }

            .bottom-area {
                gap: 6px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- VIDEO -->
        <div class="video-wrapper">
            <video id="videoPreview" autoplay muted playsinline></video>
            <canvas id="renderCanvas"></canvas>
        </div>

        <!-- OVERLAY -->
        <div class="overlay">

            <!-- TOP BAR -->
            <div class="top-bar">
                <div class="left">
                    <span class="app-title">📹 Camera</span>
                    <span class="rec-badge" id="recBadge">
                        <span class="dot"></span>
                        REC
                    </span>
                </div>
                <div class="gps-status" id="gpsStatus">
                    <span class="dot red" id="gpsDot"></span>
                    <span class="gps-label" id="gpsText">GPS</span>
                </div>
            </div>

            <!-- CENTER -->
            <div class="center-area">
                <div class="time-display" id="timeDisplay">00:00</div>
            </div>

            <!-- BOTTOM -->
            <div class="bottom-area">

                <!-- ACTION ROW -->
                <div class="action-row">
                    <button class="func-btn flip" id="btnFlipMirror">↔</button>

                    <button class="btn-record idle" id="btnRecord">
                        <span class="icon" id="recordIcon">▶</span>
                    </button>

                    <button class="func-btn save" id="btnSave" disabled>💾</button>

                    <button class="func-btn cam active" id="camFront" data-facing="user">📷</button>
                    <button class="func-btn cam" id="camBack" data-facing="environment">⟳</button>
                </div>

                <!-- INFO ROW -->
                <div class="info-row">
                    <span class="item">📦 <span class="val" id="segmentCount">0</span></span>
                    <span class="item">⏱️ <span class="val" id="totalDuration">0s</span></span>
                    <span class="item">📊 <span class="val" id="totalSize">0 KB</span></span>
                    <span class="item">🔴 <span class="val" id="statusText">Sẵn sàng</span></span>
                </div>

                <!-- RAM ROW -->
                <div class="ram-row">
                    <span class="label">RAM</span>
                    <div class="track">
                        <div class="fill green" id="ramBar" style="width:0%"></div>
                    </div>
                    <span class="info">
                        <span class="num" id="usedRamText">0</span>/<span class="num" id="maxRamText">200</span>MB
                        <span id="ramStatus" style="margin-left:4px;color:#4caf50;">✓</span>
                    </span>
                    <div class="ram-settings">
                        <select id="ramSelect">
                            <option value="50">50</option>
                            <option value="100">100</option>
                            <option value="200" selected>200</option>
                            <option value="300">300</option>
                            <option value="500">500</option>
                            <option value="1000">1GB</option>
                            <option value="0">∞</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        // TOAST
        // ============================================================
        let toastTimeout = null;

        function showToast(message, duration = 2500, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        // ============================================================
        // GPS TRACKER
        // ============================================================
        class GPSTracker {
            constructor() {
                this.watchId = null;
                this.currentSpeed = 0;
                this.isActive = false;
                this.hasFix = false;
                this.lastPosition = null;
                this.lastTime = null;

                this.statusDot = document.getElementById('gpsDot');
                this.statusText = document.getElementById('gpsText');

                this.onUpdate = null;
            }

            start() {
                if (!navigator.geolocation) {
                    this.statusText.textContent = '❌';
                    this.statusDot.className = 'dot red';
                    showToast('❌ Trình duyệt không hỗ trợ GPS', 3000, 'danger');
                    return false;
                }

                this.isActive = true;

                this.watchId = navigator.geolocation.watchPosition(
                    (position) => this.onPositionUpdate(position),
                    (error) => this.onError(error), {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 1000,
                    }
                );

                this.statusText.textContent = 'Tìm...';
                this.statusDot.className = 'dot yellow';
                return true;
            }

            stop() {
                this.isActive = false;
                if (this.watchId !== null) {
                    navigator.geolocation.clearWatch(this.watchId);
                    this.watchId = null;
                }
                this.statusText.textContent = 'Dừng';
                this.statusDot.className = 'dot red';
                this.currentSpeed = 0;
            }

            onPositionUpdate(position) {
                if (!this.isActive) return;

                const coords = position.coords;
                const speed = coords.speed;

                if (speed !== null && speed !== undefined && speed >= 0) {
                    this.currentSpeed = speed * 3.6;
                } else {
                    const lat = coords.latitude;
                    const lng = coords.longitude;
                    const timestamp = position.timestamp;

                    if (this.lastPosition) {
                        const distance = this.calculateDistance(
                            this.lastPosition.lat, this.lastPosition.lng,
                            lat, lng
                        );
                        const timeDiff = (timestamp - this.lastTime) / 1000;

                        if (timeDiff > 0 && distance > 1) {
                            const speedMs = distance / timeDiff;
                            this.currentSpeed = speedMs * 3.6;
                        }
                    }

                    this.lastPosition = { lat, lng };
                    this.lastTime = timestamp;
                }

                this.currentSpeed = Math.round(this.currentSpeed * 10) / 10;

                this.hasFix = true;
                this.statusDot.className = 'dot green';
                this.statusText.textContent = 'GPS';

                if (this.onUpdate) this.onUpdate(this.currentSpeed);
            }

            onError(error) {
                console.warn('GPS Error:', error);
                this.hasFix = false;
                this.statusDot.className = 'dot red';

                switch (error.code) {
                    case error.PERMISSION_DENIED:
                        this.statusText.textContent = '⚠️';
                        showToast('⚠️ Vui lòng cấp quyền truy cập vị trí', 3000, 'warning');
                        break;
                    case error.POSITION_UNAVAILABLE:
                        this.statusText.textContent = '📡';
                        break;
                    case error.TIMEOUT:
                        this.statusText.textContent = '⏰';
                        break;
                    default:
                        this.statusText.textContent = '❌';
                }
            }

            calculateDistance(lat1, lon1, lat2, lon2) {
                const R = 6371000;
                const dLat = this.toRad(lat2 - lat1);
                const dLon = this.toRad(lon2 - lon1);
                const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(this.toRad(lat1)) * Math.cos(this.toRad(lat2)) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                return R * c;
            }

            toRad(deg) {
                return deg * Math.PI / 180;
            }

            getSpeed() {
                return this.currentSpeed;
            }

            hasFix() {
                return this.hasFix;
            }
        }

        // ============================================================
        // VIDEO RECORDER WITH OVERLAY
        // ============================================================
        class VideoRecorderWithOverlay {
            constructor(maxDurationMs = 15 * 60 * 1000, maxRamMB = 200) {
                this.maxDurationMs = maxDurationMs;
                this.maxRamBytes = maxRamMB * 1024 * 1024;
                this.segmentDurationMs = 1000;

                this.buffer = [];
                this.totalSize = 0;
                this.totalDuration = 0;

                this.recorder = null;
                this.stream = null;
                this.canvasStream = null;
                this.isRecording = false;
                this.startTime = null;
                this.timerInterval = null;
                this.renderLoopId = null;

                this.currentFacingMode = 'user';
                this.isMirrored = false;

                this.onUpdate = null;
                this.isRamFull = false;

                this.firstChunk = null;
                this.hasHeader = false;

                this.canvas = document.getElementById('renderCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.video = document.getElementById('videoPreview');

                this.gps = new GPSTracker();
                this.gps.onUpdate = () => {};

                this.videoWidth = 1280;
                this.videoHeight = 720;

                this.canvasReady = false;
                this.isSwitching = false;
            }

            setMaxRam(mb) {
                this.maxRamBytes = mb * 1024 * 1024;
                this.checkRamLimit();
                if (this.onUpdate) this.onUpdate();
            }

            checkRamLimit() {
                if (this.maxRamBytes === 0) {
                    this.isRamFull = false;
                    return;
                }
                const usagePercent = (this.totalSize / this.maxRamBytes) * 100;
                this.isRamFull = usagePercent >= 95;
            }

            autoAdjustRam() {
                if (this.maxRamBytes === 0 || this.buffer.length === 0) return;

                const usagePercent = (this.totalSize / this.maxRamBytes) * 100;

                if (usagePercent > 90) {
                    const removeCount = Math.max(1, Math.floor(this.buffer.length * 0.05));
                    for (let i = 0; i < removeCount && this.buffer.length > 1; i++) {
                        const oldest = this.buffer.shift();
                        if (oldest) {
                            this.totalSize -= oldest.size;
                            this.totalDuration -= this.segmentDurationMs;
                        }
                    }
                }

                if (usagePercent > 95) {
                    const removeCount = Math.max(2, Math.floor(this.buffer.length * 0.15));
                    for (let i = 0; i < removeCount && this.buffer.length > 1; i++) {
                        const oldest = this.buffer.shift();
                        if (oldest) {
                            this.totalSize -= oldest.size;
                            this.totalDuration -= this.segmentDurationMs;
                        }
                    }
                }

                this.ensureHeader();
                this.checkRamLimit();
                if (this.onUpdate) this.onUpdate();
            }

            ensureHeader() {
                if (!this.firstChunk || this.buffer.length === 0) return;
                if (this.buffer[0] !== this.firstChunk) {
                    const index = this.buffer.indexOf(this.firstChunk);
                    if (index > 0) {
                        this.buffer.splice(index, 1);
                        this.totalSize -= this.firstChunk.size;
                        this.totalDuration -= this.segmentDurationMs;
                    }
                    this.buffer.unshift(this.firstChunk);
                    this.totalSize += this.firstChunk.size;
                    this.totalDuration += this.segmentDurationMs;
                }
            }

            async getCamera(facingMode = 'user') {
                const constraints = {
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                    },
                    audio: true,
                };
                return await navigator.mediaDevices.getUserMedia(constraints);
            }

            setupCanvas() {
                const videoTrack = this.stream.getVideoTracks()[0];
                if (videoTrack) {
                    const settings = videoTrack.getSettings();
                    this.videoWidth = settings.width || 1280;
                    this.videoHeight = settings.height || 720;
                }

                this.canvas.width = this.videoWidth;
                this.canvas.height = this.videoHeight;
                this.canvas.style.width = '100%';
                this.canvas.style.height = '100%';
                this.canvas.style.objectFit = 'cover';

                this.canvasReady = true;
            }

            startRenderLoop() {
                const render = () => {
                    if (!this.isRecording) return;

                    const w = this.canvas.width;
                    const h = this.canvas.height;

                    this.ctx.clearRect(0, 0, w, h);

                    const videoAspect = this.video.videoWidth / this.video.videoHeight;
                    const canvasAspect = w / h;

                    let drawW, drawH, offsetX, offsetY;

                    if (videoAspect > canvasAspect) {
                        drawH = h;
                        drawW = h * videoAspect;
                        offsetX = (w - drawW) / 2;
                        offsetY = 0;
                    } else {
                        drawW = w;
                        drawH = w / videoAspect;
                        offsetX = 0;
                        offsetY = (h - drawH) / 2;
                    }

                    if (this.isMirrored) {
                        this.ctx.save();
                        this.ctx.translate(w / 2, 0);
                        this.ctx.scale(-1, 1);
                        this.ctx.drawImage(this.video, -drawW / 2, offsetY, drawW, drawH);
                        this.ctx.restore();
                    } else {
                        this.ctx.drawImage(this.video, offsetX, offsetY, drawW, drawH);
                    }

                    // === OVERLAY ===
                    const now = new Date();
                    const timeStr = now.toLocaleTimeString('vi-VN', {
                        hour12: false,
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });
                    const dateStr = now.toLocaleDateString('vi-VN', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric'
                    });

                    const speed = this.gps.getSpeed();
                    const speedText = speed > 0 ? `${speed.toFixed(1)} km/h` : '0 km/h';

                    const padding = 12;
                    const timeFontSize = Math.max(16, Math.min(24, w / 38));
                    const speedFontSize = timeFontSize * 1.4;
                    const lineHeight = timeFontSize + 6;

                    this.ctx.textAlign = 'left';
                    this.ctx.textBaseline = 'top';

                    this.ctx.font = `bold ${timeFontSize}px 'Courier New', monospace`;
                    const timeMetrics = this.ctx.measureText(`${dateStr} - ${timeStr}`);
                    this.ctx.font = `bold ${speedFontSize}px 'Courier New', monospace`;
                    const speedMetrics = this.ctx.measureText(`🚀 ${speedText}`);

                    const textWidth = Math.max(timeMetrics.width, speedMetrics.width) + padding * 2 + 16;
                    const totalHeight = lineHeight + speedFontSize + padding * 2 + 6;

                    const x = 12;
                    const y = 12;

                    const radius = 10;
                    this.ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
                    this.ctx.shadowBlur = 20;
                    this.ctx.shadowOffsetX = 0;
                    this.ctx.shadowOffsetY = 0;

                    this.ctx.beginPath();
                    this.ctx.moveTo(x + radius, y);
                    this.ctx.lineTo(x + textWidth - radius, y);
                    this.ctx.quadraticCurveTo(x + textWidth, y, x + textWidth, y + radius);
                    this.ctx.lineTo(x + textWidth, y + totalHeight - radius);
                    this.ctx.quadraticCurveTo(x + textWidth, y + totalHeight, x + textWidth - radius, y + totalHeight);
                    this.ctx.lineTo(x + radius, y + totalHeight);
                    this.ctx.quadraticCurveTo(x, y + totalHeight, x, y + totalHeight - radius);
                    this.ctx.lineTo(x, y + radius);
                    this.ctx.quadraticCurveTo(x, y, x + radius, y);
                    this.ctx.closePath();

                    this.ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                    this.ctx.fill();
                    this.ctx.shadowBlur = 0;

                    this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
                    this.ctx.lineWidth = 1;
                    this.ctx.stroke();

                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.font = `bold ${timeFontSize}px 'Courier New', monospace`;
                    this.ctx.fillText(`${dateStr} - ${timeStr}`, x + padding, y + 3);

                    const speedColor = speed > 50 ? '#f44336' : speed > 30 ? '#ff9800' : '#4caf50';
                    this.ctx.fillStyle = speedColor;
                    this.ctx.font = `bold ${speedFontSize}px 'Courier New', monospace`;
                    this.ctx.fillText(`🚀 ${speedText}`, x + padding, y + lineHeight + 3);

                    this.ctx.shadowColor = 'rgba(0,0,0,0.3)';
                    this.ctx.shadowBlur = 6;

                    this.renderLoopId = requestAnimationFrame(render);
                };

                render();
            }

            stopRenderLoop() {
                if (this.renderLoopId) {
                    cancelAnimationFrame(this.renderLoopId);
                    this.renderLoopId = null;
                }
            }

            async changeCameraStream(facingMode) {
                try {
                    this.isSwitching = true;
                    const wasRecording = this.isRecording;

                    if (this.stream) {
                        this.stream.getTracks().forEach(track => track.stop());
                        this.stream = null;
                    }

                    this.stream = await this.getCamera(facingMode);
                    this.currentFacingMode = facingMode;

                    this.video.srcObject = this.stream;
                    await this.video.play();

                    this.setupCanvas();

                    const newCanvasStream = this.canvas.captureStream(30);

                    const audioTracks = this.stream.getAudioTracks();
                    if (audioTracks.length > 0) {
                        newCanvasStream.addTrack(audioTracks[0]);
                    }

                    if (wasRecording && this.recorder) {
                        this.recorder.stop();

                        this.recorder = new MediaRecorder(newCanvasStream, {
                            mimeType: 'video/webm;codecs=vp8,opus',
                        });

                        this.recorder.ondataavailable = (event) => {
                            if (event.data.size === 0) return;

                            if (!this.hasHeader && this.buffer.length === 0) {
                                this.firstChunk = event.data;
                                this.hasHeader = true;
                            }

                            this.buffer.push(event.data);
                            this.totalSize += event.data.size;
                            this.totalDuration += this.segmentDurationMs;

                            while (this.totalDuration > this.maxDurationMs && this.buffer.length > 0) {
                                const oldest = this.buffer.shift();
                                if (oldest) {
                                    this.totalSize -= oldest.size;
                                    this.totalDuration -= this.segmentDurationMs;
                                }
                            }

                            if (this.buffer.length % 10 === 0) {
                                this.autoAdjustRam();
                            }

                            let loopCount = 0;
                            while (this.maxRamBytes > 0 &&
                                this.totalSize > this.maxRamBytes &&
                                this.buffer.length > 1) {
                                const oldest = this.buffer.shift();
                                if (oldest) {
                                    this.totalSize -= oldest.size;
                                    this.totalDuration -= this.segmentDurationMs;
                                }
                                loopCount++;
                                if (loopCount > 100) break;
                            }

                            this.ensureHeader();
                            this.checkRamLimit();

                            if (this.onUpdate) this.onUpdate();
                        };

                        this.recorder.start(this.segmentDurationMs);
                        this.canvasStream = newCanvasStream;
                    } else {
                        this.canvasStream = newCanvasStream;
                    }

                    this.stopRenderLoop();
                    this.startRenderLoop();

                    this.isSwitching = false;
                    if (this.onUpdate) this.onUpdate();
                    return true;
                } catch (err) {
                    console.error('Lỗi chuyển camera:', err);
                    this.isSwitching = false;
                    showToast('❌ Không thể chuyển camera!', 2000, 'danger');
                    return false;
                }
            }

            async startRecording() {
                if (this.isRecording) return;

                if (!this.stream) {
                    const ok = await this.changeCameraStream(this.currentFacingMode);
                    if (!ok) return false;
                }

                this.buffer = [];
                this.totalSize = 0;
                this.totalDuration = 0;
                this.firstChunk = null;
                this.hasHeader = false;

                this.canvasStream = this.canvas.captureStream(30);

                const audioTracks = this.stream.getAudioTracks();
                if (audioTracks.length > 0) {
                    this.canvasStream.addTrack(audioTracks[0]);
                }

                this.recorder = new MediaRecorder(this.canvasStream, {
                    mimeType: 'video/webm;codecs=vp8,opus',
                });

                this.recorder.start(this.segmentDurationMs);

                this.recorder.ondataavailable = (event) => {
                    if (event.data.size === 0) return;

                    if (!this.hasHeader) {
                        this.firstChunk = event.data;
                        this.hasHeader = true;
                    }

                    this.buffer.push(event.data);
                    this.totalSize += event.data.size;
                    this.totalDuration += this.segmentDurationMs;

                    while (this.totalDuration > this.maxDurationMs && this.buffer.length > 0) {
                        const oldest = this.buffer.shift();
                        if (oldest) {
                            this.totalSize -= oldest.size;
                            this.totalDuration -= this.segmentDurationMs;
                        }
                    }

                    if (this.buffer.length % 10 === 0) {
                        this.autoAdjustRam();
                    }

                    let loopCount = 0;
                    while (this.maxRamBytes > 0 &&
                        this.totalSize > this.maxRamBytes &&
                        this.buffer.length > 1) {
                        const oldest = this.buffer.shift();
                        if (oldest) {
                            this.totalSize -= oldest.size;
                            this.totalDuration -= this.segmentDurationMs;
                        }
                        loopCount++;
                        if (loopCount > 100) break;
                    }

                    this.ensureHeader();
                    this.checkRamLimit();

                    if (this.onUpdate) this.onUpdate();
                };

                this.isRecording = true;
                this.startTime = Date.now();

                this.gps.start();

                if (!this.renderLoopId) {
                    this.startRenderLoop();
                }

                this.timerInterval = setInterval(() => {
                    if (this.isRecording) {
                        this.autoAdjustRam();
                    }
                    if (this.onUpdate) this.onUpdate();
                }, 2000);

                if (this.onUpdate) this.onUpdate();
                return true;
            }

            stopRecording() {
                if (this.recorder && this.isRecording) {
                    this.recorder.stop();
                    this.isRecording = false;
                }

                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }

                if (this.onUpdate) this.onUpdate();
            }

            stop() {
                this.stopRecording();
                this.gps.stop();
                this.stopRenderLoop();

                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }

                if (this.onUpdate) this.onUpdate();
            }

            save() {
                if (this.buffer.length === 0) {
                    showToast('⚠️ Chưa có dữ liệu video!', 2000);
                    return null;
                }

                try {
                    let chunks = [...this.buffer];
                    if (this.firstChunk && !chunks.includes(this.firstChunk)) {
                        chunks.unshift(this.firstChunk);
                    }

                    const blob = new Blob(chunks, {
                        type: 'video/webm'
                    });

                    if (blob.size === 0) {
                        showToast('❌ File rỗng!', 2000, 'danger');
                        return null;
                    }

                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    const now = new Date();
                    const dateStr =
                        `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}h${String(now.getMinutes()).padStart(2,'0')}`;
                    const camLabel = this.currentFacingMode === 'user' ? 'truoc' : 'sau';
                    a.download = `camera_hanh_trinh_${camLabel}_${dateStr}.webm`;
                    a.href = url;
                    a.click();
                    setTimeout(() => {
                        URL.revokeObjectURL(url);
                    }, 5000);

                    const sizeMB = (blob.size / 1048576).toFixed(1);
                    showToast(`✅ Đã lưu ${sizeMB} MB`, 2500);
                    return blob;
                } catch (err) {
                    console.error('Lỗi khi tạo blob:', err);
                    showToast('❌ Lỗi tạo file video!', 3000, 'danger');
                    return null;
                }
            }

            async switchCamera(facingMode) {
                if (facingMode === this.currentFacingMode) {
                    showToast('ℹ️ Đã ở camera này rồi!', 1500);
                    return false;
                }

                if (this.isSwitching) {
                    showToast('⏳ Đang chuyển camera...', 1000);
                    return false;
                }

                try {
                    const success = await this.changeCameraStream(facingMode);

                    if (success) {
                        const label = facingMode === 'user' ? 'Trước' : 'Sau';

                        document.getElementById('camFront').classList.toggle('active', facingMode === 'user');
                        document.getElementById('camBack').classList.toggle('active', facingMode === 'environment');

                        showToast(`✅ Đã chuyển sang camera ${label}`, 1500);

                        if (this.onUpdate) this.onUpdate();
                        return true;
                    }
                    return false;
                } catch (err) {
                    console.error('Lỗi chuyển camera:', err);
                    showToast('❌ Không thể chuyển camera!', 2000, 'danger');
                    return false;
                }
            }

            toggleMirror() {
                this.isMirrored = !this.isMirrored;
                showToast(this.isMirrored ? '🔄 Đã bật gương' : '🔄 Đã tắt gương', 1500);
                if (this.onUpdate) this.onUpdate();
            }

            getSegmentCount() {
                return this.buffer.length;
            }

            getElapsedSeconds() {
                if (!this.startTime) return 0;
                return Math.floor((Date.now() - this.startTime) / 1000);
            }

            getRamUsagePercent() {
                if (this.maxRamBytes === 0) return 0;
                return Math.min((this.totalSize / this.maxRamBytes) * 100, 100);
            }

            formatTime(ms) {
                const totalSec = Math.floor(ms / 1000);
                const min = String(Math.floor(totalSec / 60)).padStart(2, '0');
                const sec = String(totalSec % 60).padStart(2, '0');
                return `${min}:${sec}`;
            }

            formatSize(bytes) {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / 1048576).toFixed(1) + ' MB';
            }

            getMaxRamMB() {
                return this.maxRamBytes / (1024 * 1024);
            }

            getGPS() {
                return this.gps;
            }
        }

        // ============================================================
        // UI CONTROLLER
        // ============================================================

        const recorder = new VideoRecorderWithOverlay(15 * 60 * 1000, 200);
        const gps = recorder.getGPS();

        const btnRecord = document.getElementById('btnRecord');
        const recordIcon = document.getElementById('recordIcon');
        const recBadge = document.getElementById('recBadge');
        const timeDisplay = document.getElementById('timeDisplay');
        const btnSave = document.getElementById('btnSave');
        const btnFlipMirror = document.getElementById('btnFlipMirror');
        const camFront = document.getElementById('camFront');
        const camBack = document.getElementById('camBack');
        const segmentCount = document.getElementById('segmentCount');
        const totalDuration = document.getElementById('totalDuration');
        const totalSize = document.getElementById('totalSize');
        const statusText = document.getElementById('statusText');
        const usedRamText = document.getElementById('usedRamText');
        const maxRamText = document.getElementById('maxRamText');
        const ramBar = document.getElementById('ramBar');
        const ramStatus = document.getElementById('ramStatus');
        const ramSelect = document.getElementById('ramSelect');

        function updateUI() {
            const count = recorder.getSegmentCount();
            const sizeMB = recorder.totalSize / (1024 * 1024);
            const maxMB = recorder.getMaxRamMB();

            segmentCount.textContent = count;
            totalDuration.textContent = (recorder.totalDuration / 1000).toFixed(1) + 's';
            totalSize.textContent = recorder.formatSize(recorder.totalSize);

            usedRamText.textContent = sizeMB.toFixed(1);
            maxRamText.textContent = maxMB === 0 ? '∞' : maxMB;

            const usagePercent = recorder.getRamUsagePercent();
            ramBar.style.width = Math.min(usagePercent, 100) + '%';

            ramBar.className = 'fill';
            if (usagePercent >= 95) {
                ramBar.classList.add('red');
                ramStatus.textContent = '🔥';
            } else if (usagePercent >= 80) {
                ramBar.classList.add('yellow');
                ramStatus.textContent = '⚡';
            } else {
                ramBar.classList.add('green');
                ramStatus.textContent = '✓';
            }

            // Record button
            if (recorder.isRecording) {
                btnRecord.className = 'btn-record recording';
                recordIcon.textContent = '⏹';
                recBadge.classList.add('show');
                const elapsed = recorder.getElapsedSeconds();
                const min = String(Math.floor(elapsed / 60)).padStart(2, '0');
                const sec = String(elapsed % 60).padStart(2, '0');
                timeDisplay.textContent = `${min}:${sec}`;
                timeDisplay.className = 'time-display active';
                statusText.textContent = 'REC';
                statusText.style.color = '#ff3b30';
            } else {
                btnRecord.className = 'btn-record idle';
                recordIcon.textContent = '▶';
                recBadge.classList.remove('show');
                timeDisplay.className = 'time-display';
                if (count > 0) {
                    timeDisplay.textContent = recorder.formatTime(recorder.totalDuration);
                    statusText.textContent = 'Dừng';
                    statusText.style.color = 'rgba(255,255,255,0.4)';
                } else {
                    timeDisplay.textContent = '00:00';
                    statusText.textContent = 'Sẵn sàng';
                    statusText.style.color = 'rgba(255,255,255,0.2)';
                }
            }

            btnSave.disabled = count === 0;

            camFront.classList.toggle('active', recorder.currentFacingMode === 'user');
            camBack.classList.toggle('active', recorder.currentFacingMode === 'environment');

            camFront.disabled = false;
            camBack.disabled = false;
            btnFlipMirror.disabled = false;
        }

        recorder.onUpdate = updateUI;

        // ===== SỰ KIỆN =====

        btnRecord.addEventListener('click', async () => {
            if (recorder.isRecording) {
                recorder.stopRecording();
                showToast('⏹ Đã dừng quay', 1500);
                updateUI();
            } else {
                const ok = await recorder.startRecording();
                if (ok) {
                    showToast('🔴 Đã bắt đầu quay!', 1500);
                    updateUI();
                }
            }
        });

        btnSave.addEventListener('click', () => {
            recorder.save();
        });

        btnFlipMirror.addEventListener('click', () => {
            recorder.toggleMirror();
            updateUI();
        });

        camFront.addEventListener('click', async () => {
            await recorder.switchCamera('user');
            updateUI();
        });

        camBack.addEventListener('click', async () => {
            await recorder.switchCamera('environment');
            updateUI();
        });

        ramSelect.addEventListener('change', function() {
            const value = parseInt(this.value);
            if (value === 0) {
                showToast('♾️ Đã tắt giới hạn RAM', 1500);
            } else {
                showToast(`💾 Đã đặt giới hạn RAM: ${value} MB`, 1500);
            }
            recorder.setMaxRam(value);
            updateUI();
        });

        async function initCamera() {
            const ok = await recorder.changeCameraStream('user');
            if (ok) {
                console.log('📷 Camera đã sẵn sàng');
                updateUI();
            }
        }
        initCamera();

        updateUI();

        window.addEventListener('beforeunload', () => {
            recorder.stop();
        });

        console.log('📹 Camera Hành Trình - Thiết kế mới!');
        console.log('✅ Giao diện tối giản, chuyên nghiệp');
    </script>
</body>
</html>

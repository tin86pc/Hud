<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ring Buffer Video Recorder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 40px 50px;
            max-width: 750px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 25px;
        }

        #videoPreview {
            width: 100%;
            max-height: 350px;
            background: #000;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            object-fit: cover;
            transform: scaleX(-1);
        }

        .camera-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .camera-btn {
            padding: 10px 24px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .camera-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .camera-btn.active {
            background: rgba(100, 181, 246, 0.3);
            border-color: #64b5f6;
            box-shadow: 0 0 20px rgba(100, 181, 246, 0.2);
        }

        .camera-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .camera-btn .icon {
            font-size: 20px;
        }

        .status {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            color: #fff;
            font-size: 15px;
            flex-wrap: wrap;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #555;
            transition: background 0.3s;
        }

        .status-dot.recording {
            background: #ff3b30;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }

        .status-time {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 14px;
            border-radius: 30px;
        }

        .info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
        }

        .info-item {
            text-align: center;
        }

        .info-item span {
            font-weight: 600;
            color: #fff;
            display: block;
            margin-top: 4px;
            font-size: 15px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 14px 34px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 auto;
            min-width: 130px;
            justify-content: center;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-start {
            background: #4caf50;
            color: #fff;
            box-shadow: 0 8px 20px rgba(76, 175, 80, 0.3);
        }

        .btn-start:hover:not(:disabled) {
            background: #43a047;
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(76, 175, 80, 0.4);
        }

        .btn-start:disabled {
            background: #2e7d32;
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-save {
            background: #ff6b35;
            color: #fff;
            box-shadow: 0 8px 20px rgba(255, 107, 53, 0.3);
        }

        .btn-save:hover:not(:disabled) {
            background: #e55a2b;
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(255, 107, 53, 0.4);
        }

        .btn-save:disabled {
            background: #a04020;
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-stop {
            background: #f44336;
            color: #fff;
            box-shadow: 0 8px 20px rgba(244, 67, 54, 0.3);
        }

        .btn-stop:hover:not(:disabled) {
            background: #d32f2f;
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(244, 67, 54, 0.4);
        }

        .btn-stop:disabled {
            background: #7f1f1a;
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-flip {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .btn-flip:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-flip:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .download-link {
            margin-top: 20px;
            display: none;
        }

        .download-link a {
            color: #64b5f6;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border-bottom: 2px solid rgba(100, 181, 246, 0.3);
            padding-bottom: 4px;
            transition: border-color 0.3s;
        }

        .download-link a:hover {
            border-color: #64b5f6;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
            transition: all 0.5s ease;
            pointer-events: none;
            z-index: 999;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px 16px;
            }

            .btn {
                min-width: 100%;
                padding: 12px 20px;
            }

            .info {
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
            }

            h1 {
                font-size: 22px;
            }

            .camera-controls {
                gap: 8px;
            }

            .camera-btn {
                padding: 8px 16px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎥 Ring Buffer Recorder</h1>
        <p class="subtitle">Luôn ghi lại 15 phút gần nhất — bấm Lưu bất cứ lúc nào</p>

        <video id="videoPreview" autoplay muted playsinline></video>

        <div class="camera-controls">
            <button class="camera-btn active" id="camFront" data-facing="user">
                <span class="icon">🤳</span> Camera trước
            </button>
            <button class="camera-btn" id="camBack" data-facing="environment">
                <span class="icon">📷</span> Camera sau
            </button>
            <button class="camera-btn" id="btnFlipMirror">
                <span class="icon">🔄</span> Lật gương
            </button>
        </div>

        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Chưa bắt đầu</span>
            <span class="status-time" id="statusTime">00:00</span>
        </div>

        <div class="info">
            <div class="info-item">
                📦 Số đoạn
                <span id="segmentCount">0</span>
            </div>
            <div class="info-item">
                ⏱️ Thời lượng
                <span id="totalDuration">0s</span>
            </div>
            <div class="info-item">
                📊 Dung lượng
                <span id="totalSize">0 KB</span>
            </div>
            <div class="info-item">
                📷 Camera
                <span id="cameraStatus">Trước</span>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-start" id="btnStart">▶ Bắt đầu</button>
            <button class="btn btn-stop" id="btnStop" disabled>⏹ Dừng</button>
            <button class="btn btn-save" id="btnSave" disabled>💾 Lưu 15 phút</button>
        </div>

        <div class="download-link" id="downloadLink">
            <a href="#" id="downloadAnchor" download="video.webm">📥 Tải video xuống</a>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        // TOAST
        // ============================================================
        let toastTimeout = null;

        function showToast(message, duration = 2500) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        // ============================================================
        // RING BUFFER RECORDER (FIXED - xuất file đúng chuẩn)
        // ============================================================
        class RingVideoRecorder {
            constructor(maxDurationMs = 15 * 60 * 1000) {
                this.maxDurationMs = maxDurationMs;
                this.segmentDurationMs = 1000;

                // Lưu các đoạn dữ liệu thô
                this.buffer = [];
                this.totalSize = 0;
                this.totalDuration = 0;

                // MediaRecorder chính
                this.recorder = null;
                this.stream = null;
                this.isRecording = false;
                this.startTime = null;
                this.timerInterval = null;

                // Camera
                this.currentFacingMode = 'user';
                this.isMirrored = true;

                // Video metadata (quan trọng để xuất file đúng)
                this.mimeType = 'video/webm;codecs=vp9,opus';
                this.firstChunk = true;

                this.onUpdate = null;
            }

            async getCamera(facingMode = 'user') {
                const constraints = {
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                    },
                    audio: true,
                };
                return await navigator.mediaDevices.getUserMedia(constraints);
            }

            async start(facingMode = null) {
                try {
                    if (this.stream) {
                        this.stream.getTracks().forEach(track => track.stop());
                        this.stream = null;
                    }

                    const mode = facingMode || this.currentFacingMode;
                    this.stream = await this.getCamera(mode);
                    this.currentFacingMode = mode;

                    const videoEl = document.getElementById('videoPreview');
                    videoEl.srcObject = this.stream;
                    await videoEl.play();
                    this.applyMirror();

                    // Reset buffer khi bắt đầu quay mới
                    this.buffer = [];
                    this.totalSize = 0;
                    this.totalDuration = 0;
                    this.firstChunk = true;

                    // Tạo MediaRecorder với MIME type chuẩn
                    this.recorder = new MediaRecorder(this.stream, {
                        mimeType: this.mimeType,
                    });

                    // Ghi dữ liệu mỗi 1 giây
                    this.recorder.start(this.segmentDurationMs);

                    this.recorder.ondataavailable = (event) => {
                        if (event.data.size === 0) return;

                        // Lưu vào buffer
                        this.buffer.push(event.data);
                        this.totalSize += event.data.size;
                        this.totalDuration += this.segmentDurationMs;

                        // Xóa đoạn cũ nếu quá 15 phút
                        while (this.totalDuration > this.maxDurationMs) {
                            const oldest = this.buffer.shift();
                            if (oldest) {
                                this.totalSize -= oldest.size;
                                this.totalDuration -= this.segmentDurationMs;
                            }
                        }

                        if (this.onUpdate) this.onUpdate();
                    };

                    this.isRecording = true;
                    this.startTime = Date.now();

                    this.timerInterval = setInterval(() => {
                        if (this.onUpdate) this.onUpdate();
                    }, 500);

                    if (this.onUpdate) this.onUpdate();
                    return true;
                } catch (err) {
                    console.error('Lỗi:', err);
                    showToast('❌ Không thể truy cập camera!');
                    return false;
                }
            }

            stop() {
                if (this.recorder && this.isRecording) {
                    // Quan trọng: gọi stop để ghi nốt dữ liệu còn lại
                    this.recorder.stop();
                    this.isRecording = false;
                    if (this.timerInterval) {
                        clearInterval(this.timerInterval);
                        this.timerInterval = null;
                    }
                    if (this.onUpdate) this.onUpdate();
                }
            }

            // ===== CÁCH LƯU VIDEO MỚI - TẠO FILE HỢP LỆ =====
            save() {
                if (this.buffer.length === 0) {
                    showToast('⚠️ Chưa có dữ liệu video!');
                    return null;
                }

                // Cách 1: Ghép tất cả blob lại
                // Cách 2: Tạo một blob mới và thêm header đúng định dạng
                try {
                    // Lấy tất cả các đoạn
                    const chunks = this.buffer;

                    // Nếu chỉ có 1 đoạn, trả về luôn
                    if (chunks.length === 1) {
                        return new Blob(chunks, { type: 'video/webm' });
                    }

                    // Với nhiều đoạn, ta ghép chúng lại
                    // WebM cho phép ghép trực tiếp các cluster
                    const combinedBlob = new Blob(chunks, { type: 'video/webm' });
                    return combinedBlob;
                } catch (err) {
                    console.error('Lỗi khi tạo blob:', err);
                    showToast('❌ Lỗi tạo file video!');
                    return null;
                }
            }

            // ===== PHƯƠNG PHÁP DỰ PHÒNG: DÙNG CHUỖI GHI ĐÈ =====
            // Nếu cách trên vẫn không được, ta dùng cách này
            saveAlternative() {
                if (this.buffer.length === 0) {
                    showToast('⚠️ Chưa có dữ liệu video!');
                    return null;
                }

                try {
                    // Tạo mảng mới để đảm bảo thứ tự
                    const sortedChunks = [...this.buffer];

                    // Ghép và tạo blob
                    const blob = new Blob(sortedChunks, {
                        type: 'video/webm'
                    });

                    // Kiểm tra kích thước
                    if (blob.size === 0) {
                        showToast('❌ File rỗng!');
                        return null;
                    }

                    return blob;
                } catch (err) {
                    console.error('Lỗi alternative:', err);
                    showToast('❌ Lỗi tạo file!');
                    return null;
                }
            }

            // ===== CHUYỂN CAMERA =====
            async switchCamera(facingMode) {
                if (facingMode === this.currentFacingMode) {
                    showToast('ℹ️ Đã ở camera này rồi!');
                    return false;
                }

                const wasRecording = this.isRecording;
                if (wasRecording) {
                    this.stop();
                }

                try {
                    const success = await this.start(facingMode);
                    if (success) {
                        this.currentFacingMode = facingMode;
                        const label = facingMode === 'user' ? 'Trước' : 'Sau';
                        showToast(`✅ Đã chuyển sang camera ${label}`);
                        if (this.onUpdate) this.onUpdate();
                        return true;
                    }
                    return false;
                } catch (err) {
                    showToast('❌ Không thể chuyển camera!');
                    return false;
                }
            }

            applyMirror() {
                const videoEl = document.getElementById('videoPreview');
                if (this.isMirrored && this.currentFacingMode === 'user') {
                    videoEl.style.transform = 'scaleX(-1)';
                } else {
                    videoEl.style.transform = 'scaleX(1)';
                }
            }

            toggleMirror() {
                this.isMirrored = !this.isMirrored;
                this.applyMirror();
                showToast(this.isMirrored ? '🔄 Đã bật gương' : '🔄 Đã tắt gương');
                if (this.onUpdate) this.onUpdate();
            }

            reset() {
                this.stop();
                this.buffer = [];
                this.totalSize = 0;
                this.totalDuration = 0;
                if (this.onUpdate) this.onUpdate();
            }

            getSegmentCount() {
                return this.buffer.length;
            }

            getElapsedSeconds() {
                if (!this.startTime) return 0;
                return Math.floor((Date.now() - this.startTime) / 1000);
            }

            formatTime(ms) {
                const totalSec = Math.floor(ms / 1000);
                const min = String(Math.floor(totalSec / 60)).padStart(2, '0');
                const sec = String(totalSec % 60).padStart(2, '0');
                return `${min}:${sec}`;
            }

            formatSize(bytes) {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / 1048576).toFixed(1) + ' MB';
            }
        }

        // ============================================================
        // UI CONTROLLER
        // ============================================================

        const recorder = new RingVideoRecorder(15 * 60 * 1000);

        const videoPreview = document.getElementById('videoPreview');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const statusTime = document.getElementById('statusTime');
        const segmentCount = document.getElementById('segmentCount');
        const totalDuration = document.getElementById('totalDuration');
        const totalSize = document.getElementById('totalSize');
        const cameraStatus = document.getElementById('cameraStatus');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const btnSave = document.getElementById('btnSave');
        const btnFlipMirror = document.getElementById('btnFlipMirror');
        const camFront = document.getElementById('camFront');
        const camBack = document.getElementById('camBack');
        const downloadLink = document.getElementById('downloadLink');
        const downloadAnchor = document.getElementById('downloadAnchor');

        function updateUI() {
            const count = recorder.getSegmentCount();
            segmentCount.textContent = count;
            totalDuration.textContent = (recorder.totalDuration / 1000).toFixed(1) + 's';
            totalSize.textContent = recorder.formatSize(recorder.totalSize);

            const camLabel = recorder.currentFacingMode === 'user' ? 'Trước 🤳' : 'Sau 📷';
            cameraStatus.textContent = camLabel;

            camFront.classList.toggle('active', recorder.currentFacingMode === 'user');
            camBack.classList.toggle('active', recorder.currentFacingMode === 'environment');

            if (recorder.isRecording) {
                statusDot.className = 'status-dot recording';
                statusText.textContent = '🔴 Đang quay';
                const elapsed = recorder.getElapsedSeconds();
                const min = String(Math.floor(elapsed / 60)).padStart(2, '0');
                const sec = String(elapsed % 60).padStart(2, '0');
                statusTime.textContent = `${min}:${sec}`;
            } else {
                statusDot.className = 'status-dot';
                statusText.textContent = '⏸ Đã dừng';
                if (count > 0) {
                    statusTime.textContent = recorder.formatTime(recorder.totalDuration);
                } else {
                    statusTime.textContent = '00:00';
                }
            }

            btnStart.disabled = recorder.isRecording;
            btnStop.disabled = !recorder.isRecording;
            btnSave.disabled = (count === 0);

            camFront.disabled = recorder.isRecording;
            camBack.disabled = recorder.isRecording;
            btnFlipMirror.disabled = recorder.isRecording;

            if (count === 0) {
                downloadLink.style.display = 'none';
            }
        }

        recorder.onUpdate = updateUI;

        // ===== SỰ KIỆN =====

        btnStart.addEventListener('click', async () => {
            const ok = await recorder.start(recorder.currentFacingMode);
            if (ok) {
                downloadLink.style.display = 'none';
                showToast('🎥 Đã bắt đầu quay!');
                updateUI();
            }
        });

        btnStop.addEventListener('click', () => {
            recorder.stop();
            showToast('⏹ Đã dừng quay');
            updateUI();
        });

        btnSave.addEventListener('click', () => {
            // Thử cách 1
            let blob = recorder.save();

            // Nếu thất bại, thử cách 2
            if (!blob || blob.size === 0) {
                blob = recorder.saveAlternative();
            }

            if (!blob || blob.size === 0) {
                showToast('❌ Không thể tạo file video!');
                return;
            }

            const url = URL.createObjectURL(blob);
            downloadAnchor.href = url;
            const now = new Date();
            const dateStr =
                `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}h${String(now.getMinutes()).padStart(2,'0')}`;
            const camLabel = recorder.currentFacingMode === 'user' ? 'truoc' : 'sau';
            downloadAnchor.download = `video_15phut_${camLabel}_${dateStr}.webm`;

            downloadLink.style.display = 'block';
            setTimeout(() => {
                downloadAnchor.click();
            }, 300);

            const sizeMB = (blob.size / 1048576).toFixed(1);
            showToast(`✅ Đã lưu ${sizeMB} MB`);
            statusText.textContent = `✅ Đã lưu ${sizeMB} MB`;
        });

        camFront.addEventListener('click', async () => {
            await recorder.switchCamera('user');
            updateUI();
        });

        camBack.addEventListener('click', async () => {
            await recorder.switchCamera('environment');
            updateUI();
        });

        btnFlipMirror.addEventListener('click', () => {
            recorder.toggleMirror();
            updateUI();
        });

        // Reset UI
        updateUI();

        window.addEventListener('beforeunload', () => {
            recorder.stop();
        });

        console.log('🎥 Ring Buffer Recorder đã sẵn sàng!');
        console.log(`📐 Tối đa: ${recorder.maxDurationMs / 60000} phút`);
        console.log(`📷 Camera hiện tại: ${recorder.currentFacingMode}`);
    </script>
</body>
</html>

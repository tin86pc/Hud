<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Camera Hành Trình</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-dark: #000;
            --panel-bg: rgba(10, 10, 15, 0.75);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-primary: #fff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-muted: rgba(255, 255, 255, 0.35);
            --accent-red: #ff3b30;
            --accent-green: #34c759;
            --accent-yellow: #ff9500;
            --accent-blue: #007aff;
            --accent-orange: #ff6b35;

            /* === TỶ LỀ CO TOÀN BỘ GIAO DIỆN: 90% === */
            --scale: 0.9;
            
            /* Tỷ lệ chia màn hình */
            --video-area-h: 80vh;
            --ctrl-area-h: 20vh;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* ======================================
           VIDEO & CANVAS
           ====================================== */
        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--video-area-h);
            z-index: 1;
            overflow: hidden;
        }

        #videoPreview {
            width: 100%;
            height: 100%;
            display: none;
            object-fit: cover;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            background: var(--bg-dark);
            object-fit: cover;
        }

        /* ======================================
           GIAO DIỆN ĐIỀU KHIỂN — CO 90%
           ====================================== */
        .overlay {
            position: absolute;
            inset: 0;
            z-index: 999;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: calc(3vh * var(--scale)) calc(3vw * var(--scale));
            transform-origin: top left;
        }
        .overlay > * { pointer-events: auto; }

        /* === THANH THÔNG TIN TRÊN === */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .top-left { display: flex; flex-direction: column; gap: calc(1vh * var(--scale)); }

        .rec-indicator {
            display: inline-flex;
            align-items: center;
            gap: calc(1.5vmin * var(--scale));
            padding: calc(0.8vmin * var(--scale)) calc(3vmin * var(--scale));
            background: rgba(255, 59, 48, 0.15);
            border: 1px solid rgba(255, 59, 48, 0.3);
            border-radius: calc(10vmin * var(--scale));
            font-size: calc(2.8vmin * var(--scale));
            color: var(--accent-red);
            font-weight: 700;
            opacity: 0;
            transform: translateY(calc(-1vmin * var(--scale)));
            transition: all 0.3s ease;
        }
        .rec-indicator.show { opacity: 1; transform: translateY(0); }
        .rec-dot {
            width: calc(2vmin * var(--scale)); height: calc(2vmin * var(--scale));
            border-radius: 50%; background: var(--accent-red);
            animation: recPulse 1s infinite;
        }
        @keyframes recPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        .top-right { display: flex; flex-direction: column; align-items: flex-end; gap: calc(1.5vmin * var(--scale)); }

        .gps-panel {
            display: inline-flex;
            align-items: center;
            gap: calc(1.5vmin * var(--scale));
            padding: calc(1.2vmin * var(--scale)) calc(2.5vmin * var(--scale));
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: calc(3vmin * var(--scale));
            font-size: calc(2.8vmin * var(--scale));
            color: var(--text-secondary);
        }
        .gps-dot {
            width: calc(2vmin * var(--scale)); height: calc(2vmin * var(--scale));
            border-radius: 50%; flex-shrink: 0;
        }
        .gps-dot.green { background: var(--accent-green); animation: gpsPulse 1.5s infinite; }
        .gps-dot.yellow { background: var(--accent-yellow); animation: gpsPulse 1.5s infinite; }
        .gps-dot.red { background: var(--accent-red); }
        @keyframes gpsPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .center-spacer { flex: 1; }

        /* === KHỐI DƯỚI === */
        .bottom-stack {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            min-height: var(--ctrl-area-h);
            padding: calc(2vh * var(--scale)) calc(3vw * var(--scale)) calc(3vh * var(--scale));
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: calc(1.5vh * var(--scale));
            background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.4), transparent);
            z-index: 999;
        }

        .info-bar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: calc(1.5vmin * var(--scale)) calc(3vmin * var(--scale));
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: calc(3vmin * var(--scale));
            font-size: calc(3vmin * var(--scale));
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: calc(1vmin * var(--scale));
            color: var(--text-muted);
        }
        .info-item span {
            color: var(--text-secondary);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .ram-bar-wrapper { width: 100%; }
        .ram-panel {
            display: flex;
            align-items: center;
            gap: calc(2vmin * var(--scale));
            padding: calc(1.5vmin * var(--scale)) calc(3vmin * var(--scale));
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: calc(3vmin * var(--scale));
            flex-wrap: wrap;
        }
        .ram-label {
            font-size: calc(2.5vmin * var(--scale)); font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: calc(0.1vmin * var(--scale));
        }
        .ram-track {
            flex: 1; height: calc(1.2vmin * var(--scale)); min-width: 15vw;
            background: rgba(255,255,255,0.08); border-radius: calc(10vmin * var(--scale)); overflow: hidden;
        }
        .ram-fill {
            height: 100%; border-radius: calc(10vmin * var(--scale));
            transition: width 0.4s ease, background 0.4s ease; width: 0%;
        }
        .ram-fill.green { background: linear-gradient(90deg, var(--accent-green), #8edb56); }
        .ram-fill.yellow { background: linear-gradient(90deg, var(--accent-yellow), #ffcc00); }
        .ram-fill.red { background: linear-gradient(90deg, var(--accent-red), #ff6b6b); animation: blink 0.8s infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.5} }
        .ram-values { font-size: calc(2.5vmin * var(--scale)); color: var(--text-muted); white-space: nowrap; }
        .ram-values span { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
        .ram-selector { display: flex; align-items: center; gap: calc(1.5vmin * var(--scale)); white-space: nowrap; }
        .ram-selector label { font-size: calc(2.5vmin * var(--scale)); font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
        .ram-selector select {
            padding: calc(0.5vmin * var(--scale)) calc(2vmin * var(--scale));
            border-radius: calc(1.5vmin * var(--scale)); border: 1px solid var(--panel-border);
            background: rgba(0,0,0,0.3); color: var(--text-secondary);
            font-size: calc(2.8vmin * var(--scale)); outline: none;
        }
        .ram-selector select:focus { border-color: var(--accent-blue); }

        /* === NÚT BẤM — KÍCH THƯỚC ĐÃ CO 90% === */
        .controls-bar {
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: calc(1vh * var(--scale)) calc(2vw * var(--scale));
            width: 100%;
        }

        .ctrl-group { display: flex; align-items: center; gap: calc(2vmin * var(--scale)); }

        .ctrl-btn {
            width: calc(13vmin * var(--scale)); height: calc(13vmin * var(--scale));
            min-width: calc(48px * var(--scale)); min-height: calc(48px * var(--scale));
            max-width: calc(72px * var(--scale)); max-height: calc(72px * var(--scale));
            border-radius: 50%; border: none;
            background: var(--panel-bg); backdrop-filter: blur(12px);
            color: var(--text-secondary); font-size: calc(5.5vmin * var(--scale));
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease; border: 1px solid var(--panel-border);
            position: relative; z-index: 1001;
        }
        .ctrl-btn:active { transform: scale(0.92); }
        .ctrl-btn:disabled { opacity: 0.25; cursor: not-allowed; transform: none; }
        .ctrl-btn:hover:not(:disabled) {
            background: rgba(255,255,255,0.12); color: var(--text-primary);
        }

        .ctrl-btn.secondary {
            width: calc(11vmin * var(--scale)); height: calc(11vmin * var(--scale));
            min-width: calc(40px * var(--scale)); min-height: calc(40px * var(--scale));
            max-width: calc(60px * var(--scale)); max-height: calc(60px * var(--scale));
            font-size: calc(4.8vmin * var(--scale));
        }
        .ctrl-btn.save-btn {
            background: rgba(255, 107, 53, 0.15); color: var(--accent-orange);
            border-color: rgba(255, 107, 53, 0.25);
        }
        .cam-switch-btn.front { color: var(--accent-blue); }
        .cam-switch-btn.back { color: var(--accent-green); }

        .record-btn-wrap { position: relative; z-index: 1002; }
        .btn-record {
            width: calc(20vmin * var(--scale)); height: calc(20vmin * var(--scale));
            min-width: calc(72px * var(--scale)); min-height: calc(72px * var(--scale));
            max-width: calc(100px * var(--scale)); max-height: calc(100px * var(--scale));
            border-radius: 50%;
            border: calc(4px * var(--scale)) solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff; font-size: calc(8vmin * var(--scale));
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            position: relative; z-index: 1002; transition: all 0.25s ease;
        }
        .btn-record:active { transform: scale(0.93); }
        .btn-record.idle {
            border-color: rgba(52, 199, 89, 0.4); background: rgba(52, 199, 89, 0.1);
        }
        .btn-record.recording {
            border-color: rgba(255, 59, 48, 0.5); background: rgba(255, 59, 48, 0.15);
        }
        .btn-record.recording::after {
            content: ''; position: absolute; inset: calc(-2.5vmin * var(--scale));
            border-radius: 50%; border: calc(2px * var(--scale)) solid transparent;
            animation: recordRing 1.5s infinite;
        }
        @keyframes recordRing {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.35); opacity: 0; }
        }

        /* === TOAST === */
        .toast {
            position: fixed; bottom: calc(var(--ctrl-area-h) + 2vh); left: 50%;
            transform: translateX(-50%) translateY(20vh);
            background: var(--panel-bg); color: var(--text-primary);
            padding: calc(2.5vmin * var(--scale)) calc(5vmin * var(--scale));
            border-radius: calc(4vmin * var(--scale)); font-size: calc(3.5vmin * var(--scale));
            backdrop-filter: blur(16px); border: 1px solid var(--panel-border);
            opacity: 0; transition: all 0.35s ease; pointer-events: none; z-index: 2000;
            max-width: 85vw; text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.warning { border-color: rgba(255, 149, 0, 0.3); }
        .toast.danger { border-color: rgba(255, 59, 48, 0.3); }
        .toast.success { border-color: rgba(52, 199, 89, 0.3); }

        /* === Màn hình NGANG === */
        @media (orientation: landscape) {
            :root {
                --video-area-h: 100vh;
                --ctrl-area-h: 100vh;
            }
            .video-wrapper { width: calc(100vw - 22vw); height: 100vh; }
            .bottom-stack {
                width: 22vw; height: 100vh; left: auto; right: 0;
                justify-content: center; padding: calc(2vh * var(--scale)) calc(2vw * var(--scale));
                background: linear-gradient(to left, rgba(0,0,0,0.85), rgba(0,0,0,0.4), transparent);
            }
            .info-bar { flex-direction: column; gap: calc(1.5vmin * var(--scale)); }
            .ram-panel { flex-direction: column; align-items: stretch; }
            .ram-track { width: 100%; }
            .controls-bar { flex-direction: column; gap: calc(3vh * var(--scale)); }
            .toast { bottom: 3vh; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="video-wrapper">
        <video id="videoPreview" autoplay muted playsinline></video>
        <canvas id="renderCanvas"></canvas>
    </div>

    <div class="overlay">
        <div class="top-bar">
            <div class="top-left">
                <span class="rec-indicator" id="recIndicator">
                    <span class="rec-dot"></span> Đang quay
                </span>
            </div>
            <div class="top-right">
                <div class="gps-panel">
                    <span class="gps-dot red" id="gpsDot"></span>
                    <span id="gpsLabel">Tìm tín hiệu</span>
                </div>
            </div>
        </div>
        <div class="center-spacer"></div>
    </div>

    <div class="bottom-stack">
        <div class="info-bar">
            <div class="info-item">📦 Đoạn: <span id="segmentCount">0</span></div>
            <div class="info-item">⏱️ <span id="totalDuration">0s</span></div>
            <div class="info-item">💾 <span id="totalSize">0 KB</span></div>
        </div>

        <div class="ram-bar-wrapper">
            <div class="ram-panel">
                <span class="ram-label">RAM</span>
                <div class="ram-track"><div class="ram-fill green" id="ramBar" style="width:0%"></div></div>
                <div class="ram-values"><span id="usedRam">0</span>/<span id="maxRam">200</span>MB</div>
                <div class="ram-selector">
                    <label>Giới hạn</label>
                    <select id="ramLimitSelect">
                        <option value="50">50</option>
                        <option value="100">100</option>
                        <option value="200" selected>200</option>
                        <option value="300">300</option>
                        <option value="500">500</option>
                        <option value="1000">1GB</option>
                        <option value="0">∞</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="controls-bar">
            <div class="ctrl-group">
                <button class="ctrl-btn secondary" id="btnMirror" title="Lật ngang hình">↔️</button>
            </div>
            <div class="record-btn-wrap">
                <button class="btn-record idle" id="btnRecordMain"><span id="recordIcon">▶</span></button>
            </div>
            <div class="ctrl-group">
                <button class="ctrl-btn secondary save-btn" id="btnDownload" disabled title="Lưu video">💾</button>
            </div>
            <div class="ctrl-group">
                <button class="ctrl-btn secondary cam-switch-btn front" id="camSwitchBtn" title="Chuyển camera">📷</button>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toastMsg"></div>

<script>
// ============================================================
// TOAST
// ============================================================
let toastTimer = null;
function showToast(msg, duration = 2500, type = '') {
    const t = document.getElementById('toastMsg');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), duration);
}

// ============================================================
// GPS & SPEED
// ============================================================
class GPSTracker {
    constructor() {
        this.watchId = null;
        this.speed = 0;
        this.active = false;
        this.lastPos = null;
        this.lastTime = null;
    }

    start() {
        if (!navigator.geolocation) {
            showToast('❌ Trình duyệt không hỗ trợ GPS', 3000, 'danger');
            return false;
        }
        this.active = true;
        this.watchId = navigator.geolocation.watchPosition(
            p => this.handlePos(p),
            e => this.handleErr(e),
            { enableHighAccuracy: true, timeout: 8000, maximumAge: 1000 }
        );
        this.updateUI('Tìm tín hiệu...', 'yellow');
        return true;
    }

    stop() {
        this.active = false;
        if (this.watchId !== null) navigator.geolocation.clearWatch(this.watchId);
        this.speed = 0;
        this.updateUI('Tắt', 'red');
    }

    handlePos(pos) {
        if (!this.active) return;
        const c = pos.coords;
        if (c.speed !== null && c.speed >= 0) {
            this.speed = Math.round(c.speed * 3.6 * 10) / 10;
        } else {
            this.speed = this.calcSpeedFromPos(c, pos.timestamp);
        }
        this.updateUI('GPS', 'green');
    }

    calcSpeedFromPos(coords, ts) {
        if (!this.lastPos) {
            this.lastPos = { lat: coords.latitude, lng: coords.longitude, ts };
            return 0;
        }
        const d = this.distHaversine(this.lastPos.lat, this.lastPos.lng, coords.latitude, coords.longitude);
        const t = (ts - this.lastPos.ts) / 1000;
        this.lastPos = { lat: coords.latitude, lng: coords.longitude, ts };
        return t > 0 && d > 1 ? Math.round((d / t) * 3.6 * 10) / 10 : 0;
    }

    distHaversine(lat1, lon1, lat2, lon2) {
        const R = 6371e3, toRad = d => d * Math.PI / 180;
        const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
        const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    handleErr(e) {
        const map = {
            [e.PERMISSION_DENIED]: ['Cấp quyền vị trí', 'red'],
            [e.POSITION_UNAVAILABLE]: ['Không có tín hiệu', 'red'],
            [e.TIMEOUT]: ['Mất tín hiệu', 'yellow']
        };
        const [text, color] = map[e.code] || ['Lỗi GPS', 'red'];
        this.updateUI(text, color);
    }

    updateUI(text, color) {
        const dot = document.getElementById('gpsDot');
        dot.className = 'gps-dot ' + color;
        document.getElementById('gpsLabel').textContent = text;
    }

    getSpeed() { return this.speed; }
}

// ============================================================
// VIDEO RECORDER — VẼ NỀN CHỈ BAO QUANH CHỮ + CO 90%
// ============================================================
class DashCamRecorder {
    constructor(maxRamMB = 200) {
        this.maxRam = maxRamMB === 0 ? Infinity : maxRamMB * 1024 * 1024;
        this.segmentTime = 1000;
        this.buffer = [];
        this.totalSize = 0;
        this.totalDuration = 0;
        this.recorder = null;
        this.stream = null;
        this.canvasStream = null;
        this.recording = false;
        this.rendering = false;
        this.facing = 'user';
        this.mirrored = false;
        this.firstChunk = null;
        this.hasHeader = false;
        this.canvas = document.getElementById('renderCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.video = document.getElementById('videoPreview');
        this.gps = new GPSTracker();
        this.videoW = 1280; this.videoH = 720;
        this.onStateChange = null;
        this.scale = 0.9; // <-- CO 90% CẢ PHẦN VẼ TRÊN VIDEO
    }

    setMaxRamMB(mb) {
        this.maxRam = mb === 0 ? Infinity : mb * 1024 * 1024;
        this.enforceLimits();
        this.notifyChange();
    }

    async initCamera(facing = 'user') {
        const cons = { video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: true };
        this.stream = await navigator.mediaDevices.getUserMedia(cons);
        this.facing = facing;
        this.video.srcObject = this.stream;
        await this.video.play();
        const s = this.stream.getVideoTracks()[0].getSettings();
        this.videoW = s.width || 1280; this.videoH = s.height || 720;
        this.canvas.width = this.videoW; this.canvas.height = this.videoH;
        return true;
    }

    async switchCamera(facing) {
        if (facing === this.facing) { showToast('Đang dùng camera này', 1500); return; }
        const wasRecording = this.recording;
        if (this.recording) this.stopRecording();
        this.stream?.getTracks().forEach(t => t.stop());
        await this.initCamera(facing);
        if (wasRecording) await this.startRecording();
        this.updateCamButton();
        showToast(`Đã chuyển sang camera ${facing === 'user' ? 'trước' : 'sau'}`, 1500);
    }

    updateCamButton() {
        const btn = document.getElementById('camSwitchBtn');
        if (this.facing === 'user') { btn.textContent = '📷'; btn.classList.remove('back'); btn.classList.add('front'); }
        else { btn.textContent = '🔄'; btn.classList.remove('front'); btn.classList.add('back'); }
    }

    async startRecording() {
        if (this.recording) return;
        if (!this.stream) await this.initCamera(this.facing);
        this.buffer = []; this.totalSize = 0; this.totalDuration = 0;
        this.firstChunk = null; this.hasHeader = false;
        this.canvasStream = this.canvas.captureStream(30);
        const aTracks = this.stream.getAudioTracks();
        if (aTracks[0]) this.canvasStream.addTrack(aTracks[0]);
        this.recorder = new MediaRecorder(this.canvasStream, { mimeType: 'video/webm;codecs=vp8,opus' });
        this.recorder.ondataavailable = e => this.handleChunk(e);
        this.recorder.start(this.segmentTime);
        this.recording = true;
        this.gps.start();
        this.startRender();
        this.timer = setInterval(() => { this.enforceLimits(); this.notifyChange(); }, 2000);
        this.notifyChange();
        showToast('🔴 Bắt đầu quay', 2000, 'success');
    }

    stopRecording() {
        if (!this.recording) return;
        this.recorder.stop();
        this.recording = false;
        clearInterval(this.timer);
        this.gps.stop();
        this.stopRender();
        this.notifyChange();
        showToast('⏹ Đã dừng quay', 2000);
    }

    handleChunk(e) {
        if (!e.data.size) return;
        if (!this.hasHeader) { this.firstChunk = e.data; this.hasHeader = true; }
        this.buffer.push(e.data);
        this.totalSize += e.data.size;
        this.totalDuration += this.segmentTime;
        this.enforceLimits();
        this.notifyChange();
    }

    enforceLimits() {
        while (this.buffer.length > 1 && this.totalSize > this.maxRam) {
            const removed = this.buffer.shift();
            this.totalSize -= removed.size;
            this.totalDuration -= this.segmentTime;
            if (removed === this.firstChunk && this.buffer.length) {
                this.buffer.unshift(removed);
                this.totalSize += removed.size;
                this.totalDuration += this.segmentTime;
                break;
            }
        }
    }

    startRender() {
        if (this.rendering) return;
        this.rendering = true;
        const draw = () => {
            if (!this.rendering) return;
            const cw = this.canvas.width;
            const ch = this.canvas.height;
            this.ctx.clearRect(0, 0, cw, ch);

            // Vẽ video
            const vw = this.video.videoWidth, vh = this.video.videoHeight;
            const vRatio = vw / vh, cRatio = cw / ch;
            let dw, dh, ox, oy;
            if (vRatio > cRatio) { dh = ch; dw = dh * vRatio; ox = (cw - dw) / 2; oy = 0; }
            else { dw = cw; dh = dw / vRatio; ox = 0; oy = (ch - dh) / 2; }

            if (this.mirrored) {
                this.ctx.save();
                this.ctx.translate(cw / 2, 0);
                this.ctx.scale(-1, 1);
                this.ctx.drawImage(this.video, -dw / 2, oy, dw, dh);
                this.ctx.restore();
            } else {
                this.ctx.drawImage(this.video, ox, oy, dw, dh);
            }

            // ==============================================
            // VẼ THÔNG TIN — CO 90% KÍCH THƯỚC
            // ==============================================
            const now = new Date();
            const dateStr = now.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            const speed = this.gps.getSpeed();
            const speedStr = speed.toFixed(1) + ' km/h';

            // Tính toán font chữ đã co tỷ lệ
            const fontSizeDate = Math.max(cw * 0.028 * this.scale, 14 * this.scale);
            const fontSizeTime = Math.max(cw * 0.04 * this.scale, 20 * this.scale);
            const fontSizeSpeed = Math.max(cw * 0.045 * this.scale, 24 * this.scale);
            const lineSpacing = fontSizeTime * 0.35;
            const paddingX = Math.max(cw * 0.03 * this.scale, 12 * this.scale);
            const paddingY = Math.max(ch * 0.025 * this.scale, 8 * this.scale);
            const margin = Math.max(cw * 0.025 * this.scale, 12 * this.scale);
            const radius = Math.max(cw * 0.012 * this.scale, 8 * this.scale);

            // Đặt font trước để đo chiều rộng chữ
            this.ctx.font = `bold ${fontSizeDate}px -apple-system, sans-serif`;
            const dateWidth = this.ctx.measureText(dateStr).width;
            
            this.ctx.font = `bold ${fontSizeTime}px -apple-system, sans-serif`;
            const timeWidth = this.ctx.measureText(timeStr).width;
            
            this.ctx.font = `bold ${fontSizeSpeed}px -apple-system, sans-serif`;
            const speedWidth = this.ctx.measureText(speedStr).width;

            // Tính kích thước khối nền vừa đủ với nội dung
            const textWidth = Math.max(dateWidth, timeWidth, speedWidth);
            const boxW = textWidth + paddingX * 2;
            const boxH = paddingY * 2 + fontSizeDate + fontSizeTime + fontSizeSpeed + lineSpacing * 2;
            const boxX = margin;
            const boxY = margin;

            // Vẽ nền trong suốt nhẹ
            this.ctx.save();
            this.ctx.shadowColor = 'rgba(0,0,0,0.25)';
            this.ctx.shadowBlur = cw * 0.01 * this.scale;
            this.ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
            this.ctx.beginPath();
            this.ctx.moveTo(boxX + radius, boxY);
            this.ctx.lineTo(boxX + boxW - radius, boxY);
            this.ctx.quadraticCurveTo(boxX + boxW, boxY, boxX + boxW, boxY + radius);
            this.ctx.lineTo(boxX + boxW, boxY + boxH - radius);
            this.ctx.quadraticCurveTo(boxX + boxW, boxY + boxH, boxX + boxW - radius, boxY + boxH);
            this.ctx.lineTo(boxX + radius, boxY + boxH);
            this.ctx.quadraticCurveTo(boxX, boxY + boxH, boxX, boxY + boxH - radius);
            this.ctx.lineTo(boxX, boxY + radius);
            this.ctx.quadraticCurveTo(boxX, boxY, boxX + radius, boxY);
            this.ctx.closePath();
            this.ctx.fill();
            this.ctx.shadowBlur = 0;
            this.ctx.restore();

            // Vẽ chữ
            const textX = boxX + paddingX;
            let currentY = boxY + paddingY + fontSizeDate * 0.8;

            this.ctx.fillStyle = 'rgba(255,255,255,0.95)';
            this.ctx.font = `bold ${fontSizeDate}px -apple-system, sans-serif`;
            this.ctx.textAlign = 'left';
            this.ctx.fillText(dateStr, textX, currentY);
            currentY += fontSizeDate + lineSpacing;

            this.ctx.font = `bold ${fontSizeTime}px -apple-system, sans-serif`;
            this.ctx.fillText(timeStr, textX, currentY);
            currentY += fontSizeTime + lineSpacing;

            const speedColor = speed >= 50 ? '#ff3b30' : speed >= 30 ? '#ff9500' : '#34c759';
            this.ctx.fillStyle = speedColor;
            this.ctx.font = `bold ${fontSizeSpeed}px -apple-system, sans-serif`;
            this.ctx.fillText(speedStr, textX, currentY);

            this.ctx.restore();

            requestAnimationFrame(draw);
        };
        draw();
    }

    stopRender() { this.rendering = false; }

    toggleMirror() {
        this.mirrored = !this.mirrored;
        showToast(this.mirrored ? '🔄 Bật gương hình' : '🔄 Tắt gương hình', 1500);
    }

    saveVideo() {
        if (!this.buffer.length) return showToast('Chưa có video để lưu', 2000, 'warning');
        const chunks = this.buffer[0] !== this.firstChunk ? [this.firstChunk, ...this.buffer] : this.buffer;
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const d = new Date();
        a.download = `cam-hanh-trinh-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}.webm`;
        a.href = url; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
        showToast(`✅ Đã lưu: ${(blob.size / 1048576).toFixed(1)} MB`, 2500, 'success');
    }

    formatSize(b) {
        if (b < 1024) return b + ' B';
        if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
        return (b / 1048576).toFixed(1) + ' MB';
    }

    notifyChange() {
        if (this.onStateChange) this.onStateChange();
    }
}

// ============================================================
// KẾT NỐI UI
// ============================================================
const recorder = new DashCamRecorder(200);

function syncUI() {
    const isRec = recorder.recording;
    const hasData = recorder.buffer.length > 0;

    const btn = document.getElementById('btnRecordMain');
    const icon = document.getElementById('recordIcon');
    btn.className = 'btn-record ' + (isRec ? 'recording' : 'idle');
    icon.textContent = isRec ? '⏹' : '▶';
    document.getElementById('recIndicator').classList.toggle('show', isRec);

    document.getElementById('segmentCount').textContent = recorder.buffer.length;
    document.getElementById('totalDuration').textContent = (recorder.totalDuration / 1000).toFixed(1) + 's';
    document.getElementById('totalSize').textContent = recorder.formatSize(recorder.totalSize);

    const maxMB = recorder.maxRam === Infinity ? 0 : Math.round(recorder.maxRam / 1048576);
    const usedMB = Math.round(recorder.totalSize / 1048576);
    const percent = recorder.maxRam === Infinity ? 0 : Math.min((recorder.totalSize / recorder.maxRam) * 100, 100);
    document.getElementById('ramBar').style.width = percent + '%';
    document.getElementById('ramBar').className = 'ram-fill ' + (percent >= 95 ? 'red' : percent >= 80 ? 'yellow' : 'green');
    document.getElementById('usedRam').textContent = usedMB;
    document.getElementById('maxRam').textContent = maxMB || '∞';

    document.getElementById('btnDownload').disabled = !hasData;
}

recorder.onStateChange = syncUI;

document.getElementById('btnRecordMain').addEventListener('click', () => {
    recorder.recording ? recorder.stopRecording() : recorder.startRecording();
});
document.getElementById('btnDownload').addEventListener('click', () => recorder.saveVideo());
document.getElementById('btnMirror').addEventListener('click', () => recorder.toggleMirror());
document.getElementById('camSwitchBtn').addEventListener('click', async () => {
    const newFacing = recorder.facing === 'user' ? 'environment' : 'user';
    await recorder.switchCamera(newFacing);
});
document.getElementById('ramLimitSelect').addEventListener('change', e => {
    recorder.setMaxRamMB(parseInt(e.target.value));
    syncUI();
});

recorder.initCamera('user').then(() => {
    recorder.updateCamButton();
    syncUI();
});

window.addEventListener('beforeunload', () => recorder.stopRecording());
</script>

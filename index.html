<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ring Buffer - Time & Speed GPS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 40px 50px;
            max-width: 850px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            max-height: 400px;
            background: #000;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            overflow: hidden;
        }

        #videoPreview {
            width: 100%;
            max-height: 400px;
            display: block;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            border-radius: 16px;
        }

        .camera-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .camera-btn {
            padding: 10px 24px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .camera-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .camera-btn.active {
            background: rgba(100, 181, 246, 0.3);
            border-color: #64b5f6;
            box-shadow: 0 0 20px rgba(100, 181, 246, 0.2);
        }

        .camera-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .camera-btn .icon {
            font-size: 20px;
        }

        .gps-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.3);
        }

        .gps-status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .gps-status .dot.green {
            background: #4caf50;
            animation: pulse 1.5s infinite;
        }

        .gps-status .dot.yellow {
            background: #ff9800;
            animation: pulse 1.5s infinite;
        }

        .gps-status .dot.red {
            background: #f44336;
        }

        .ram-settings {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .ram-settings label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ram-settings select {
            padding: 8px 16px;
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: border-color 0.3s;
            min-width: 120px;
        }

        .ram-settings select:hover {
            border-color: rgba(255, 255, 255, 0.4);
        }

        .ram-settings select:focus {
            border-color: #64b5f6;
        }

        .ram-settings select option {
            background: #302b63;
            color: #fff;
        }

        .ram-info {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ram-info .bar {
            width: 120px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .ram-info .bar .fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease, background 0.3s ease;
            width: 0%;
        }

        .ram-info .bar .fill.green {
            background: linear-gradient(90deg, #4caf50, #8bc34a);
        }

        .ram-info .bar .fill.yellow {
            background: linear-gradient(90deg, #ffeb3b, #ff9800);
        }

        .ram-info .bar .fill.red {
            background: linear-gradient(90deg, #ff5722, #f44336);
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .status {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            color: #fff;
            font-size: 15px;
            flex-wrap: wrap;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #555;
            transition: background 0.3s;
        }

        .status-dot.recording {
            background: #ff3b30;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }

        .status-time {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 14px;
            border-radius: 30px;
        }

        .info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
        }

        .info-item {
            text-align: center;
        }

        .info-item span {
            font-weight: 600;
            color: #fff;
            display: block;
            margin-top: 4px;
            font-size: 15px;
        }

        .info-item .warning {
            color: #ff6b35;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 14px 34px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 auto;
            min-width: 130px;
            justify-content: center;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-start {
            background: #4caf50;
            color: #fff;
            box-shadow: 0 8px 20px rgba(76, 175, 80, 0.3);
        }

        .btn-start:hover:not(:disabled) {
            background: #43a047;
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(76, 175, 80, 0.4);
        }

        .btn-start:disabled {
            background: #2e7d32;
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-save {
            background: #ff6b35;
            color: #fff;
            box-shadow: 0 8px 20px rgba(255, 107, 53, 0.3);
        }

        .btn-save:hover:not(:disabled) {
            background: #e55a2b;
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(255, 107, 53, 0.4);
        }

        .btn-save:disabled {
            background: #a04020;
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-stop {
            background: #f44336;
            color: #fff;
            box-shadow: 0 8px 20px rgba(244, 67, 54, 0.3);
        }

        .btn-stop:hover:not(:disabled) {
            background: #d32f2f;
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(244, 67, 54, 0.4);
        }

        .btn-stop:disabled {
            background: #7f1f1a;
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-flip {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .btn-flip:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-flip:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .download-link {
            margin-top: 20px;
            display: none;
        }

        .download-link a {
            color: #64b5f6;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border-bottom: 2px solid rgba(100, 181, 246, 0.3);
            padding-bottom: 4px;
            transition: border-color 0.3s;
        }

        .download-link a:hover {
            border-color: #64b5f6;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
            transition: all 0.5s ease;
            pointer-events: none;
            z-index: 999;
            max-width: 90%;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.warning {
            background: rgba(255, 87, 34, 0.9);
        }

        .toast.danger {
            background: rgba(244, 67, 54, 0.95);
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px 16px;
            }

            .btn {
                min-width: 100%;
                padding: 12px 20px;
            }

            .info {
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
            }

            h1 {
                font-size: 22px;
            }

            .camera-controls {
                gap: 8px;
            }

            .camera-btn {
                padding: 8px 16px;
                font-size: 13px;
            }

            .ram-settings {
                flex-direction: column;
                gap: 12px;
            }

            .ram-settings label {
                width: 100%;
                justify-content: center;
            }

            .ram-info .bar {
                width: 80px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎥 Ring Buffer Recorder</h1>
        <p class="subtitle">Hiển thị thời gian & tốc độ GPS trên video</p>

        <div class="video-wrapper">
            <video id="videoPreview" autoplay muted playsinline></video>
            <canvas id="overlayCanvas"></canvas>
        </div>

        <!-- GPS Status -->
        <div class="gps-status">
            <span class="dot red" id="gpsDot"></span>
            <span id="gpsStatus">Đang tìm GPS...</span>
            <span style="margin-left:10px;color:rgba(255,255,255,0.5);">|</span>
            <span id="gpsAccuracy" style="color:rgba(255,255,255,0.6);font-size:12px;">Độ chính xác: --</span>
        </div>

        <div class="camera-controls">
            <button class="camera-btn active" id="camFront" data-facing="user">
                <span class="icon">🤳</span> Camera trước
            </button>
            <button class="camera-btn" id="camBack" data-facing="environment">
                <span class="icon">📷</span> Camera sau
            </button>
            <button class="camera-btn" id="btnFlipMirror">
                <span class="icon">🔄</span> Lật gương
            </button>
        </div>

        <div class="ram-settings">
            <label>
                💾 Giới hạn RAM:
                <select id="ramSelect">
                    <option value="50">50 MB</option>
                    <option value="100">100 MB</option>
                    <option value="200" selected>200 MB (Mặc định)</option>
                    <option value="300">300 MB</option>
                    <option value="500">500 MB</option>
                    <option value="1000">1 GB</option>
                    <option value="0">Không giới hạn</option>
                </select>
            </label>
            <div class="ram-info">
                <span id="usedRamText">0 MB</span>
                <div class="bar">
                    <div class="fill green" id="ramBar" style="width:0%"></div>
                </div>
                <span id="maxRamText">200 MB</span>
            </div>
        </div>

        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Chưa bắt đầu</span>
            <span class="status-time" id="statusTime">00:00</span>
        </div>

        <div class="info">
            <div class="info-item">
                📦 Số đoạn

            </div>
            <div class="info-item">
                ⏱️ Thời lượng

            </div>

                📊 Dung lượng
                <span id="totalSize">0 KB</span>
            </div>
            <div class="info-item">
                📷 Camera
                <span id="cameraStatus">Trước</span>
            </div>
            <div class="info-item">
                🚀 Tốc độ
                <span id="speedDisplay">0 km/h</span>
            </div>

                📈 Mức RAM
                <span id="ramStatus">✅ Bình thường</span>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-start" id="btnStart">▶ Bắt đầu</button>
            <button class="btn btn-stop" id="btnStop" disabled>⏹ Dừng</button>
            <button class="btn btn-save" id="btnSave" disabled>💾 Lưu video</button>
        </div>

        <div class="download-link" id="downloadLink">
            <a href="#" id="downloadAnchor" download="video.webm">📥 Tải video xuống</a>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        // TOAST
        // ============================================================
        let toastTimeout = null;

        function showToast(message, duration = 2500, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        // ============================================================
        // GPS TRACKER - TÍNH TỐC ĐỘ
        // ============================================================
        class GPSTracker {
            constructor() {
                this.watchId = null;
                this.currentSpeed = 0; // km/h
                this.currentAccuracy = null;
                this.isActive = false;
                this.hasFix = false;

                // Lưu vị trí cũ để tính tốc độ
                this.lastPosition = null;
                this.lastTime = null;

                // DOM elements
                this.statusDot = document.getElementById('gpsDot');
                this.statusText = document.getElementById('gpsStatus');
                this.accuracyText = document.getElementById('gpsAccuracy');
                this.speedDisplay = document.getElementById('speedDisplay');

                // Callback khi có cập nhật
                this.onUpdate = null;
            }

            start() {
                if (!navigator.geolocation) {
                    this.statusText.textContent = '❌ GPS không được hỗ trợ';
                    this.statusDot.className = 'dot red';
                    showToast('❌ Trình duyệt không hỗ trợ GPS', 3000, 'danger');
                    return false;
                }

                this.isActive = true;

                this.watchId = navigator.geolocation.watchPosition(
                    (position) => this.onPositionUpdate(position),
                    (error) => this.onError(error), {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 1000,
                    }
                );

                this.statusText.textContent = '🔄 Đang kết nối GPS...';
                this.statusDot.className = 'dot yellow';
                return true;
            }

            stop() {
                this.isActive = false;
                if (this.watchId !== null) {
                    navigator.geolocation.clearWatch(this.watchId);
                    this.watchId = null;
                }
                this.statusText.textContent = '⏸ GPS đã dừng';
                this.statusDot.className = 'dot red';
                this.currentSpeed = 0;
                this.speedDisplay.textContent = '0 km/h';
            }

            onPositionUpdate(position) {
                if (!this.isActive) return;

                const coords = position.coords;
                const speed = coords.speed; // m/s

                // Nếu GPS có speed trực tiếp (chính xác hơn)
                if (speed !== null && speed !== undefined && speed >= 0) {
                    this.currentSpeed = speed * 3.6; // m/s -> km/h
                } else {
                    // Tính speed từ khoảng cách và thời gian
                    const lat = coords.latitude;
                    const lng = coords.longitude;
                    const accuracy = coords.accuracy;
                    const timestamp = position.timestamp;

                    if (this.lastPosition) {
                        const distance = this.calculateDistance(
                            this.lastPosition.lat, this.lastPosition.lng,
                            lat, lng
                        );
                        const timeDiff = (timestamp - this.lastTime) / 1000; // giây

                        if (timeDiff > 0 && distance > 1) { // > 1 mét mới tính
                            const speedMs = distance / timeDiff;
                            this.currentSpeed = speedMs * 3.6; // m/s -> km/h
                        }
                    }

                    this.lastPosition = { lat, lng };
                    this.lastTime = timestamp;
                }

                // Làm tròn
                this.currentSpeed = Math.round(this.currentSpeed * 10) / 10;

                // Cập nhật UI
                this.hasFix = true;
                this.statusDot.className = 'dot green';
                this.statusText.textContent = '✅ GPS đã kết nối';
                this.speedDisplay.textContent = this.currentSpeed + ' km/h';

                // Độ chính xác
                if (coords.accuracy) {
                    this.currentAccuracy = Math.round(coords.accuracy);
                    this.accuracyText.textContent = `Độ chính xác: ±${this.currentAccuracy}m`;
                }

                // Gọi callback
                if (this.onUpdate) this.onUpdate(this.currentSpeed);
            }

            onError(error) {
                console.warn('GPS Error:', error);
                this.hasFix = false;
                this.statusDot.className = 'dot red';

                switch (error.code) {
                    case error.PERMISSION_DENIED:
                        this.statusText.textContent = '❌ Quyền GPS bị từ chối';
                        showToast('⚠️ Vui lòng cấp quyền truy cập vị trí', 3000, 'warning');
                        break;
                    case error.POSITION_UNAVAILABLE:
                        this.statusText.textContent = '📡 Không có tín hiệu GPS';
                        break;
                    case error.TIMEOUT:
                        this.statusText.textContent = '⏰ GPS timeout, đang thử lại...';
                        break;
                    default:
                        this.statusText.textContent = '❌ Lỗi GPS: ' + error.message;
                }

                // Không reset speed, giữ giá trị cũ
            }

            // Tính khoảng cách 2 điểm (Haversine formula)
            calculateDistance(lat1, lon1, lat2, lon2) {
                const R = 6371000; // bán kính trái đất (mét)
                const dLat = this.toRad(lat2 - lat1);
                const dLon = this.toRad(lon2 - lon1);
                const a =
                    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(this.toRad(lat1)) * Math.cos(this.toRad(lat2)) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                return R * c;
            }

            toRad(deg) {
                return deg * Math.PI / 180;
            }

            getSpeed() {
                return this.currentSpeed;
            }

            hasFix() {
                return this.hasFix;
            }
        }

        // ============================================================
        // OVERLAY: VẼ THỜI GIAN & TỐC ĐỘ LÊN VIDEO
        // ============================================================
        class VideoOverlay {
            constructor(canvasId, videoId, gpsTracker) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.video = document.getElementById(videoId);
                this.gps = gpsTracker;
                this.isActive = false;

                this.animationId = null;
            }

            resize() {
                const rect = this.video.getBoundingClientRect();
                this.canvas.width = rect.width;
                this.canvas.height = rect.height;
            }

            start() {
                this.isActive = true;
                this.resize();
                this.drawLoop();
            }

            stop() {
                this.isActive = false;
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                    this.animationId = null;
                }
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            }

            drawLoop() {
                if (!this.isActive) return;
                this.draw();
                this.animationId = requestAnimationFrame(() => this.drawLoop());
            }

            draw() {
                const ctx = this.ctx;
                const w = this.canvas.width;
                const h = this.canvas.height;

                ctx.clearRect(0, 0, w, h);

                // ===== THÔNG TIN =====
                const now = new Date();
                const timeStr = now.toLocaleTimeString('vi-VN', {
                    hour12: false,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
                const dateStr = now.toLocaleDateString('vi-VN', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                });

                const speed = this.gps.getSpeed();
                const speedText = speed > 0 ? `${speed.toFixed(1)} km/h` : '0 km/h';

                // ===== CHỌN VỊ TRÍ HIỂN THỊ =====
                const padding = 14;
                const fontSize = Math.max(18, Math.min(28, w / 35));
                const smallFont = fontSize * 0.7;

                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';

                // Đo chiều rộng
                ctx.font = `bold ${fontSize}px 'Courier New', monospace`;
                const timeMetrics = ctx.measureText(`${dateStr} - ${timeStr}`);
                ctx.font = `bold ${smallFont}px 'Courier New', monospace`;
                const speedMetrics = ctx.measureText(`🚀 ${speedText}`);

                const textWidth = Math.max(timeMetrics.width, speedMetrics.width) + padding * 2 + 20;
                const lineHeight = fontSize + 8;
                const totalHeight = lineHeight * 2 + padding * 2;

                const x = 12;
                const y = 12;

                // ===== VẼ BACKGROUND =====
                const radius = 12;
                ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
                ctx.shadowBlur = 20;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;

                ctx.beginPath();
                ctx.moveTo(x + radius, y);
                ctx.lineTo(x + textWidth - radius, y);
                ctx.quadraticCurveTo(x + textWidth, y, x + textWidth, y + radius);
                ctx.lineTo(x + textWidth, y + totalHeight - radius);
                ctx.quadraticCurveTo(x + textWidth, y + totalHeight, x + textWidth - radius, y + totalHeight);
                ctx.lineTo(x + radius, y + totalHeight);
                ctx.quadraticCurveTo(x, y + totalHeight, x, y + totalHeight - radius);
                ctx.lineTo(x, y + radius);
                ctx.quadraticCurveTo(x, y, x + radius, y);
                ctx.closePath();

                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // ===== VẼ TEXT =====
                // Dòng 1: Thời gian
                ctx.fillStyle = '#ffffff';
                ctx.font = `bold ${fontSize}px 'Courier New', monospace`;
                ctx.fillText(`${dateStr} - ${timeStr}`, x + padding, y + 4);

                // Dòng 2: Tốc độ
                const speedColor = speed > 50 ? '#f44336' : speed > 30 ? '#ff9800' : '#4caf50';
                ctx.fillStyle = speedColor;
                ctx.font = `bold ${smallFont}px 'Courier New', monospace`;
                ctx.fillText(`🚀 ${speedText}`, x + padding, y + lineHeight + 4);

                // Thêm icon GPS nếu có tín hiệu
                if (this.gps.hasFix()) {
                    ctx.fillStyle = '#4caf50';
                    ctx.font = `${smallFont}px 'Courier New', monospace`;
                    ctx.fillText('📡', x + textWidth - 30, y + lineHeight + 4);
                }
            }
        }

        // ============================================================
        // RING BUFFER RECORDER
        // ============================================================
        class RingVideoRecorder {
            constructor(maxDurationMs = 15 * 60 * 1000, maxRamMB = 200) {
                this.maxDurationMs = maxDurationMs;
                this.maxRamBytes = maxRamMB * 1024 * 1024;
                this.segmentDurationMs = 1000;

                this.buffer = [];
                this.totalSize = 0;
                this.totalDuration = 0;

                this.recorder = null;
                this.stream = null;
                this.isRecording = false;
                this.startTime = null;
                this.timerInterval = null;

                this.currentFacingMode = 'user';
                this.isMirrored = true;
                this.mimeType = 'video/webm;codecs=vp8,opus';

                this.onUpdate = null;
                this.isRamFull = false;

                this.firstChunk = null;
                this.hasHeader = false;

                this.totalChunksRemoved = 0;
                this.autoAdjustCount = 0;
            }

            setMaxRam(mb) {
                this.maxRamBytes = mb * 1024 * 1024;
                this.checkRamLimit();
                if (this.onUpdate) this.onUpdate();
            }

            checkRamLimit() {
                if (this.maxRamBytes === 0) {
                    this.isRamFull = false;
                    return;
                }
                const usagePercent = (this.totalSize / this.maxRamBytes) * 100;
                this.isRamFull = usagePercent >= 95;
            }

            autoAdjustRam() {
                if (this.maxRamBytes === 0 || this.buffer.length === 0) return;

                const usagePercent = (this.totalSize / this.maxRamBytes) * 100;

                if (usagePercent > 90) {
                    const removeCount = Math.max(1, Math.floor(this.buffer.length * 0.05));
                    for (let i = 0; i < removeCount && this.buffer.length > 1; i++) {
                        const oldest = this.buffer.shift();
                        if (oldest) {
                            this.totalSize -= oldest.size;
                            this.totalDuration -= this.segmentDurationMs;
                            this.totalChunksRemoved++;
                        }
                    }
                    this.autoAdjustCount++;
                }

                if (usagePercent > 95) {
                    const removeCount = Math.max(2, Math.floor(this.buffer.length * 0.15));
                    for (let i = 0; i < removeCount && this.buffer.length > 1; i++) {
                        const oldest = this.buffer.shift();
                        if (oldest) {
                            this.totalSize -= oldest.size;
                            this.totalDuration -= this.segmentDurationMs;
                            this.totalChunksRemoved++;
                        }
                    }
                    this.autoAdjustCount += 2;
                }

                this.ensureHeader();
                this.checkRamLimit();
                if (this.onUpdate) this.onUpdate();
            }

            ensureHeader() {
                if (!this.firstChunk || this.buffer.length === 0) return;
                if (this.buffer[0] !== this.firstChunk) {
                    const index = this.buffer.indexOf(this.firstChunk);
                    if (index > 0) {
                        this.buffer.splice(index, 1);
                        this.totalSize -= this.firstChunk.size;
                        this.totalDuration -= this.segmentDurationMs;
                    }
                    this.buffer.unshift(this.firstChunk);
                    this.totalSize += this.firstChunk.size;
                    this.totalDuration += this.segmentDurationMs;
                }
            }

            async getCamera(facingMode = 'user') {
                const constraints = {
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                    },
                    audio: true,
                };
                return await navigator.mediaDevices.getUserMedia(constraints);
            }

            async start(facingMode = null) {
                try {
                    if (this.stream) {
                        this.stream.getTracks().forEach(track => track.stop());
                        this.stream = null;
                    }

                    const mode = facingMode || this.currentFacingMode;
                    this.stream = await this.getCamera(mode);
                    this.currentFacingMode = mode;

                    const videoEl = document.getElementById('videoPreview');
                    videoEl.srcObject = this.stream;
                    await videoEl.play();
                    this.applyMirror();

                    this.buffer = [];
                    this.totalSize = 0;
                    this.totalDuration = 0;
                    this.firstChunk = null;
                    this.hasHeader = false;
                    this.isRamFull = false;
                    this.totalChunksRemoved = 0;
                    this.autoAdjustCount = 0;

                    this.recorder = new MediaRecorder(this.stream, {
                        mimeType: this.mimeType,
                    });

                    this.recorder.start(this.segmentDurationMs);

                    this.recorder.ondataavailable = (event) => {
                        if (event.data.size === 0) return;

                        if (!this.hasHeader) {
                            this.firstChunk = event.data;
                            this.hasHeader = true;
                        }

                        this.buffer.push(event.data);
                        this.totalSize += event.data.size;
                        this.totalDuration += this.segmentDurationMs;

                        while (this.totalDuration > this.maxDurationMs && this.buffer.length > 0) {
                            const oldest = this.buffer.shift();
                            if (oldest) {
                                this.totalSize -= oldest.size;
                                this.totalDuration -= this.segmentDurationMs;
                            }
                        }

                        if (this.buffer.length % 10 === 0) {
                            this.autoAdjustRam();
                        }

                        let loopCount = 0;
                        while (this.maxRamBytes > 0 &&
                            this.totalSize > this.maxRamBytes &&
                            this.buffer.length > 1) {
                            const oldest = this.buffer.shift();
                            if (oldest) {
                                this.totalSize -= oldest.size;
                                this.totalDuration -= this.segmentDurationMs;
                                this.totalChunksRemoved++;
                            }
                            loopCount++;
                            if (loopCount > 100) break;
                        }

                        this.ensureHeader();
                        this.checkRamLimit();

                        if (this.onUpdate) this.onUpdate();
                    };

                    this.isRecording = true;
                    this.startTime = Date.now();

                    this.timerInterval = setInterval(() => {
                        if (this.isRecording) {
                            this.autoAdjustRam();
                        }
                        if (this.onUpdate) this.onUpdate();
                    }, 2000);

                    if (this.onUpdate) this.onUpdate();
                    return true;
                } catch (err) {
                    console.error('Lỗi:', err);
                    showToast('❌ Không thể truy cập camera!', 3000, 'danger');
                    return false;
                }
            }

            stop() {
                if (this.recorder && this.isRecording) {
                    this.recorder.stop();
                    this.isRecording = false;
                    if (this.timerInterval) {
                        clearInterval(this.timerInterval);
                        this.timerInterval = null;
                    }
                    if (this.onUpdate) this.onUpdate();
                }
            }

            save() {
                if (this.buffer.length === 0) {
                    showToast('⚠️ Chưa có dữ liệu video!', 2000);
                    return null;
                }

                try {
                    let chunks = [...this.buffer];
                    if (this.firstChunk && !chunks.includes(this.firstChunk)) {
                        chunks.unshift(this.firstChunk);
                    }

                    const blob = new Blob(chunks, {
                        type: 'video/webm'
                    });

                    if (blob.size === 0) {
                        showToast('❌ File rỗng!', 2000, 'danger');
                        return null;
                    }

                    return blob;
                } catch (err) {
                    console.error('Lỗi khi tạo blob:', err);
                    showToast('❌ Lỗi tạo file video!', 3000, 'danger');
                    return null;
                }
            }

            async switchCamera(facingMode) {
                if (facingMode === this.currentFacingMode) {
                    showToast('ℹ️ Đã ở camera này rồi!', 1500);
                    return false;
                }

                const wasRecording = this.isRecording;
                if (wasRecording) {
                    this.stop();
                }

                try {
                    const success = await this.start(facingMode);
                    if (success) {
                        this.currentFacingMode = facingMode;
                        const label = facingMode === 'user' ? 'Trước' : 'Sau';
                        showToast(`✅ Đã chuyển sang camera ${label}`, 1500);
                        if (this.onUpdate) this.onUpdate();
                        return true;
                    }
                    return false;
                } catch (err) {
                    showToast('❌ Không thể chuyển camera!', 2000, 'danger');
                    return false;
                }
            }

            applyMirror() {
                const videoEl = document.getElementById('videoPreview');
                if (this.isMirrored && this.currentFacingMode === 'user') {
                    videoEl.style.transform = 'scaleX(-1)';
                } else {
                    videoEl.style.transform = 'scaleX(1)';
                }
            }

            toggleMirror() {
                this.isMirrored = !this.isMirrored;
                this.applyMirror();
                showToast(this.isMirrored ? '🔄 Đã bật gương' : '🔄 Đã tắt gương', 1500);
                if (this.onUpdate) this.onUpdate();
            }

            reset() {
                this.stop();
                this.buffer = [];
                this.totalSize = 0;
                this.totalDuration = 0;
                this.firstChunk = null;
                this.hasHeader = false;
                this.totalChunksRemoved = 0;
                this.autoAdjustCount = 0;
                if (this.onUpdate) this.onUpdate();
            }

            getSegmentCount() {
                return this.buffer.length;
            }

            getElapsedSeconds() {
                if (!this.startTime) return 0;
                return Math.floor((Date.now() - this.startTime) / 1000);
            }

            getRamUsagePercent() {
                if (this.maxRamBytes === 0) return 0;
                return Math.min((this.totalSize / this.maxRamBytes) * 100, 100);
            }

            formatTime(ms) {
                const totalSec = Math.floor(ms / 1000);
                const min = String(Math.floor(totalSec / 60)).padStart(2, '0');
                const sec = String(totalSec % 60).padStart(2, '0');
                return `${min}:${sec}`;
            }

            formatSize(bytes) {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / 1048576).toFixed(1) + ' MB';
            }

            getMaxRamMB() {
                return this.maxRamBytes / (1024 * 1024);
            }

            getAutoAdjustCount() {
                return this.autoAdjustCount;
            }

            getTotalChunksRemoved() {
                return this.totalChunksRemoved;
            }
        }

        // ============================================================
        // UI CONTROLLER
        // ============================================================

        // Khởi tạo GPS
        const gps = new GPSTracker();

        // Khởi tạo Recorder
        const recorder = new RingVideoRecorder(15 * 60 * 1000, 200);

        // Khởi tạo Overlay
        const overlay = new VideoOverlay('overlayCanvas', 'videoPreview', gps);

        const videoPreview = document.getElementById('videoPreview');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const statusTime = document.getElementById('statusTime');
        const segmentCount = document.getElementById('segmentCount');
        const totalDuration = document.getElementById('totalDuration');
        const totalSize = document.getElementById('totalSize');
        const cameraStatus = document.getElementById('cameraStatus');
        const ramStatus = document.getElementById('ramStatus');
        const usedRamText = document.getElementById('usedRamText');
        const maxRamText = document.getElementById('maxRamText');
        const ramBar = document.getElementById('ramBar');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const btnSave = document.getElementById('btnSave');
        const btnFlipMirror = document.getElementById('btnFlipMirror');
        const camFront = document.getElementById('camFront');
        const camBack = document.getElementById('camBack');
        const downloadLink = document.getElementById('downloadLink');
        const downloadAnchor = document.getElementById('downloadAnchor');
        const ramSelect = document.getElementById('ramSelect');

        function updateUI() {
            const count = recorder.getSegmentCount();
            const sizeMB = recorder.totalSize / (1024 * 1024);
            const maxMB = recorder.getMaxRamMB();

            segmentCount.textContent = count;
            totalDuration.textContent = (recorder.totalDuration / 1000).toFixed(1) + 's';
            totalSize.textContent = recorder.formatSize(recorder.totalSize);

            usedRamText.textContent = sizeMB.toFixed(1) + ' MB';
            maxRamText.textContent = maxMB === 0 ? '♾️' : maxMB + ' MB';

            const usagePercent = recorder.getRamUsagePercent();
            ramBar.style.width = Math.min(usagePercent, 100) + '%';

            ramBar.className = 'fill';
            if (usagePercent >= 95) {
                ramBar.classList.add('red');
            } else if (usagePercent >= 80) {
                ramBar.classList.add('yellow');
            } else {
                ramBar.classList.add('green');
            }

            if (recorder.maxRamBytes === 0) {
                ramStatus.textContent = '♾️ Không giới hạn';
                ramStatus.style.color = '#64b5f6';
            } else if (usagePercent >= 95) {
                ramStatus.textContent = `🔥 Gần đầy (${Math.round(usagePercent)}%)`;
                ramStatus.style.color = '#f44336';
            } else if (usagePercent >= 80) {
                ramStatus.textContent = `⚡ Đang cao (${Math.round(usagePercent)}%)`;
                ramStatus.style.color = '#ff9800';
            } else {
                ramStatus.textContent = `✅ Bình thường (${Math.round(usagePercent)}%)`;
                ramStatus.style.color = '#4caf50';
            }

            const camLabel = recorder.currentFacingMode === 'user' ? 'Trước 🤳' : 'Sau 📷';
            cameraStatus.textContent = camLabel;

            camFront.classList.toggle('active', recorder.currentFacingMode === 'user');
            camBack.classList.toggle('active', recorder.currentFacingMode === 'environment');

            if (recorder.isRecording) {
                statusDot.className = 'status-dot recording';
                statusText.textContent = '🔴 Đang quay';
                const elapsed = recorder.getElapsedSeconds();
                const min = String(Math.floor(elapsed / 60)).padStart(2, '0');
                const sec = String(elapsed % 60).padStart(2, '0');
                statusTime.textContent = `${min}:${sec}`;

                if (recorder.getAutoAdjustCount() > 0) {
                    document.querySelector('.subtitle').textContent =
                        `🔄 Đã tự động điều chỉnh ${recorder.getAutoAdjustCount()} lần, xóa ${recorder.getTotalChunksRemoved()} đoạn`;
                }
            } else {
                statusDot.className = 'status-dot';
                statusText.textContent = '⏸ Đã dừng';
                if (count > 0) {
                    statusTime.textContent = recorder.formatTime(recorder.totalDuration);
                } else {
                    statusTime.textContent = '00:00';
                    document.querySelector('.subtitle').textContent = 'Hiển thị thời gian & tốc độ GPS trên video';
                }
            }

            btnStart.disabled = recorder.isRecording;
            btnStop.disabled = !recorder.isRecording;
            btnSave.disabled = (count === 0);

            camFront.disabled = recorder.isRecording;
            camBack.disabled = recorder.isRecording;
            btnFlipMirror.disabled = recorder.isRecording;

            if (count === 0) {
                downloadLink.style.display = 'none';
            }
        }

        recorder.onUpdate = updateUI;

        // ===== SỰ KIỆN =====

        ramSelect.addEventListener('change', function() {
            const value = parseInt(this.value);
            if (value === 0) {
                showToast('♾️ Đã tắt giới hạn RAM', 1500);
            } else {
                showToast(`💾 Đã đặt giới hạn RAM: ${value} MB`, 1500);
            }
            recorder.setMaxRam(value);
            updateUI();
        });

        btnStart.addEventListener('click', async () => {
            // Bắt đầu GPS
            gps.start();

            // Bắt đầu quay
            const ok = await recorder.start(recorder.currentFacingMode);
            if (ok) {
                downloadLink.style.display = 'none';
                overlay.start();
                showToast('🎥 Đã bắt đầu quay + GPS!', 1500);
                updateUI();
            }
        });

        btnStop.addEventListener('click', () => {
            recorder.stop();
            gps.stop();
            overlay.stop();
            showToast('⏹ Đã dừng quay', 1500);
            updateUI();
        });

        btnSave.addEventListener('click', () => {
            const blob = recorder.save();

            if (!blob || blob.size === 0) {
                showToast('❌ Không thể tạo file video!', 3000, 'danger');
                return;
            }

            const url = URL.createObjectURL(blob);
            downloadAnchor.href = url;

            const now = new Date();
            const dateStr =
                `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}h${String(now.getMinutes()).padStart(2,'0')}`;
            const camLabel = recorder.currentFacingMode === 'user' ? 'truoc' : 'sau';
            downloadAnchor.download = `video_${camLabel}_${dateStr}.webm`;

            downloadLink.style.display = 'block';
            setTimeout(() => {
                downloadAnchor.click();
                setTimeout(() => {
                    URL.revokeObjectURL(url);
                }, 5000);
            }, 300);

            const sizeMB = (blob.size / 1048576).toFixed(1);
            const durationSec = (recorder.totalDuration / 1000).toFixed(1);
            showToast(`✅ Đã lưu ${sizeMB} MB (${durationSec}s)`, 2500);
            statusText.textContent = `✅ Đã lưu ${sizeMB} MB`;
        });

        camFront.addEventListener('click', async () => {
            await recorder.switchCamera('user');
            updateUI();
        });

        camBack.addEventListener('click', async () => {
            await recorder.switchCamera('environment');
            updateUI();
        });

        btnFlipMirror.addEventListener('click', () => {
            recorder.toggleMirror();
            updateUI();
        });

        // Reset UI
        updateUI();

        window.addEventListener('beforeunload', () => {
            recorder.stop();
            gps.stop();
            overlay.stop();
        });

        console.log('🎥 Ring Buffer Recorder với GPS Speed!');
        console.log(`📐 RAM tối đa: ${recorder.getMaxRamMB()} MB`);
        console.log(`📷 Camera hiện tại: ${recorder.currentFacingMode}`);
        console.log(`🎬 Codec: ${recorder.mimeType}`);
        console.log('📍 GPS sẽ tự động tính tốc độ khi di chuyển');
    </script>
